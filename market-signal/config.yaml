# ---------------------------------------------------------------
# إعدادات أداة الإشارة الشخصية
# عدّل هنا فقط — لا حاجة لتعديل الكود
# ---------------------------------------------------------------

account:
  equity: 10000          # رأس المال بالدولار (لحساب حجم المركز)
  risk_pct: 0.01         # أقصى خسارة مقبولة لكل صفقة (1% = 0.01)

benchmark: SPY

# بوابة جودة البيانات — ترفض الحكم قبل أي حساب
gate:
  max_data_age_min: 20       # أقصى تأخر مقبول للبيانات (دقائق)
  min_adv_usd: 5000000       # أدنى متوسط قيمة تداول يومية (دولار)
  min_price: 3.0             # تجاهل الأسهم دون هذا السعر
  earnings_blackout_days: 2  # لا حكم إذا كانت النتائج خلال هذه المدة
  min_intraday_bars: 6       # أدنى عدد شموع لحظية لليوم الحالي

# أوزان العوامل — مجموعها يجب أن يساوي 1.0
weights:
  regime: 0.22         # بيئة السوق العامة والقطاع
  rvol: 0.20           # الحجم النسبي
  rel_strength: 0.20   # القوة النسبية مقابل المؤشر
  levels: 0.20         # الموقع من VWAP والمستويات
  catalyst: 0.10       # وجود محفّز اليوم
  extension: 0.08      # عقوبة التمدد المفرط (سالبة فقط)

# عتبات القرار
decision:
  green_score: 0.35        # أدنى نتيجة للضوء الأخضر
  red_score: -0.35         # أعلى نتيجة للضوء الأحمر
  min_agreeing_core: 3     # عدد العوامل الأساسية الموجبة المطلوبة للأخضر
  max_extension_penalty: -0.6   # تمدد أشد من هذا يلغي الأخضر
  min_completeness: 0.60        # أدنى نسبة أوزان متوفّرة للحكم (مهم للقطات الشاشة)

# إدارة المخاطر
risk:
  max_stop_pct: 0.06       # وقف أبعد من هذا = تحذير
  max_pct_of_adv: 0.01     # لا تتجاوز 1% من متوسط الحجم اليومي
  max_position_pct: 0.25   # لا يتجاوز المركز الواحد 25% من رأس المال

watchlist:
  - AAPL
  - MSFT
  - NVDA
  - AMD
  - META
