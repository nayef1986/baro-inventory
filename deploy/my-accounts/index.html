<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#556b2f">
<title>حساباتي</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@500;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.47.10/dist/umd/supabase.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.bundle.js"></script>
<style>
  :root{
    --bg:#f2ebdd; --card:#fbf7ee; --ink:#2b2a20; --muted:#6b6553; --line:#e0d5bf;
    --brand:#556b2f; --brand-ink:#fbf7ee; --soft:#e7e8cf; --in:#3f6b1e; --out:#a63d2a; --warn:#a1620b;
    --radius:16px;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#1c1a14; --card:#26241c; --ink:#efe8d8; --muted:#b0a78f; --line:#3b3729;
      --brand:#a5b870; --brand-ink:#1c1a14; --soft:#323722; --in:#a3c76d; --out:#e8836d; --warn:#e0b04f;
    }
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{background:var(--bg);color:var(--ink);font-family:Tajawal,system-ui,sans-serif;font-size:21px;font-weight:500;line-height:1.6}
  button,input,select,textarea{font:inherit;color:inherit}
  .wrap{max-width:820px;margin:0 auto;padding:16px 16px 80px}
  .muted{color:var(--muted)} .small{font-size:18px}
  .in{color:var(--in)} .out{color:var(--out)} .warn{color:var(--warn)}
  .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}

  /* الرأس */
  header.top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:16px}
  header.top h1{font-size:31px;margin:0;font-weight:800;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .pill{display:inline-block;background:var(--soft);color:var(--brand);border-radius:99px;padding:3px 13px;font-size:18px;font-weight:800}

  /* المربعات */
  .tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:14px}
  .tiles.three{grid-template-columns:repeat(3,1fr)}
  .tile{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;display:flex;flex-direction:column;gap:4px;text-align:right;min-height:118px}
  button.tile{cursor:pointer}
  button.tile:hover{border-color:var(--brand)}
  .tile .lbl{font-size:18px;color:var(--muted);font-weight:700}
  .tile .big{font-size:30px;font-weight:900;font-variant-numeric:tabular-nums;line-height:1.25}
  .tile .foot{margin-top:auto;font-size:17px;color:var(--muted)}
  .tile.hero{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
  .tile.hero .lbl,.tile.hero .foot{color:inherit;opacity:.85}
  .tile.ledger{min-height:170px}
  .tile.ledger .name{font-size:24px;font-weight:900}
  .tile.act{align-items:center;justify-content:center;text-align:center;min-height:100px;font-weight:800;font-size:20px}
  .tile.act .ic{font-size:32px;line-height:1}
  .tile.act.primary{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
  .span2{grid-column:1/-1}

  /* البطاقات والقوائم */
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;margin-bottom:12px}
  .period{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;align-items:end}
  .period>*{min-width:0} .period input{min-width:0}
  .seg-tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:5px;margin-bottom:12px}
  .seg-tabs button{border:0;background:transparent;border-radius:10px;padding:11px 4px;cursor:pointer;font-weight:800;font-size:19px;color:var(--muted)}
  .seg-tabs button.on{background:var(--brand);color:var(--brand-ink)}
  .list{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;margin-bottom:12px}
  .item{display:flex;justify-content:space-between;gap:12px;padding:13px 16px;border-bottom:1px solid var(--line)}
  .item:last-child{border-bottom:0}
  .item.tap{cursor:pointer} .item.tap:hover{background:var(--soft)}
  .item .t{font-weight:700;overflow-wrap:anywhere}
  .item .s{font-size:18px;color:var(--muted)}
  .item .v{text-align:left;white-space:nowrap;font-variant-numeric:tabular-nums}
  .item .v b{font-size:24px;font-weight:900}
  .item.head{background:var(--soft);color:var(--brand);font-weight:800;padding:10px 16px}
  .item.sum{background:var(--soft);font-weight:800}
  .seq{display:inline-block;min-width:2em;text-align:center;background:var(--soft);color:var(--brand);border-radius:8px;padding:0 6px;margin-left:6px;font-weight:800;font-size:18px}
  .chips{display:flex;flex-wrap:wrap;gap:6px}
  .chip{border:1.5px solid var(--line);background:var(--card);border-radius:99px;padding:7px 14px;font-size:18px;font-weight:700;cursor:pointer;color:var(--muted)}
  .chip:hover{border-color:var(--c)}
  .chip.on{background:var(--c);border-color:var(--c);color:#fff;font-weight:800}
  .chip:disabled{opacity:.5}
  .split-sum{font-size:18px;background:var(--soft);border-radius:10px;padding:6px 10px}
  .split-row{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:10px;padding-bottom:10px;border-bottom:1px dashed var(--line)}
  .split-row [name=note]{grid-column:1/-1}
  .empty{text-align:center;padding:28px 12px;color:var(--muted)}
  .note{font-size:18px;color:var(--muted);margin:0 4px 10px}

  /* الأزرار والحقول */
  .btn{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:10px 16px;cursor:pointer;white-space:nowrap}
  .btn:hover{border-color:var(--brand)}
  .btn.primary{background:var(--brand);border-color:var(--brand);color:var(--brand-ink);font-weight:700}
  .btn.danger{color:var(--out)}
  .btn.ghost{border-color:transparent;background:transparent}
  .btn:disabled{opacity:.5;cursor:default}
  input,select,textarea{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:11px 14px}
  input:focus,select:focus,textarea:focus{outline:2px solid var(--brand);outline-offset:-1px}
  label{display:block;font-size:18px;font-weight:700;color:var(--muted);margin-bottom:4px}
  .field{margin-bottom:12px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .err{color:var(--out);font-size:19px;margin-top:8px}
  textarea{resize:vertical}
  bdi{white-space:nowrap}

  dialog{border:none;border-radius:var(--radius);padding:0;width:min(520px,calc(100vw - 24px));background:var(--card);color:var(--ink)}
  dialog::backdrop{background:rgba(0,0,0,.45)}
  dialog form{padding:18px}
  dialog h2{margin:0 0 14px;font-size:26px}
  .seg{display:flex;border:1px solid var(--line);border-radius:12px;overflow:hidden}
  .seg label{flex:1;margin:0;text-align:center;padding:9px;cursor:pointer;color:var(--ink);font-size:20px}
  .seg input{display:none}
  .seg label:has(input:checked){background:var(--soft);font-weight:800;color:var(--brand)}
  .center{min-height:80vh;display:grid;place-items:center}
  .login{width:min(400px,100%)}
  #print{display:none}
  @media (max-width:560px){
    .tiles.three{grid-template-columns:1fr 1fr}
    .tiles.three .tile:last-child{grid-column:1/-1}
    .grid2{grid-template-columns:1fr}
    .tile .big{font-size:26px}
    .period{grid-template-columns:1fr 1fr}
    .period .btn{grid-column:1/-1}
  }

  /* الطباعة / PDF — بنفس شكل تقارير مستودع باروو */
  @media print{
    @page{size:A4;margin:12mm}
    body{background:#fff;color:#1e293b;font-size:13px}
    #app,dialog{display:none!important}
    #print{display:block;direction:rtl}
    #print *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
    #print .p-head{border-bottom:3px solid #1e40af;padding-bottom:8px;margin-bottom:12px}
    #print h1{font-size:22px;color:#1e40af;margin:0 0 3px}
    #print .meta{font-size:12px;color:#64748b}
    #print .p-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px;margin-bottom:14px}
    #print .p-stat{background:#f1f5f9;border:1px solid #cbd5e1;border-radius:6px;padding:8px;text-align:center}
    #print .p-stat .v{font-size:17px;font-weight:900}
    #print .p-stat .l{font-size:11px;color:#64748b;margin-top:2px}
    #print h2{font-size:16px;color:#1e40af;margin:14px 0 6px}
    #print table{width:100%;border-collapse:collapse;font-size:12.5px}
    #print th{background:#1e40af;color:#fff;padding:7px 8px;text-align:right;font-size:12px;border:none}
    #print td{padding:6px 8px;border-bottom:1px solid #e2e8f0;text-align:right}
    #print tr.data:nth-child(even) td{background:#f8fafc}
    #print td.n{text-align:center;white-space:nowrap}
    #print .g{color:#16a34a;font-weight:700} #print .r{color:#dc2626;font-weight:700}
    #print tr.grp td{background:#dbeafe;color:#1e40af;font-weight:800;font-size:13.5px;border-bottom:2px solid #1e40af}
    #print tr.sub td{background:#eff6ff;font-weight:700}
    #print tr.total td{background:#1e40af;color:#fff;font-weight:800}
    #print tr.total td.g,#print tr.total td.r{color:#fff}
    #print thead{display:table-header-group}
    #print tr{page-break-inside:avoid}
    #print section{margin-bottom:16px}
  }
</style>
</head>
<body>
<div id="app"></div>
<div id="print"></div>

<dialog id="dlg"><form method="dialog" id="dlgForm"></form></dialog>

<script src="export.js"></script>
<script src="ledger.js"></script>
<script src="bank.js"></script>
<script>
// ============================================================
// حساباتي — نسب العمولة: الحاويات (2.5%) ومبيعات الفروع (0.5%)
//
// هذا الملف: الدخول، تحميل البيانات، الأدوات المشتركة والرسم.
// منطق كل دفتر وكشفه وتصديره في ledger.js، والتنسيق في export.js.
// القاعدة: جدولا pa_container_invoices و pa_commission_receipts
// (migrations 0010 و0011) — كل صف مقفول على صاحبه.
// ============================================================

const SUPABASE_URL = 'https://tdlpikekpnxuzyfcvqzo.supabase.co'
const ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRkbHBpa2VrcG54dXp5ZmN2cXpvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk2ODg2NzIsImV4cCI6MjEwNTI2NDY3Mn0.jxKvvA_0ySwQVcRDAznZNwQwpwAOwjaj1M6CHY9F8uM'
const CURRENCY = 'ر.س'

const db = supabase.createClient(SUPABASE_URL, ANON_KEY, { auth: { persistSession: true, autoRefreshToken: true } })

const state = {
  user: null,
  invoices: [],      // بنود العمولة (فواتير حاويات / مبيعات فروع)
  receipts: [],      // الاستلامات
  bank: [],          // حوالات كشف البنك
  ledger: null,      // null = الرئيسية | 'containers' | 'branches' | 'bank'
  tab: 'statement',  // statement | items | receipts
  from: '', to: '',
  loading: true,
  error: '',
  recovery: false,
}

// ---------- أدوات ----------
const $ = (s, r = document) => r.querySelector(s)
const esc = (v) => String(v ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]))
const num = (v) => Number(v) || 0
const money = (v) => num(v).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 })
const pct = (v) => num(v).toLocaleString('en-US', { maximumFractionDigits: 3 }) + '%'
const dt = (d) => `<bdi dir="ltr">${esc(d)}</bdi>`
const today = () => new Date().toISOString().slice(0, 10)

function dateIn(d) {
  if (state.from && d < state.from) return false
  if (state.to && d > state.to) return false
  return true
}
function periodLabel() {
  // ⁦…⁩ يعزل التاريخ اتجاهياً فلا ينقلب داخل النص العربي (في PDF وExcel)
  const d = (v) => `⁦${v}⁩`
  if (state.from && state.to) return `من ${d(state.from)} إلى ${d(state.to)}`
  if (state.from) return `من ${d(state.from)}`
  if (state.to) return `حتى ${d(state.to)}`
  return 'كل الفترات'
}

// ---------- البيانات ----------
async function load() {
  state.loading = true; render()
  const [ci, cr, bk] = await Promise.all([
    db.from('pa_container_invoices').select('*'),
    db.from('pa_commission_receipts').select('*'),
    db.from('pa_bank_txns').select('*').range(0, 9999),
  ])
  // جدول البنك يأتي مع 0012 — قبله تعمل الصفحة بدونه
  state.bank = bk.error ? [] : bk.data.map((t) => ({ ...t, amount: num(t.amount) }))
  state.loading = false
  const bad = [ci, cr].find((r) => r.error)
  if (bad) { state.error = bad.error.message; return render() }
  state.error = ''
  // صفوف ما قبل 0011 بلا عمود ledger: كانت كلها للحاويات
  state.invoices = ci.data.map((r) => ({ ...r, ledger: r.ledger || 'containers' }))
  state.receipts = cr.data.map((r) => ({ ...r, ledger: r.ledger || 'containers' }))
  render()
}
async function run(promise) {
  const { error } = await promise
  if (error) {
    alert(/ledger/.test(error.message)
      ? 'قاعدة البيانات تحتاج تحديث بسيط (عمود ledger). شغّل ملف 0011 في Supabase ثم جرّب مرة ثانية.'
      : 'تعذّر الحفظ: ' + error.message)
    return false
  }
  await load()
  return true
}

// ---------- الرسم ----------
function render() {
  const app = $('#app')
  if (state.recovery) return (app.innerHTML = recoveryView())
  if (!state.user) return (app.innerHTML = loginView())
  const L = state.ledger && LEDGERS[state.ledger], isBank = state.ledger === 'bank'
  const back = '<button class="btn ghost" data-act="home" aria-label="رجوع">→</button>'
  app.innerHTML = `<div class="wrap">
    <header class="top">
      <h1>${L ? `${back}${esc(L.title)} <span class="pill">${pct(L.rate)}</span>` : isBank ? `${back}تحويلات البنك` : 'حساباتي'}</h1>
      ${L || isBank ? '' : '<button class="btn ghost small" data-act="logout">خروج</button>'}
    </header>
    ${state.error ? `<div class="card err">${esc(state.error)}</div>` : ''}
    ${state.loading && !state.invoices.length && !state.receipts.length && !state.bank.length ? '<div class="empty">جاري التحميل…</div>'
      : isBank ? bankView() : L ? ledgerView(state.ledger) : homeView()}
  </div>`
}

function periodBar() {
  return `<div class="card period">
    <div><label>من تاريخ</label><input type="date" data-period="from" value="${state.from}"></div>
    <div><label>إلى تاريخ</label><input type="date" data-period="to" value="${state.to}"></div>
    <button class="btn ${state.from || state.to ? '' : 'ghost'}" data-act="clearPeriod" ${state.from || state.to ? '' : 'disabled'}>الكل</button>
  </div>`
}

function loginView() {
  return `<div class="wrap center"><div class="card login">
    <h1 style="margin:0 0 4px">حساباتي</h1>
    <p class="muted small" style="margin:0 0 16px">ادخل بحسابك — بياناتك لا يشوفها غيرك.</p>
    <form id="loginForm">
      <div class="field"><label>البريد</label><input type="email" name="email" required autocomplete="email"></div>
      <div class="field"><label>كلمة المرور</label><input type="password" name="password" required minlength="6" autocomplete="current-password"></div>
      <div class="row"><button class="btn primary" style="flex:1" name="mode" value="in">دخول</button>
        <button class="btn" name="mode" value="up">حساب جديد</button></div>
      <div style="text-align:center;margin-top:10px"><button class="btn ghost small" name="mode" value="forgot" formnovalidate>نسيت كلمة المرور؟</button></div>
      <div class="err" id="loginErr">${esc(state.error)}</div>
    </form></div></div>`
}

/** بعد الضغط على رابط «نسيت كلمة المرور» في البريد: اختيار كلمة جديدة */
function recoveryView() {
  return `<div class="wrap center"><div class="card login">
    <h1 style="margin:0 0 4px">كلمة مرور جديدة</h1>
    <p class="muted small" style="margin:0 0 16px">اختر كلمة مرور جديدة (٦ أحرف أو أكثر) واحفظها عندك.</p>
    <form id="recoveryForm">
      <div class="field"><label>كلمة المرور الجديدة</label><input type="password" name="password" required minlength="6" autocomplete="new-password"></div>
      <div class="field"><label>أعدها مرة ثانية</label><input type="password" name="again" required minlength="6" autocomplete="new-password"></div>
      <button class="btn primary" style="width:100%">احفظ وادخل</button>
      <div class="err" id="recErr"></div>
    </form></div></div>`
}

// ---------- النوافذ ----------
function openDialog(html, onSubmit) {
  const dlg = $('#dlg'), form = $('#dlgForm')
  // زر حفظ مخفي أولاً: Enter يحفظ ولا يضغط «حذف» صدفة
  form.innerHTML = '<button value="save" style="display:none" aria-hidden="true" tabindex="-1"></button>' + html
  form.onsubmit = async (ev) => {
    const btn = ev.submitter
    if (btn?.value === 'cancel') return
    ev.preventDefault()
    btn.disabled = true
    const ok = await onSubmit(new FormData(form), btn?.value)
    btn.disabled = false
    if (ok !== false) dlg.close()
  }
  dlg.showModal()
  form.querySelector('input:not([type=hidden]):not([type=radio]):not([type=file])')?.focus()
}

// ---------- الأحداث ----------
document.addEventListener('click', async (ev) => {
  const t = ev.target.closest('[data-act]')
  if (!t || t.disabled) return
  switch (t.dataset.act) {
    case 'home': state.ledger = null; return render()
    case 'clearPeriod': state.from = state.to = ''; return render()
    case 'logout': await db.auth.signOut(); return
    default: if (!bankClick(t)) ledgerClick(t)
  }
})

document.addEventListener('change', (ev) => {
  const p = ev.target.dataset.period
  if (p) { state[p] = ev.target.value; render() }
})

document.addEventListener('submit', async (ev) => {
  if (ev.target.id === 'recoveryForm') {
    ev.preventDefault()
    const f = new FormData(ev.target), err = $('#recErr')
    if (f.get('password') !== f.get('again')) return (err.textContent = 'الكلمتين مو متطابقتين.')
    ev.submitter.disabled = true
    const { error } = await db.auth.updateUser({ password: f.get('password') })
    ev.submitter.disabled = false
    if (error) return (err.textContent = error.message)
    state.recovery = false
    history.replaceState(null, '', location.pathname)
    return load()
  }
  if (ev.target.id !== 'loginForm') return
  ev.preventDefault()
  const f = new FormData(ev.target), mode = ev.submitter?.value
  const creds = { email: f.get('email').trim(), password: f.get('password') }
  const err = $('#loginErr'); err.textContent = ''; err.style.color = ''
  if (mode === 'forgot') {
    if (!creds.email) return (err.textContent = 'اكتب بريدك أولاً، ثم اضغط «نسيت كلمة المرور».')
    ev.submitter.disabled = true
    const { error } = await db.auth.resetPasswordForEmail(creds.email, { redirectTo: location.origin + location.pathname })
    ev.submitter.disabled = false
    err.style.color = error ? '' : 'var(--in)'
    err.textContent = error ? error.message : 'أرسلنا لك رابط على بريدك. افتحه من نفس الجهاز واختر كلمة مرور جديدة.'
    return
  }
  ev.submitter.disabled = true
  const { data, error } = mode === 'up' ? await db.auth.signUp(creds) : await db.auth.signInWithPassword(creds)
  ev.submitter.disabled = false
  if (error) {
    err.textContent = /Invalid login/i.test(error.message) ? 'البريد أو كلمة المرور غلط.'
      : /not confirmed/i.test(error.message) ? 'أكّد بريدك أولاً من الرسالة اللي وصلتك.' : error.message
  } else if (mode === 'up' && data.user && !data.user.identities?.length) {
    // Supabase يردّ بلا خطأ على بريد مسجّل من قبل (حتى لا يكشف وجوده)
    err.textContent = 'هذا البريد مسجّل من قبل. اضغط «دخول»، وإذا نسيت كلمة المرور اضغط «نسيت كلمة المرور؟».'
  } else if (mode === 'up' && !data.session) {
    err.textContent = 'تم إنشاء الحساب. افتح الرسالة في بريدك وأكّد، ثم ادخل.'
  }
})

db.auth.onAuthStateChange((event, session) => {
  if (event === 'PASSWORD_RECOVERY') { state.recovery = true; state.user = session?.user ?? null; return render() }
  const was = state.user?.id
  state.user = session?.user ?? null
  if (!state.user) { state.invoices = []; state.receipts = []; state.bank = []; state.ledger = null; return render() }
  if (was !== state.user.id) load()
})
db.auth.getSession().then(({ data }) => { if (!data.session) render() })
</script>
</body>
</html>
