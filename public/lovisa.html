<style>
@import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;700;900&display=swap');
:root{--ink:#12100E;--velvet:#1C1815;--velvet-2:#241F1A;--gold:#C9A227;--gold-dim:#8A6F47;--cream:#EFE6D6;--muted:#9A8B75;--line:#2E271F}
*{font-family:'Tajawal',sans-serif;box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:var(--ink);color:var(--cream);padding-bottom:60px;line-height:1.6}
.wrap{max-width:860px;margin:0 auto;padding:16px}
.hd{padding:34px 0 22px;text-align:center;position:relative}
.hd::after{content:"";position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:52px;height:1px;background:var(--gold);opacity:.55}
.hd h1{font-size:32px;font-weight:900;letter-spacing:-.8px}
.hd .sub{font-size:13px;color:var(--muted);margin-top:8px;font-weight:300}
.note{background:rgba(201,162,39,.07);border:1px solid rgba(201,162,39,.22);border-radius:14px;padding:14px 16px;font-size:13px;color:var(--cream);line-height:1.75;margin:18px 0;font-weight:300}
.sect{margin-bottom:12px;background:var(--velvet);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.sect-hd{padding:16px 18px;cursor:pointer;display:flex;align-items:center;justify-content:space-between}
.sect-hd .t{font-size:18px;font-weight:900}
.sect-hd .en{font-size:12px;color:var(--muted);font-weight:300;margin-top:2px}
.sect-hd .c{color:var(--gold);font-size:14px;font-weight:700}
.sect-body{border-top:1px solid var(--line);padding:6px}
.item{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border-radius:11px;text-decoration:none;color:inherit}
.item:active{background:var(--velvet-2)}
.item .ar{font-size:15px;font-weight:400;color:var(--cream)}
.item .en{font-size:12px;color:var(--muted);font-weight:300;margin-top:1px}
.item .go{color:var(--gold-dim);font-size:13px}
.search{width:100%;background:var(--velvet-2);border:1px solid var(--line);color:var(--cream);border-radius:12px;padding:13px;font-family:'Tajawal';font-size:15px;margin-bottom:14px}
.search:focus{outline:none;border-color:var(--gold-dim)}
.search::placeholder{color:#6B5E4D}
.back{color:var(--gold);font-size:15px;font-weight:700;background:none;border:none;cursor:pointer;padding:10px 0;text-decoration:none;display:inline-block}
.empty{text-align:center;padding:50px 20px;color:var(--muted);font-weight:300}
</style>
</head>
<body>
<div class="wrap">
  <a href="labels.html" class="back">رجوع للمكتبة</a>
  <div class="hd">
    <h1>تصنيف Lovisa</h1>

  </div>

  <input class="search" id="q" placeholder="ابحث بالعربي أو الإنجليزي" oninput="doSearch(this.value)">

</div>

let openSection = null, query = "";

function esc(s){ return String(s??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }

function render(){
  const q = query.trim().toLowerCase();
  const app = document.getElementById("app");

  if (q){
    // نتائج البحث — كل التصنيفات المطابقة من كل الأقسام
    const hits = [];
    Object.entries(CATS).forEach(([key, sec]) => {
      sec.sub.forEach(s => {
        if (s.ar.toLowerCase().includes(q) || s.en.toLowerCase().includes(q))
          hits.push({ ...s, parent: sec.ar });
      });
      if (sec.ar.toLowerCase().includes(q) || sec.en.toLowerCase().includes(q))
        hits.push({ ar: sec.ar, en: sec.en, url: sec.url, parent: "قسم رئيسي" });
    });
    app.innerHTML = hits.length ? `<div class="sect"><div class="sect-body">` + hits.map(h => `
      <a class="item" href="${h.url}" target="_blank" rel="noopener noreferrer">
        <div><div class="ar">${esc(h.ar)}</div><div class="en">${esc(h.en)} · ${esc(h.parent)}</div></div>
        <span class="go">افتح</span>
      </a>`).join("") + `</div></div>`
      : `<div class="empty">ما فيه تصنيف بهذا الاسم</div>`;
    return;
  }

  app.innerHTML = Object.entries(CATS).map(([key, sec]) => {
    const open = openSection === key;
    return `
      <div class="sect">
        <div class="sect-hd" onclick="toggle('${key}')">
          <div>
            <div class="t">${esc(sec.ar)}</div>
            <div class="en">${esc(sec.en)}</div>
          </div>
          <span class="c">${sec.sub.length}</span>
        </div>
        ${open ? `<div class="sect-body">
          <a class="item" href="${sec.url}" target="_blank" rel="noopener noreferrer">
            <div><div class="ar">الكل — ${esc(sec.ar)}</div><div class="en">Shop All ${esc(sec.en)}</div></div>
            <span class="go">افتح</span>
          </a>
          ${sec.sub.map(s => `
            <a class="item" href="${s.url}" target="_blank" rel="noopener noreferrer">
              <div><div class="ar">${esc(s.ar)}</div><div class="en">${esc(s.en)}</div></div>
              <span class="go">افتح</span>
            </a>`).join("")}
        </div>` : ""}
      </div>`;
  }).join("");
}

window.toggle = (k) => { openSection = openSection === k ? null : k; render(); };
let t = null;
window.doSearch = (v) => { query = v; clearTimeout(t); t = setTimeout(render, 200); };
render();
</script>
