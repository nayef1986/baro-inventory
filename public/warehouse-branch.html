<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>جرد الفرع — ALBAROO</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap');
  *{font-family:'Cairo',sans-serif;box-sizing:border-box;margin:0;padding:0}
  body{background:#0a0e1a;color:#e8eef7;padding:14px;max-width:600px;margin:0 auto;padding-bottom:40px}
  h1{font-size:19px;color:#fff}
  .sub{font-size:12px;color:#5b9bd5;margin-bottom:14px}
  .branchName{background:linear-gradient(135deg,#2563eb,#1e40af);color:#fff;border-radius:14px;padding:13px 16px;font-size:17px;font-weight:900;text-align:center;margin-bottom:12px}
  .loading{text-align:center;padding:60px;color:#5b9bd5}
  .spin{font-size:32px;animation:s 1s linear infinite;display:inline-block}@keyframes s{to{transform:rotate(360deg)}}
  .gate{max-width:340px;margin:60px auto;text-align:center}
  .gate .ic{font-size:44px;margin-bottom:10px}
  .gate h2{font-size:19px;color:#fff;margin-bottom:6px}
  .gate p{font-size:13px;color:#94a3b8;margin-bottom:18px}
  .gate input{width:100%;background:#1a2236;border:1px solid #2d3a52;color:#fff;border-radius:12px;padding:14px;font-size:16px;text-align:center;font-family:'Cairo';margin-bottom:14px}
  .gate button{width:100%;background:#2563eb;color:#fff;border:none;border-radius:12px;padding:14px;font-size:16px;font-weight:900;font-family:'Cairo';cursor:pointer}
  .empId{display:flex;align-items:center;justify-content:space-between;background:#141b2d;border:1px solid #1f2940;border-radius:10px;padding:8px 13px;margin-bottom:12px;font-size:12px}
  .empId b{color:#7cb3e8}
  .empId button{background:rgba(91,155,213,0.12);color:#7cb3e8;border:none;border-radius:7px;padding:5px 11px;font-size:11px;font-weight:700;font-family:'Cairo';cursor:pointer}
  .search{width:100%;background:#1a2236;border:1px solid #2d3a52;color:#fff;border-radius:12px;padding:13px 15px;font-size:15px;font-family:'Cairo';margin-bottom:12px}
  .hint{background:rgba(91,155,213,0.08);border:1px solid rgba(91,155,213,0.2);border-radius:10px;padding:10px 12px;font-size:12px;color:#7cb3e8;margin-bottom:12px;line-height:1.6}
  .cont{background:#10172a;border:1px solid #1f2940;border-radius:14px;margin-bottom:10px;overflow:hidden}
  .conth{display:flex;align-items:center;justify-content:space-between;padding:12px 13px;cursor:pointer;background:#141d33}
  .conth .nm{font-weight:900;font-size:15px;color:#fff}
  .conth .badge{background:#2563eb;color:#fff;font-size:11px;font-weight:900;padding:3px 10px;border-radius:100px}
  .contbody{padding:10px}
  .card{background:#141b2d;border:1px solid #1f2940;border-radius:12px;padding:12px;margin-bottom:9px}
  .card.done{border-color:#16a34a;background:rgba(22,163,74,0.08)}
  .cardh{display:flex;gap:11px;align-items:center}
  .cardh img{width:56px;height:56px;border-radius:9px;object-fit:cover;background:#fff;cursor:pointer}
  .cardh .noimg{width:56px;height:56px;border-radius:9px;background:#1f2940;display:flex;align-items:center;justify-content:center;font-size:24px}
  .cardh .info{flex:1;min-width:0}
  .cardh .nm{font-weight:900;font-size:14px;color:#fff;line-height:1.3}
  .cardh .bc{font-family:monospace;font-size:13px;font-weight:900;color:#94a3b8;margin-top:3px;letter-spacing:1px}
  .row2{display:flex;gap:7px;align-items:stretch;margin-top:11px}
  .calc{flex:0 0 60px;background:#0f1626;border-radius:9px;padding:7px 4px;text-align:center;display:flex;flex-direction:column;justify-content:center}
  .calc .v{font-size:19px;font-weight:900;color:#7cb3e8}
  .calc .l{font-size:9px;color:#5b6b85;margin-top:2px}
  .counter{flex:1;display:flex;align-items:center;gap:6px;background:#0f1626;border-radius:9px;padding:6px}
  .counter button{width:38px;height:44px;border:none;border-radius:8px;font-size:24px;font-weight:900;font-family:'Cairo';cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center}
  .counter .minus{background:#7f1d1d;color:#fca5a5}
  .counter .plus{background:#14532d;color:#86efac}
  .counter .mid{flex:1;min-width:0}
  .counter input{width:100%;background:#1a2236;border:1px solid #3b82f6;color:#fff;border-radius:8px;padding:8px 4px;font-size:22px;font-weight:900;text-align:center;font-family:'Cairo'}
  .counter .cl{font-size:9px;color:#5b6b85;text-align:center;margin-top:2px}
  .diff{flex:0 0 54px;border-radius:9px;padding:7px 4px;text-align:center;display:flex;flex-direction:column;justify-content:center}
  .diff .v{font-size:18px;font-weight:900}
  .diff .l{font-size:9px;color:#5b6b85;margin-top:2px}
  .savebtn{width:100%;background:#16a34a;color:#fff;border:none;border-radius:9px;padding:10px;font-size:14px;font-weight:900;font-family:'Cairo';cursor:pointer;margin-top:10px}
  .savebtn.saved{background:#334155}
  .empty{text-align:center;padding:40px;color:#5b6b85;font-size:14px}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#16a34a;color:#fff;padding:12px 24px;border-radius:100px;font-weight:900;z-index:99;opacity:0;transition:opacity 0.3s}
  .toast.show{opacity:1}
</style>
</head>
<body>
<div id="app"><div class="loading"><span class="spin">⏳</span></div></div>
<div class="toast" id="toast"></div>

<script>
const SUPABASE_URL = "https://tvxxprynqeufzlgleurm.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InR2eHhwcnlucWV1ZnpsZ2xldXJtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkwNjk4NTAsImV4cCI6MjA5NDY0NTg1MH0.FfHtUehBX0yjZsuMiE8Z8UP7bE1Ii_RFB5FKT4EJuXk";
const TABLE = "baro_store";
const MIN = 12;
const num = v => { const n = parseFloat(v); return isNaN(n)?0:n; };
const fmtN = n => Math.round(num(n)).toLocaleString("en-US");

const params = new URLSearchParams(location.search);
const BRANCH = (params.get("branch") || "").trim();

let PRODUCTS = [], PERIODS = [], IMAGES = {}, COUNTS = {}, TRANSFERS = [];
let activeTab = "count"; // count | receive
let searchTerm = "";
let EMP = "";
let openConts = {};

async function load(key){
  const r = await fetch(`${SUPABASE_URL}/rest/v1/${TABLE}?key=eq.${key}&select=value`,
    { headers:{ apikey:SUPABASE_KEY, Authorization:`Bearer ${SUPABASE_KEY}` } });
  const j = await r.json();
  const raw = j?.[0]?.value;
  if (raw == null) return null;
  if (typeof raw === "string"){ try { return JSON.parse(raw); } catch { return null; } }
  return raw;
}
async function save(key, value){
  await fetch(`${SUPABASE_URL}/rest/v1/${TABLE}`, {
    method:"POST",
    headers:{ apikey:SUPABASE_KEY, Authorization:`Bearer ${SUPABASE_KEY}`, "Content-Type":"application/json", Prefer:"resolution=merge-duplicates" },
    body: JSON.stringify({ key, value: JSON.stringify(value), updated_at: new Date().toISOString() })
  });
}
function showToast(msg){ const t=document.getElementById("toast"); t.textContent=msg; t.classList.add("show"); setTimeout(()=>t.classList.remove("show"),2000); }
function totalPurchases(p){ return (p.purchases??[]).reduce((s,x)=>s+num(x.qty),0); }
function unitOf(bc){ const p = PRODUCTS.find(x=>x.barcode===bc); const u = num(p?.unitQty ?? 0); return u >= 1 ? u : MIN; }

function branchSoldOf(bc){
  let sold = 0;
  PERIODS.forEach(per=>{ const d = per.sales?.[BRANCH]; if (d) sold += num(d[bc]?.qty ?? 0); });
  return sold;
}
function calcRemaining(bc){
  const sold = branchSoldOf(bc);
  const unit = unitOf(bc);
  const given = Math.ceil(sold/unit)*unit;
  return Math.max(0, given - sold);
}

async function init(){
  if (!BRANCH){
    document.getElementById("app").innerHTML = `<div class="empty">⚠️ الرابط ناقص اسم الفرع<br><span style="font-size:12px">تواصل مع الإدارة</span></div>`;
    return;
  }
  EMP = localStorage.getItem("baro_emp_"+BRANCH) || "";
  try {
    const [prods, pers, counts, trans] = await Promise.all([
      load("baro_products_v2"), load("baro_periods_v2"), load("baro_branch_counts_v2"), load("baro_transfers_v2")
    ]);
    PRODUCTS = prods ?? []; PERIODS = pers ?? []; COUNTS = counts ?? {}; TRANSFERS = trans ?? [];
    // الصور منفصلة (كبيرة) — لو فشلت ما تكسر الباقي
    try { IMAGES = (await load("baro_images_v2")) ?? {}; }
    catch(e){ IMAGES = {}; console.warn("تعذّر تحميل الصور", e); }
  } catch(e){
    document.getElementById("app").innerHTML = `<div class="empty">تعذّر الاتصال — حدّث الصفحة</div>`;
    return;
  }
  if (!EMP) renderGate(); else render();
}

function renderGate(){
  document.getElementById("app").innerHTML = `
    <div class="gate">
      <div class="ic">👋</div>
      <h2>مرحباً</h2>
      <p>فرع: <b style="color:#7cb3e8">${BRANCH}</b><br>اكتب اسمك للمتابعة</p>
      <input id="empInput" placeholder="اسمك…" onkeydown="if(event.key==='Enter')saveEmp()" />
      <button onclick="saveEmp()">ابدأ الجرد ←</button>
    </div>`;
  setTimeout(()=>document.getElementById("empInput")?.focus(), 100);
}
function saveEmp(){
  const v = (document.getElementById("empInput")?.value || "").trim();
  if (!v){ showToast("اكتب اسمك"); return; }
  EMP = v;
  localStorage.setItem("baro_emp_"+BRANCH, v);
  render();
}
function changeEmp(){
  localStorage.removeItem("baro_emp_"+BRANCH);
  EMP = "";
  renderGate();
}

function branchProductsGrouped(){
  let list = PRODUCTS.filter(p => branchSoldOf(p.barcode) > 0);
  const q = searchTerm.trim().toLowerCase();
  if (q) list = list.filter(p => p.barcode.toLowerCase().includes(q) || (p.name||"").toLowerCase().includes(q));
  const groups = {};
  list.forEach(p=>{
    const cont = p.container || "بدون كونتينر";
    if (!groups[cont]) groups[cont] = [];
    groups[cont].push(p);
  });
  Object.values(groups).forEach(arr => arr.sort((a,b)=> calcRemaining(b.barcode) - calcRemaining(a.barcode)));
  return groups;
}

function render(){
  const app = document.getElementById("app");
  // عدد شحنات الاستلام المعلّقة (مرسلة للفرع، مطبوعة، ما استُلمت)
  const pendingReceive = TRANSFERS.filter(t=>t.to===BRANCH && t.printed && !t.received).length;
  app.innerHTML = `
    <h1>🏪 ${BRANCH}</h1>
    <div class="sub">ALBAROO · ${EMP}</div>
    <div class="empId">👤 الموظف: <b>${EMP}</b> · 🖼️ ${Object.keys(IMAGES||{}).length} صورة<button onclick="changeEmp()">تغيير</button></div>
    <div class="tabs" style="display:flex;gap:7px;margin-bottom:14px">
      <button class="${activeTab==='count'?'on':''}" onclick="setTab('count')" style="flex:1;padding:11px;border-radius:11px;border:1px solid ${activeTab==='count'?'#2563eb':'#2d3a52'};background:${activeTab==='count'?'#2563eb':'#141b2d'};color:${activeTab==='count'?'#fff':'#94a3b8'};font-family:'Cairo';font-weight:900;font-size:13px;cursor:pointer">📋 جرد</button>
      <button class="${activeTab==='receive'?'on':''}" onclick="setTab('receive')" style="flex:1;padding:11px;border-radius:11px;border:1px solid ${activeTab==='receive'?'#16a34a':'#2d3a52'};background:${activeTab==='receive'?'#16a34a':'#141b2d'};color:${activeTab==='receive'?'#fff':'#94a3b8'};font-family:'Cairo';font-weight:900;font-size:13px;cursor:pointer">📥 استلام${pendingReceive>0?` (${pendingReceive})`:''}</button>
    </div>
    <div id="tabBody"></div>`;
  renderTabBody();
}

function setTab(t){ activeTab = t; render(); }

function renderTabBody(){
  const body = document.getElementById("tabBody");
  if (activeTab === "receive"){ renderReceive(body); return; }
  renderCountTab(body);
}

function renderCountTab(app){
  const groups = branchProductsGrouped();
  const contNames = Object.keys(groups).sort();
  const totalProds = Object.values(groups).reduce((s,a)=>s+a.length,0);
  const done = Object.keys(COUNTS).filter(k=>k.endsWith("_"+BRANCH)).length;
  const q = searchTerm.trim();

  app.innerHTML = `
    <div class="hint">اضغط <b>+</b> أو <b>−</b> أو اكتب الرقم مباشرة. عدّ اللي عندك في الرف فعلياً، ثم احفظ. الإدارة تشوف الفرق تلقائياً.</div>
    <input class="search" id="search" placeholder="🔍 ابحث بالباركود أو الاسم…" value="${searchTerm}" oninput="onSearch(this.value)" />
    <div style="font-size:12px;color:#5b6b85;margin-bottom:10px">📦 ${totalProds} منتج · ✅ جردت ${done}</div>
    <div id="list">${
      contNames.length === 0
        ? `<div class="empty">${q?`لا نتائج لـ "${q}"`:"لا منتجات"}</div>`
        : contNames.map(cont=>{
            const arr = groups[cont];
            const isOpen = openConts[cont] !== false;
            return `<div class="cont">
              <div class="conth" onclick="toggleCont('${cont.replace(/'/g,'')}')">
                <div class="nm">📦 ${cont}</div>
                <div style="display:flex;align-items:center;gap:8px"><span class="badge">${arr.length}</span><span style="color:#5b6b85">${isOpen?'▲':'▼'}</span></div>
              </div>
              ${isOpen?`<div class="contbody">${arr.map(p=>renderCard(p)).join("")}</div>`:""}
            </div>`;
          }).join("")
    }</div>`;
}

function toggleCont(cont){ openConts[cont] = openConts[cont] === false ? true : false; render(); }
function onSearch(v){ searchTerm = v; render(); }

function renderCard(p){
  const bc = p.barcode;
  const img = IMAGES?.[bc];
  const remaining = calcRemaining(bc);
  const key = bc+"_"+BRANCH;
  const saved = COUNTS[key];
  const actualVal = saved ? saved.count : "";
  const diff = saved ? (num(saved.count) - remaining) : null;
  const diffColor = diff===null ? "#5b6b85" : (diff<0 ? "#f87171" : diff>0 ? "#fbbf24" : "#4ade80");
  const diffTxt = diff===null ? "—" : (diff>0?"+":"")+diff;
  const safeBc = bc.replace(/'/g,'');
  const safeName = (p.name||'').replace(/'/g,'');
  return `<div class="card${saved?' done':''}" id="card_${key}">
    <div class="cardh">
      ${img?`<img src="${img}" loading="lazy" referrerpolicy="no-referrer" onerror="this.onerror=null;this.replaceWith(Object.assign(document.createElement('div'),{className:'noimg',textContent:'📦'}))" onclick="openImgBc('${bc.replace(/'/g,'')}','${safeName}')"/>`:`<div class="noimg">📦</div>`}
      <div class="info">
        <div class="nm">${p.name||"—"}</div>
        <div class="bc">${bc}</div>
      </div>
    </div>
    <div class="row2">
      <div class="calc"><div class="v">${fmtN(remaining)}</div><div class="l">المحسوب</div></div>
      <div class="counter">
        <button class="minus" onclick="step('${key}',-1,${remaining})">−</button>
        <div class="mid"><input type="number" min="0" id="in_${key}" value="${actualVal}" placeholder="؟" oninput="onType('${key}',${remaining})"/><div class="cl">الفعلي</div></div>
        <button class="plus" onclick="step('${key}',1,${remaining})">+</button>
      </div>
      <div class="diff"><div class="v" id="diff_${key}" style="color:${diffColor}">${diffTxt}</div><div class="l">الفرق</div></div>
    </div>
    <button class="savebtn${saved?' saved':''}" id="btn_${key}" onclick="saveCount('${safeBc}','${safeName}',${remaining})">${saved?'✓ محفوظ — تعديل':'💾 حفظ الجرد'}</button>
  </div>`;
}

function step(key, delta, remaining){
  const inp = document.getElementById("in_"+key);
  if (!inp) return;
  const cur = inp.value === "" ? 0 : num(inp.value);
  inp.value = Math.max(0, cur + delta);
  onType(key, remaining);
}

function onType(key, remaining){
  const inp = document.getElementById("in_"+key);
  const diffEl = document.getElementById("diff_"+key);
  if (!inp || !diffEl) return;
  if (inp.value === ""){ diffEl.textContent = "—"; diffEl.style.color = "#5b6b85"; return; }
  const diff = num(inp.value) - remaining;
  diffEl.textContent = (diff>0?"+":"")+diff;
  diffEl.style.color = diff<0 ? "#f87171" : diff>0 ? "#fbbf24" : "#4ade80";
}

async function saveCount(bc, name, remaining){
  const key = bc+"_"+BRANCH;
  const inp = document.getElementById("in_"+key);
  if (!inp || inp.value === ""){ showToast("اكتب الكمية الفعلية أولاً"); return; }
  const count = Math.max(0, num(inp.value));
  const soldAtCount = branchSoldOf(bc); // مبيعات الفرع الإجمالية وقت الجرد (للكشف لاحقاً)
  COUNTS[key] = { count, calc: remaining, soldAtCount, branch: BRANCH, barcode: bc, name, emp: EMP, date: Date.now() };
  const btn = document.getElementById("btn_"+key);
  if (btn){ btn.textContent = "جاري الحفظ…"; btn.disabled = true; }
  await save("baro_branch_counts_v2", COUNTS);
  showToast(`✓ حُفظ جرد ${name||bc}`);
  const card = document.getElementById("card_"+key);
  if (card) card.classList.add("done");
  if (btn){ btn.textContent = "✓ محفوظ — تعديل"; btn.classList.add("saved"); btn.disabled = false; }
}

// ─── تبويب الاستلام ──────────────────────────────────────────
function renderReceive(app){
  const pending = TRANSFERS.filter(t=>t.to===BRANCH && t.printed && !t.received);
  const received = TRANSFERS.filter(t=>t.to===BRANCH && t.received);
  const byBc = {};
  pending.forEach(t=>{ if(!byBc[t.barcode]) byBc[t.barcode]={name:t.name,barcode:t.barcode,items:[]}; byBc[t.barcode].items.push(t); });
  const list = Object.values(byBc);

  app.innerHTML = `
    <div class="hint">📥 هذي البضاعة اللي أرسلها لك المستودع. لما توصلك فعلياً، اضغط "استلمت" — رصيدك يتحدّث تلقائياً.</div>
    ${list.length===0
      ? `<div class="empty">${received.length>0?"✅ استلمت كل الشحنات":"لا شحنات جديدة"}</div>`
      : list.map(pr=>{
          const img = IMAGES?.[pr.barcode];
          const totalQty = pr.items.reduce((s,t)=>s+num(t.qty),0);
          return `<div class="card" style="border-color:rgba(22,163,74,0.3)">
            <div class="cardh">
              ${img?`<img src="${img}" onclick="openImgBc('${pr.barcode.replace(/'/g,'')}','${(pr.name||'').replace(/'/g,'')}')"/>`:`<div class="noimg">📦</div>`}
              <div class="info">
                <div class="nm">${pr.name||"—"}</div>
                <div class="bc">${pr.barcode}</div>
              </div>
              <div style="text-align:center;background:rgba(22,163,74,0.12);border-radius:9px;padding:7px 11px">
                <div style="font-size:20px;font-weight:900;color:#4ade80">${fmtN(totalQty)}</div>
                <div style="font-size:9px;color:#5b6b85">مُرسل</div>
              </div>
            </div>
            <div class="row2" style="margin-top:11px">
              <div class="counter">
                <button class="minus" onclick="stepRecv('${pr.barcode.replace(/'/g,'')}',-1,${totalQty})">−</button>
                <div class="mid"><input type="number" min="0" max="${totalQty}" id="recv_${pr.barcode}" value="${totalQty}" /><div class="cl">كم استلمت فعلياً</div></div>
                <button class="plus" onclick="stepRecv('${pr.barcode.replace(/'/g,'')}',1,${totalQty})">+</button>
              </div>
            </div>
            <button class="savebtn" style="background:#16a34a" onclick="confirmReceive('${pr.barcode.replace(/'/g,'')}',${totalQty})">✓ تأكيد الاستلام</button>
          </div>`;
        }).join("")}
    ${received.length>0?`<div style="margin-top:16px;font-size:12px;color:#5b6b85;font-weight:700">✅ استلمت سابقاً: ${received.length} شحنة</div>`:''}`;
}

// زر +/− لكمية الاستلام
function stepRecv(bc, delta, max){
  const inp = document.getElementById("recv_"+bc);
  if (!inp) return;
  const cur = inp.value === "" ? 0 : num(inp.value);
  inp.value = Math.max(0, Math.min(max, cur + delta));
}

async function confirmReceive(bc, sentTotal){
  const items = TRANSFERS.filter(t=>t.barcode===bc && t.to===BRANCH && t.printed && !t.received);
  if (items.length===0) return;
  const inp = document.getElementById("recv_"+bc);
  const receivedQty = inp ? Math.max(0, num(inp.value)) : sentTotal;
  const name = items[0].name || bc;
  const partial = receivedQty < sentTotal;
  const msg = partial
    ? `استلمت ${fmtN(receivedQty)} من ${fmtN(sentTotal)} (ناقص ${fmtN(sentTotal-receivedQty)})؟`
    : `تأكيد استلام ${fmtN(receivedQty)} قطعة من ${name}؟`;
  if (!confirm(msg)) return;
  const now = Date.now();
  // نعلّم كل الشحنات مستلمة، ونسجّل الكمية الفعلية المستلمة (مجمّعة على أول عنصر)
  let first = true;
  TRANSFERS.forEach(t=>{
    if (t.barcode===bc && t.to===BRANCH && t.printed && !t.received){
      t.received = true; t.receivedDate = now; t.receivedBy = EMP;
      t.receivedQty = first ? receivedQty : 0; // الكمية الفعلية على أول سجل
      t.sentQty = num(t.qty);
      first = false;
    }
  });
  await save("baro_transfers_v2", TRANSFERS);
  showToast(partial ? `✓ استلمت ${fmtN(receivedQty)} (جزئي)` : `✓ استلمت ${fmtN(receivedQty)} قطعة`);
  render();
}

// يفتح الصورة بالباركود (يجيب الرابط من IMAGES — أضمن من تمرير رابط طويل)
function openImgBc(bc, name){
  const src = IMAGES?.[bc];
  if (!src) return;
  openImg(src, name);
}

function openImg(src, name){
  const ov = document.createElement("div");
  ov.style.cssText = "position:fixed;inset:0;background:rgba(0,0,0,0.92);z-index:300;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px";
  ov.onclick = ()=>ov.remove();
  ov.innerHTML = `
    <img src="${src}" style="max-width:100%;max-height:75vh;border-radius:14px;object-fit:contain" onclick="event.stopPropagation()" />
    <div style="color:#fff;font-weight:700;margin-top:12px;text-align:center">${name||''}</div>
    <button onclick="this.parentElement.remove()" style="margin-top:16px;padding:12px 30px;border-radius:100px;border:1px solid rgba(255,255,255,0.2);background:rgba(255,255,255,0.1);color:#fff;font-size:14px;font-weight:700;font-family:'Cairo';cursor:pointer">إغلاق</button>`;
  document.body.appendChild(ov);
}

init();
</script>
