<script>
const SUPABASE_URL = "https://tvxxprynqeufzlgleurm.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InR2eHhwcnlucWV1ZnpsZ2xldXJtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkwNjk4NTAsImV4cCI6MjA5NDY0NTg1MH0.FfHtUehBX0yjZsuMiE8Z8UP7bE1Ii_RFB5FKT4EJuXk";
const TABLE = "baro_store";
const MIN = 12;
const num = v => { const n = parseFloat(v); return isNaN(n)?0:n; };
const fmtN = n => Math.round(num(n)).toLocaleString("en-US");

const params = new URLSearchParams(location.search);
let BRANCH = (params.get("branch") || "").trim();
const BRANCH_IDX = params.get("b"); // رقم الفرع القصير (يُحل بعد تحميل الفترات)

let PRODUCTS = [], PERIODS = [], IMAGES = {}, COUNTS = {}, TRANSFERS = [];
let UNKNOWN = {};        // باركودات مجرودة مو موجودة بالنظام
let STAND = "";          // رقم الستاند الحالي — يذكّر الموظف وين وقف
let SEQ = 0;             // تسلسل يميّز العمليات المتتالية بنفس اللحظة
let STANDS_DONE = [];    // الستاندات اللي خلّصها الموظف
let _scanTarget = null;  // "fast" = نتيجة الكاميرا تروح للمسح السريع
let FAST_LOG = [];       // سجل آخر عمليات المسح السريع (لهذي الجلسة)
let activeTab = "count"; // count | receive
let searchTerm = "";
let EMP = "";
let openConts = {};
let openInv = {};      // فواتير "جهّز للفروع" المفتوحة
let openRecvInv = {};  // فواتير "استلام من الفروع" المفتوحة

// ─── كاش IndexedDB (تحميل فوري بعد أول مرة) ──────────────────
const IDB_NAME = "baro_cache", IDB_STORE = "kv";
function idbOpen(){
  return new Promise((res, rej) => {
    const r = indexedDB.open(IDB_NAME, 1);
    r.onupgradeneeded = () => r.result.createObjectStore(IDB_STORE);
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
}
async function idbGet(key){
  try { const db = await idbOpen(); return await new Promise((res)=>{ const t=db.transaction(IDB_STORE,"readonly").objectStore(IDB_STORE).get(key); t.onsuccess=()=>res(t.result??null); t.onerror=()=>res(null); }); }
  catch { return null; }
}
async function idbSet(key, val){
  try { const db = await idbOpen(); const t=db.transaction(IDB_STORE,"readwrite"); t.objectStore(IDB_STORE).put(val, key); }
  catch {}
}

async function fetchRemote(key){
  const r = await fetch(`${SUPABASE_URL}/rest/v1/${TABLE}?key=eq.${key}&select=value`,
    { headers:{ apikey:SUPABASE_KEY, Authorization:`Bearer ${SUPABASE_KEY}` } });
  const j = await r.json();
  const raw = j?.[0]?.value;
  if (raw == null) return null;
  if (typeof raw === "string"){ try { return JSON.parse(raw); } catch { return null; } }
  return raw;
}

// فحص خفيف: بس تاريخ آخر تحديث، بدل تحميل البيانات الكاملة كل مرة — يوفّر Egress
async function fetchUpdatedAt(key){
  try {
    const r = await fetch(`${SUPABASE_URL}/rest/v1/${TABLE}?key=eq.${key}&select=updated_at`,
      { headers:{ apikey:SUPABASE_KEY, Authorization:`Bearer ${SUPABASE_KEY}` } });
    const j = await r.json();
    return j?.[0]?.updated_at ?? null;
  } catch { return null; }
}

// ✅ قراءة الفترات: الشكل الجديد أولاً (كل شهر بمفتاحه الخاص)، والقديم احتياطاً
async function fetchPeriodsSmart(){
  try {
    const r = await fetch(`${SUPABASE_URL}/rest/v1/${TABLE}?key=like.baro_period_v1_*&select=value`,
      { headers:{ apikey:SUPABASE_KEY, Authorization:`Bearer ${SUPABASE_KEY}` } });
    const rows = await r.json();
    if (Array.isArray(rows) && rows.length > 0){
      return rows.map(row => { try { return JSON.parse(row.value); } catch { return null; } }).filter(Boolean);
    }
  } catch(e){ /* نكمل للشكل القديم */ }
  const old = await fetchRemote("baro_periods_v2");
  return Array.isArray(old) ? old : [];
}

// ✅ الصور: الشكل الجديد أولاً (كل صورة بمفتاحها الخاص)، والقديم احتياطاً
async function fetchImagesSmart(){
  try {
    const r = await fetch(`${SUPABASE_URL}/rest/v1/${TABLE}?key=like.baro_image_v1_*&select=key,value`,
      { headers:{ apikey:SUPABASE_KEY, Authorization:`Bearer ${SUPABASE_KEY}` } });
    const rows = await r.json();
    if (Array.isArray(rows) && rows.length > 0){
      const out = {};
      rows.forEach(row => { try { out[row.key.slice("baro_image_v1_".length)] = JSON.parse(row.value); } catch {} });
      return out;
    }
  } catch(e){ /* نكمل للشكل القديم */ }
  const old2 = await fetchRemote("baro_images_v2");
  return (old2 && typeof old2 === "object" && !Array.isArray(old2)) ? old2 : {};
}

async function load(key){
  if (key === "baro_images_v2") {
    const cached = await idbGet(key);
    if (cached != null){
      fetchImagesSmart().then(fresh => { if (fresh) idbSet(key, fresh); }).catch(()=>{});
      return cached;
    }
    const fresh = await fetchImagesSmart();
    idbSet(key, fresh);
    return fresh;
  }
  const cached = await idbGet(key);
  if (cached != null){
    fetchRemote(key).then(fresh => { if (fresh != null) idbSet(key, fresh); }).catch(()=>{});
    return cached;
  }
  const fresh = await fetchRemote(key);
  if (fresh != null) idbSet(key, fresh);
  return fresh;
}

// نفس أسلوب load() لكن للفترات (شكل جديد أولاً، قديم احتياطاً)
async function loadPeriodsSmart(){
  const cached = await idbGet("baro_periods_v2");
  // ⚠️ لو الذاكرة المؤقتة فاضية (صفر فترات)، ما نثق فيها — نجيب الحقيقي فوراً
  if (cached != null && Array.isArray(cached) && cached.length > 0){
    fetchPeriodsSmart().then(fresh => { if (fresh != null) idbSet("baro_periods_v2", fresh); }).catch(()=>{});
    return cached;
  }
  const fresh = await fetchPeriodsSmart();
  if (fresh != null) idbSet("baro_periods_v2", fresh);
  return fresh;
}
// ═══ الحفظ المرن: محلي فوراً، ورفع بالخلفية ═══
// يشتغل بدون إنترنت نهائياً — البيانات آمنة بالجهاز، وترتفع أول ما يرجع النت
const PENDING_KEY = "baro_pending_uploads";
let PENDING = {};          // { key: value } — بيانات تنتظر الرفع
let _uploading = false;

function loadPending(){
  try { PENDING = JSON.parse(localStorage.getItem(PENDING_KEY) || "{}"); } catch(e){ PENDING = {}; }
}
function persistPending(){
  try { localStorage.setItem(PENDING_KEY, JSON.stringify(PENDING)); } catch(e){}
}
function pendingCount(){ return Object.keys(PENDING).length; }

// الرفع الفعلي — يرجع true لو نجح
async function pushToCloud(key, value){
  try {
    const ctrl = new AbortController();
    const timer = setTimeout(()=>ctrl.abort(), 12000);   // مهلة: ما نعلّق على نت بطيء
    const r = await fetch(`${SUPABASE_URL}/rest/v1/${TABLE}`, {
      method:"POST",
      headers:{ apikey:SUPABASE_KEY, Authorization:`Bearer ${SUPABASE_KEY}`, "Content-Type":"application/json", Prefer:"resolution=merge-duplicates" },
      body: JSON.stringify({ key, value: JSON.stringify(value), updated_at: new Date().toISOString() }),
      signal: ctrl.signal,
    });
    clearTimeout(timer);
    return r.ok;
  } catch(e){ return false; }
}

// الحفظ الرئيسي: محلي فوري (مضمون)، ثم محاولة رفع بالخلفية
async function save(key, value){
  idbSet(key, value);                    // 1) محلي فوراً — ما ينتظر شبكة
  PENDING[key] = value;                  // 2) بطابور الرفع
  persistPending();
  syncPending();                         // 3) نحاول نرفع (بدون انتظار)
  return true;
}

// يرفع كل المعلّق — يُستدعى تلقائياً وعند رجوع النت
async function syncPending(silent = true){
  if (_uploading) return;
  const keys = Object.keys(PENDING);
  if (!keys.length){ updateSyncBar(); return; }
  if (!navigator.onLine){ updateSyncBar(); return; }

  _uploading = true;
  updateSyncBar();
  let done = 0;
  for (const key of keys){
    const ok = await pushToCloud(key, PENDING[key]);
    if (ok){ delete PENDING[key]; done++; }
    else break;                          // النت رجع ينقطع — نوقف ونحاول لاحقاً
  }
  persistPending();
  _uploading = false;
  updateSyncBar();
  if (done && !silent) showToast(`✓ رُفع ${done}`);
}

// شريط الحالة — يبيّن للموظف وضعه بنظرة
function updateSyncBar(){
  const el = document.getElementById("syncBar");
  if (!el) return;
  const n = pendingCount();
  const online = navigator.onLine;
  if (_uploading){
    el.style.cssText = "background:rgba(96,165,250,0.12);border:1px solid rgba(96,165,250,0.3);color:#93c5fd";
    el.innerHTML = `⏳ جاري الرفع…`;
  } else if (n === 0){
    el.style.cssText = "background:rgba(74,222,128,0.1);border:1px solid rgba(74,222,128,0.25);color:#4ade80";
    el.innerHTML = `✓ الكل محفوظ ومرفوع`;
  } else if (!online){
    el.style.cssText = "background:rgba(251,191,36,0.12);border:1px solid rgba(251,191,36,0.3);color:#fbbf24";
    el.innerHTML = `📵 بدون إنترنت · <b>${n}</b> محفوظة بجهازك — بترتفع تلقائياً`;
  } else {
    el.style.cssText = "background:rgba(251,191,36,0.12);border:1px solid rgba(251,191,36,0.3);color:#fbbf24";
    el.innerHTML = `⏳ <b>${n}</b> تنتظر الرفع <button onclick="syncPending(false)" style="background:rgba(251,191,36,0.2);border:1px solid rgba(251,191,36,0.4);color:#fbbf24;border-radius:8px;padding:4px 11px;font-family:'Cairo';font-size:11px;font-weight:900;cursor:pointer;margin-right:7px">ارفع الآن</button>`;
  }
}

// نراقب رجوع النت ونرفع تلقائياً
window.addEventListener("online", () => { showToast("رجع الإنترنت — جاري الرفع"); syncPending(false); });
window.addEventListener("offline", () => { updateSyncBar(); });
setInterval(() => syncPending(true), 20000);   // محاولة دورية كل 20 ثانية

// تحذير قبل إغلاق الصفحة لو فيه شي ما رُفع
window.addEventListener("beforeunload", (e) => {
  if (pendingCount() > 0){ e.preventDefault(); e.returnValue = ""; return ""; }
});
function showToast(msg){ const t=document.getElementById("toast"); t.textContent=msg; t.classList.add("show"); setTimeout(()=>t.classList.remove("show"),2000); }
function totalPurchases(p){ return (p.purchases??[]).reduce((s,x)=>s+num(x.qty),0); }
function unitOf(bc){ const p = PRODUCTS.find(x=>x.barcode===bc); const u = num(p?.unitQty ?? 0); return u >= 1 ? u : MIN; }

let _soldMap = null;
function buildSoldMap(){
  _soldMap = {};
  PERIODS.forEach(per=>{
    const d = per.sales?.[BRANCH];
    if (!d) return;
    Object.entries(d).forEach(([bc,v])=>{ _soldMap[bc] = (_soldMap[bc]||0) + num(v?.qty ?? 0); });
  });
}
function branchSoldOf(bc){
  if (_soldMap === null) buildSoldMap();
  return _soldMap[bc] || 0;
}
let _rcvMap = null;
function buildRcvMap(){
  _rcvMap = {};
  TRANSFERS.forEach(t=>{
    if (t.to!==BRANCH || !t.printed) return;
    if (!(t.from==="المستودع"||t.from==="المستودع الرئيسي")) return;
    _rcvMap[t.barcode] = (_rcvMap[t.barcode]||0) + num(t.qty);
  });
}
function receivedFromWh(bc){
  if (_rcvMap === null) buildRcvMap();
  return _rcvMap[bc] || 0;
}
function calcRemaining(bc){
  const sold = branchSoldOf(bc);
  const unit = unitOf(bc);
  const given = Math.ceil(sold/unit)*unit;
  const received = receivedFromWh(bc);  // الوارد من المستودع (من الخريطة — خفيف)
  return Math.max(0, given - sold + received);
}

// كل الفروع مرتّبة (لحل رقم الفرع القصير) — نفس ترتيب صفحة الروابط
function allBranchesList(){
  const set = new Set();
  PERIODS.forEach(per => Object.keys(per.sales??{}).forEach(b=>{ if(b && b.trim()) set.add(b); }));
  return [...set].sort();
}

async function init(){
  // لو الرابط ما فيه لا اسم ولا رقم فرع
  if (!BRANCH && !BRANCH_IDX){
    document.getElementById("app").innerHTML = `<div class="empty">⚠️ الرابط ناقص اسم الفرع<br><span style="font-size:12px">تواصل مع الإدارة</span></div>`;
    return;
  }
  try {
    const [prods, pers, counts, trans] = await Promise.all([
      load("baro_products_v2"), loadPeriodsSmart(), load("baro_branch_counts_v2"), load("baro_transfers_v2")
    ]);
    PRODUCTS = prods ?? []; PERIODS = pers ?? []; COUNTS = counts ?? {}; TRANSFERS = trans ?? [];
    _rcvMap = null; _soldMap = null; // نعيد بناء الخرائط بالبيانات الجديدة
    // ✅ جرد الفروع بدون صور — نوفّر استهلاك النقل (Egress) بالكامل
    // الأسماء والباركودات تكفي للجرد، والصور متاحة بالنظام الأساسي عند الحاجة
    IMAGES = {};
    try { UNKNOWN = (await load(UNKNOWN_KEY)) ?? {}; } catch(e){ UNKNOWN = {}; }
    try { STAND = localStorage.getItem("baro_stand_"+BRANCH) || ""; } catch(e){ STAND = ""; }
    try { STANDS_DONE = JSON.parse(localStorage.getItem("baro_stands_done_"+BRANCH) || "[]"); } catch(e){ STANDS_DONE = []; }
    loadPending();           // نستعيد أي بيانات ما رُفعت من جلسة سابقة
    syncPending(true);       // ونحاول نرفعها فوراً
    // نكمّل التسلسل من آخر رقم محفوظ (يمنع التعارض بعد إعادة الفتح)
    try {
      const seqs = [...Object.values(COUNTS), ...Object.values(UNKNOWN)]
        .filter(v => v.branch === BRANCH && v.seq).map(v => num(v.seq));
      SEQ = seqs.length ? Math.max(...seqs) : 0;
    } catch(e){ SEQ = 0; }
  } catch(e){
    document.getElementById("app").innerHTML = `<div class="empty">تعذّر الاتصال — حدّث الصفحة</div>`;
    return;
  }
  // نحل رقم الفرع القصير (?b=3) لاسم الفرع من ترتيب الفروع
  if (!BRANCH && BRANCH_IDX != null){
    const all = allBranchesList();
    const idx = parseInt(BRANCH_IDX, 10);
    if (!isNaN(idx) && idx >= 1 && idx <= all.length) BRANCH = all[idx-1];
  }
  if (!BRANCH){
    document.getElementById("app").innerHTML = `<div class="empty">⚠️ رقم الفرع غير صحيح<br><span style="font-size:12px">تواصل مع الإدارة</span></div>`;
    return;
  }

function branchProductsGrouped(){
  let list = PRODUCTS.filter(p => branchSoldOf(p.barcode) > 0 || receivedFromWh(p.barcode) > 0);
  const q = searchTerm.trim().toLowerCase();
  if (q) list = list.filter(p => p.barcode.toLowerCase().includes(q) || (p.name||"").toLowerCase().includes(q));
  const groups = {};
  list.forEach(p=>{
    const cont = p.container || "بدون كونتينر";
    if (!groups[cont]) groups[cont] = [];
    groups[cont].push(p);
  });
  // نحسب المتبقي مرة وحدة لكل منتج (بدل استدعاء calcRemaining داخل sort مرات كثيرة)
  const remCache = {};
  Object.values(groups).forEach(arr => {
    arr.forEach(p => { if (remCache[p.barcode] === undefined) remCache[p.barcode] = calcRemaining(p.barcode); });
    arr.sort((a,b)=> remCache[b.barcode] - remCache[a.barcode]);
  });
  return groups;
}

function renderCard(p){
  const bc = p.barcode;
  const img = IMAGES?.[bc];
  const remaining = calcRemaining(bc);
  const key = bc+"_"+BRANCH;
  const saved = COUNTS[key];
  const actualVal = saved ? saved.count : "";
  const diff = saved ? (num(saved.count) - remaining) : null;
  const diffColor = diff===null ? "#5b6b85" : (diff<0 ? "#f87171" : diff>0 ? "#fbbf24" : "#4ade80");
  const diffTxt = diff===null ? "—" : (diff>0?"+":"")+diff;
  const safeBc = bc.replace(/'/g,'');
  const safeName = (p.name||'').replace(/'/g,'');
  return `<div class="card${saved?' done':''}" id="card_${key}">
    ${saved?`<div style="display:flex;align-items:center;gap:6px;background:rgba(74,222,128,0.12);border:1px solid rgba(74,222,128,0.3);border-radius:9px;padding:5px 10px;margin-bottom:9px"><span style="color:#4ade80;font-weight:900;font-size:13px">✓ جردته</span><span style="color:#94a3b8;font-size:11px">·</span><span style="color:#a89fc4;font-size:12px;font-weight:700">👤 ${saved.emp||EMP}</span></div>`:''}
    <div class="cardh">
      ${img?`<img src="${img}" loading="lazy" referrerpolicy="no-referrer" onerror="this.onerror=null;this.replaceWith(Object.assign(document.createElement('div'),{className:'noimg',textContent:'📦'}))" onclick="openImgBc('${bc.replace(/'/g,'')}','${safeName}')"/>`:`<div class="noimg">📦</div>`}
      <div class="info">
        <div class="nm">${p.name||"—"}</div>
        <div class="bc">${bc}</div>
      </div>
    </div>
    <div class="row2">
      <div class="calc"><div class="v">${fmtN(remaining)}</div><div class="l">المحسوب</div></div>
      <div class="counter">
        <button class="minus" onclick="step('${key}',-1,${remaining})">−</button>
        <div class="mid"><input type="number" min="0" id="in_${key}" value="${actualVal}" placeholder="؟" oninput="onType('${key}',${remaining})"/><div class="cl">الفعلي</div></div>
        <button class="plus" onclick="step('${key}',1,${remaining})">+</button>
      </div>
      <div class="diff"><div class="v" id="diff_${key}" style="color:${diffColor}">${diffTxt}</div><div class="l">الفرق</div></div>
    </div>
    <button class="savebtn${saved?' saved':''}" id="btn_${key}" onclick="saveCount('${safeBc}','${safeName}',${remaining})">${saved?'✓ محفوظ — تعديل':'💾 حفظ الجرد'}</button>
  </div>`;
}

function step(key, delta, remaining){
  const inp = document.getElementById("in_"+key);
  if (!inp) return;
  const cur = inp.value === "" ? 0 : num(inp.value);
  inp.value = Math.max(0, cur + delta);
  onType(key, remaining);
}

function onType(key, remaining){
  const inp = document.getElementById("in_"+key);
  const diffEl = document.getElementById("diff_"+key);
  if (!inp || !diffEl) return;
  if (inp.value === ""){ diffEl.textContent = "—"; diffEl.style.color = "#5b6b85"; return; }
  const diff = num(inp.value) - remaining;
  diffEl.textContent = (diff>0?"+":"")+diff;
  diffEl.style.color = diff<0 ? "#f87171" : diff>0 ? "#fbbf24" : "#4ade80";
}





// ═══ إنهاء الستاند والانتقال للتالي تلقائياً ═══
window.finishStand = () => {
  const cur = String(STAND||"").trim();
  if (!cur){ showToast("اكتب رقم الستاند أولاً"); return; }

  // كم صنف انجرد بهذا الستاند
  const inStand = [...Object.values(COUNTS), ...Object.values(UNKNOWN)]
    .filter(v => v.branch === BRANCH && String(v.stand||"") === cur).length;

  if (!STANDS_DONE.includes(cur)) STANDS_DONE.push(cur);
  try { localStorage.setItem("baro_stands_done_"+BRANCH, JSON.stringify(STANDS_DONE)); } catch(e){}

  // الانتقال التلقائي: لو رقم، نزيده واحد. لو اسم، نفرّغه للكتابة
  const asNum = parseInt(cur, 10);
  const next = (!isNaN(asNum) && String(asNum) === cur) ? String(asNum + 1) : "";
  setStand(next);

  beep(true);
  showToast(`✓ خلص ستاند ${cur} (${inStand} صنف)${next?` — انتقلت للستاند ${next}`:""}`);
  renderTabBody();
  setTimeout(()=>{ const el=document.getElementById(next?"fastBc":"standNo"); if(el) el.focus(); }, 100);
};

function reviewRows(){
  const rows = [];
  Object.entries(COUNTS).forEach(([key, v]) => {
    if (!key.endsWith("_"+BRANCH)) return;
    rows.push({ ...v, key, known: true });
  });
  Object.entries(UNKNOWN).forEach(([key, v]) => {
    if (!key.endsWith("_"+BRANCH)) return;
    rows.push({ ...v, key, known: false, name: "" });
  });
  return rows.sort((a,b) => (num(b.seq)-num(a.seq)) || (num(b.date)-num(a.date)));
}

function renderReview(){

let _revT = null;
window.onReviewSearch = (v) => {
  _reviewSearch = v;
  clearTimeout(_revT);
  _revT = setTimeout(()=>{
    renderReview();
    const el = document.getElementById("revSearch");
    if (el){ el.focus(); el.setSelectionRange(el.value.length, el.value.length); }
  }, 250);
};

window.closeReview = () => {
  const ov = document.getElementById("reviewOverlay");
  if (ov) ov.remove();
  render();
};

window.updateReview = async (key, known) => {
  const inp = document.getElementById("rev_"+key);
  if (!inp) return;
  const val = num(inp.value);
  if (inp.value === "" || val < 0){ showToast("اكتب رقم صحيح"); return; }
  if (val === 0){
    if (!confirm("الكمية صفر — تبي تحذف الصنف من الجرد؟")) return;
    return deleteReview(key, known);
  }
  if (known){
    if (COUNTS[key]){ COUNTS[key].count = val; COUNTS[key].date = Date.now(); COUNTS[key].seq = ++SEQ; }
    await save("baro_branch_counts_v2", COUNTS);
  } else {
    if (UNKNOWN[key]){ UNKNOWN[key].count = val; UNKNOWN[key].date = Date.now(); UNKNOWN[key].seq = ++SEQ; }
    await save(UNKNOWN_KEY, UNKNOWN);
  }
  beep(true);
  showToast("✓ تحدّثت الكمية");
  renderReview();
};

window.deleteReview = async (key, known) => {
  const item = known ? COUNTS[key] : UNKNOWN[key];
  if (!item) return;
  if (!confirm(`حذف ${item.name || item.barcode} من الجرد نهائياً؟`)) return;
  if (known){ delete COUNTS[key]; await save("baro_branch_counts_v2", COUNTS); }
  else { delete UNKNOWN[key]; await save(UNKNOWN_KEY, UNKNOWN); }
  // نشيله من سجل الجلسة كمان لو موجود
  FAST_LOG = FAST_LOG.filter(r => (r.bc + "_" + BRANCH) !== key);
  showToast("✓ حُذف");
  renderReview();
};

// ═══ تصدير إكسل للجرد (جاهز للرفع على أودو) ═══
function exportInventoryExcel(){
  const rows = [];
  const now = new Date();
  const ds = now.getFullYear()+"-"+String(now.getMonth()+1).padStart(2,"0")+"-"+String(now.getDate()).padStart(2,"0");

  // المنتجات الموجودة بالنظام
  Object.entries(COUNTS).forEach(([key, v]) => {
    if (!key.endsWith("_"+BRANCH)) return;
    const p = PRODUCTS.find(x => x.barcode === v.barcode);
    const d = v.date ? new Date(v.date) : now;
    rows.push({
      "الفرع": v.branch || BRANCH,
      "الموظف": v.emp || EMP,
      "الستاند": v.stand || "",
      "التاريخ": d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"),
      "الوقت": String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0"),
      "الباركود": v.barcode,
      "اسم المنتج": v.name || p?.name || "",
      "الكمية المجرودة": num(v.count),
      "الكمية المحسوبة": num(v.calc),
      "الفرق": num(v.count) - num(v.calc),
      "موجود بالنظام": "نعم",
      "الكونتينر": p?.container || "",
      "سعر البيع": p ? num(p.sellPrice) : "",
    });
  });

  // الباركودات غير الموجودة بالنظام
  Object.entries(UNKNOWN).forEach(([key, v]) => {
    if (!key.endsWith("_"+BRANCH)) return;
    const d = v.date ? new Date(v.date) : now;
    rows.push({
      "الفرع": v.branch || BRANCH,
      "الموظف": v.emp || EMP,
      "الستاند": v.stand || "",
      "التاريخ": d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"),
      "الوقت": String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0"),
      "الباركود": v.barcode,
      "اسم المنتج": "",
      "الكمية المجرودة": num(v.count),
      "الكمية المحسوبة": "",
      "الفرق": "",
      "موجود بالنظام": "لا",
      "الكونتينر": "",
      "سعر البيع": "",
    });
  });

  if (!rows.length){ showToast("ما فيه جرد للتصدير"); return; }

  // لو مكتبة الإكسل ما تحمّلت (فُتحت الصفحة بدون إنترنت) — نصدّر CSV، يفتح بالإكسل عادي
  if (typeof XLSX === "undefined"){
    const cols = Object.keys(rows[0]);
    const csv = "\uFEFF" + [cols.join(",")].concat(
      rows.map(r => cols.map(k => {
        const v = String(r[k] ?? "");
        return /[",\n]/.test(v) ? '"' + v.replace(/"/g,'""') + '"' : v;
      }).join(","))
    ).join("\n");
    const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = `جرد_${BRANCH}_${ds}.csv`.replace(/[^\u0600-\u06FFA-Za-z0-9_.\-]/g,"_");
    a.click();
    setTimeout(()=>URL.revokeObjectURL(a.href), 3000);
    showToast(`نزّل ${rows.length} صنف (CSV — يفتح بالإكسل)`);
    return;
  }

  // نرتّب: الموجود أول، ثم غير الموجود
  rows.sort((a,b) => (a["موجود بالنظام"]==="لا"?1:0) - (b["موجود بالنظام"]==="لا"?1:0));

  const ws = XLSX.utils.json_to_sheet(rows);
  ws["!cols"] = [{wch:14},{wch:12},{wch:10},{wch:12},{wch:8},{wch:18},{wch:30},{wch:14},{wch:14},{wch:9},{wch:14},{wch:14},{wch:10}];
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "الجرد");
  const known = rows.filter(r=>r["موجود بالنظام"]==="نعم").length;
  const unknown = rows.length - known;
  XLSX.writeFile(wb, `جرد_${BRANCH}_${ds}.xlsx`.replace(/[^\u0600-\u06FFA-Za-z0-9_.\-]/g,"_"));
  showToast(`نزّل ${rows.length} صنف (${known} معروف · ${unknown} غير معروف)`);
}

// ═══════════ المسح السريع ═══════════
const UNKNOWN_KEY = "baro_unknown_counts_v1";

function beep(ok){
  try {
    const ctx = new (window.AudioContext||window.webkitAudioContext)();
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.connect(g); g.connect(ctx.destination);
    o.frequency.value = ok ? 880 : 220;
    g.gain.setValueAtTime(0.12, ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + (ok?0.12:0.3));
    o.start(); o.stop(ctx.currentTime + (ok?0.12:0.3));
  } catch(e){}
  try { navigator.vibrate && navigator.vibrate(ok?60:[60,50,60]); } catch(e){}
}

// نلقى المنتج ونعرض اسمه فوراً بمجرد اكتمال الباركود
function fastLookup(){
  const bcEl = document.getElementById("fastBc");
  const out  = document.getElementById("fastFound");
  if (!bcEl || !out) return null;
  const bc = bcEl.value.trim();
  if (!bc){ out.innerHTML = `<span style="color:#94a3b8">جاهز — امسح أو اكتب الباركود</span>`; return null; }
  const p = PRODUCTS.find(x => String(x.barcode).trim().toLowerCase() === bc.toLowerCase());
  if (p){
    const key = p.barcode+"_"+BRANCH;
    const prev = COUNTS[key] ? num(COUNTS[key].count) : 0;
    out.innerHTML = `<span style="color:#4ade80;font-weight:700">✓ ${p.name || p.barcode}</span>` +
      (prev ? `<span style="color:#fbbf24"> · مجرود سابقاً: ${prev} (بيتجمع)</span>` : "");
    return { bc: p.barcode, name: p.name || "", known: true };
  }
  const ukey = bc+"_"+BRANCH;
  const prevU = UNKNOWN[ukey] ? num(UNKNOWN[ukey].count) : 0;
  out.innerHTML = `<span style="color:#fbbf24;font-weight:700">⚠ غير موجود بالنظام — بيتحفظ بقائمة منفصلة</span>` +
    (prevU ? `<span style="color:#fbbf24"> · سابقاً: ${prevU}</span>` : "");
  return { bc, name: "", known: false };
}

async function fastSave(){
  const bcEl  = document.getElementById("fastBc");
  const qtyEl = document.getElementById("fastQty");
  if (!bcEl || !qtyEl) return;
  const bc = bcEl.value.trim();
  const qty = num(qtyEl.value);
  if (!bc){ beep(false); showToast("امسح الباركود أولاً"); fastFocusBc(); return; }
  if (qtyEl.value === "" || qty <= 0){ beep(false); showToast("اكتب الكمية"); qtyEl.focus(); return; }

  const hit = PRODUCTS.find(x => String(x.barcode).trim().toLowerCase() === bc.toLowerCase());

  if (hit){
    const key = hit.barcode+"_"+BRANCH;
    const prev = COUNTS[key] ? num(COUNTS[key].count) : 0;
    const total = prev + qty;   // يجمع زي ما طلبت
    COUNTS[key] = {
      count: total, calc: calcRemaining(hit.barcode), soldAtCount: branchSoldOf(hit.barcode),
      branch: BRANCH, barcode: hit.barcode, name: hit.name || "", emp: EMP, date: Date.now(),
      stand: STAND || (COUNTS[key]?.stand ?? ""), seq: ++SEQ
    };
    await save("baro_branch_counts_v2", COUNTS);
    FAST_LOG.unshift({ bc: hit.barcode, name: hit.name || "", qty, total, known: true, stand: STAND, t: Date.now() });
  } else {
    const ukey = bc+"_"+BRANCH;
    const prev = UNKNOWN[ukey] ? num(UNKNOWN[ukey].count) : 0;
    const total = prev + qty;
    UNKNOWN[ukey] = { count: total, barcode: bc, branch: BRANCH, emp: EMP, date: Date.now(), stand: STAND || (UNKNOWN[ukey]?.stand ?? ""), seq: ++SEQ };
    await save(UNKNOWN_KEY, UNKNOWN);
    FAST_LOG.unshift({ bc, name: "", qty, total, known: false, stand: STAND, t: Date.now() });
  }

  beep(true);
  bcEl.value = ""; qtyEl.value = "";
  renderFastLog();
  updateSyncBar();
  const out = document.getElementById("fastFound");
  if (out) out.innerHTML = `<span style="color:#4ade80">✓ حُفظ — جاهز للتالي</span>`;
  fastFocusBc();
}

function renderFastLog(){
  const el = document.getElementById("fastLog");
  if (!el) return;
  if (!FAST_LOG.length){ el.innerHTML = ""; return; }
  el.innerHTML = `<div style="font-size:11px;color:#7f9ac4;margin-bottom:6px">آخر ${Math.min(FAST_LOG.length,10)} عملية</div>` +
    FAST_LOG.slice(0,10).map((r,i) => `
      <div style="display:flex;align-items:center;gap:9px;background:rgba(255,255,255,0.03);border-radius:10px;padding:9px 11px;margin-bottom:5px">
        <div style="flex:1;min-width:0">
          <div style="font-size:13px;font-weight:700;color:${r.known?'#e2e8f0':'#fbbf24'};white-space:nowrap;overflow:hidden;text-overflow:ellipsis">
            ${r.known ? (r.name || r.bc) : "⚠ " + r.bc}
          </div>
          <div style="font-family:monospace;font-size:11px;color:#64748b;margin-top:2px">${r.bc}${r.stand?` · 📍${r.stand}`:""}</div>
        </div>
        <div style="text-align:center;flex-shrink:0">
          <div style="font-size:17px;font-weight:900;color:#4ade80">+${r.qty}</div>
          ${r.total !== r.qty ? `<div style="font-size:10px;color:#7f9ac4">إجمالي ${r.total}</div>` : ""}
        </div>
        <button onclick="fastUndo(${i})" style="background:rgba(248,113,113,0.15);border:1px solid rgba(248,113,113,0.3);color:#f87171;border-radius:9px;padding:6px 10px;font-family:'Cairo';font-size:11px;font-weight:700;cursor:pointer;flex-shrink:0">تراجع</button>
      </div>`).join("");
}

async function fastUndo(i){
  const r = FAST_LOG[i];
  if (!r) return;
  if (!confirm(`تراجع عن ${r.qty} من ${r.name || r.bc}؟`)) return;
  if (r.known){
    const key = r.bc+"_"+BRANCH;
    if (COUNTS[key]){
      const left = num(COUNTS[key].count) - r.qty;
      if (left > 0) COUNTS[key].count = left; else delete COUNTS[key];
      await save("baro_branch_counts_v2", COUNTS);
    }
  } else {
    const ukey = r.bc+"_"+BRANCH;
    if (UNKNOWN[ukey]){
      const left = num(UNKNOWN[ukey].count) - r.qty;
      if (left > 0) UNKNOWN[ukey].count = left; else delete UNKNOWN[ukey];
      await save(UNKNOWN_KEY, UNKNOWN);
    }
  }
  FAST_LOG.splice(i,1);
  renderFastLog();
  showToast("تم التراجع");
}

// نربط الأحداث بعد كل رسم للشاشة
function bindFast(){
  const bcEl = document.getElementById("fastBc");
  const qtyEl = document.getElementById("fastQty");
  if (!bcEl || !qtyEl) return;
  bcEl.oninput = () => fastLookup();
  // قارئ الباركود يرسل Enter تلقائياً بنهاية المسح → نقفز للكمية
  bcEl.onkeydown = (e) => { if (e.key === "Enter"){ e.preventDefault(); fastLookup(); qtyEl.focus(); } };
  qtyEl.onkeydown = (e) => { if (e.key === "Enter"){ e.preventDefault(); fastSave(); } };
  renderFastLog();
  setTimeout(fastFocusBc, 60);
}

async function saveCount(bc, name, remaining){
  const key = bc+"_"+BRANCH;
  const inp = document.getElementById("in_"+key);
  if (!inp || inp.value === ""){ showToast("اكتب الكمية الفعلية أولاً"); return; }
  const count = Math.max(0, num(inp.value));
  const soldAtCount = branchSoldOf(bc); // مبيعات الفرع الإجمالية وقت الجرد (للكشف لاحقاً)
  COUNTS[key] = { count, calc: remaining, soldAtCount, branch: BRANCH, barcode: bc, name, emp: EMP, date: Date.now() };
  const btn = document.getElementById("btn_"+key);
  if (btn){ btn.textContent = "جاري الحفظ…"; btn.disabled = true; }
  await save("baro_branch_counts_v2", COUNTS);
  showToast(`✓ حُفظ جرد ${name||bc}`);
  // نعيد رسم البطاقة عشان يظهر بادج "✓ جردته + اسم الموظف" فوراً
  const card = document.getElementById("card_"+key);
  const prod = PRODUCTS.find(p=>p.barcode===bc);
  if (card && prod){
    const wrap = document.createElement("div");
    wrap.innerHTML = renderCard(prod);
    const fresh = wrap.firstElementChild;
    if (fresh) card.replaceWith(fresh);
  } else if (card){
    card.classList.add("done");
  }
}


// ─── تبويب الاستلام (سجل — يُحسب تلقائياً بدون تأكيد) ──────────
function renderReceive(app){
  // كل الوارد من المستودv (يُحسب في الرصيد فوراً)
  const incoming = TRANSFERS.filter(t=>t.to===BRANCH && t.printed && (t.from==="المستودع"||t.from==="المستودع الرئيسي"));
  const byBc = {};
  incoming.forEach(t=>{ if(!byBc[t.barcode]) byBc[t.barcode]={name:t.name,barcode:t.barcode,items:[]}; byBc[t.barcode].items.push(t); });
  const list = Object.values(byBc).sort((a,b)=>{
    const la = Math.max(...a.items.map(t=>num(t.date))), lb = Math.max(...b.items.map(t=>num(t.date)));
    return lb - la;
  });
  const totalAll = incoming.reduce((s,t)=>s+num(t.qty),0);

  app.innerHTML = `
    <div class="hint">📥 هذي البضاعة اللي أرسلها لك المستودع — <b>محسوبة في رصيدك تلقائياً</b>. ما تحتاج تأكيد.</div>
    ${list.length===0
      ? `<div class="empty">لا شحنات من المستودع</div>`
      : `<div style="background:rgba(22,163,74,0.1);border:1px solid rgba(22,163,74,0.3);border-radius:12px;padding:12px;margin-bottom:12px;text-align:center">
           <div style="font-size:24px;font-weight:900;color:#4ade80">${fmtN(totalAll)}</div>
           <div style="font-size:11px;color:#94a3b8">إجمالي الوارد من المستودع (${list.length} منتج)</div>
         </div>` +
        list.map(pr=>{
          const img = IMAGES?.[pr.barcode];
          const totalQty = pr.items.reduce((s,t)=>s+num(t.qty),0);
          const lastDate = new Date(Math.max(...pr.items.map(t=>num(t.date))));
          const ds = (lastDate.getDate()+"").padStart(2,"0")+"/"+(lastDate.getMonth()+1+"").padStart(2,"0")+" "+(lastDate.getHours()+"").padStart(2,"0")+":"+(lastDate.getMinutes()+"").padStart(2,"0");
          return `<div class="card" style="border-color:rgba(22,163,74,0.3)">
            <div class="cardh">
              ${img?`<img src="${img}" onclick="openImgBc('${pr.barcode.replace(/'/g,'')}','${(pr.name||'').replace(/'/g,'')}')"/>`:`<div class="noimg">📦</div>`}
              <div class="info">
                <div class="nm">${pr.name||"—"}</div>
                <div class="bc">${pr.barcode} · ${ds}</div>
                ${pr.items.length>1?`<div style="font-size:10px;color:#7cb3e8;margin-top:2px">${pr.items.length} شحنات</div>`:''}
              </div>
              <div style="text-align:center;background:rgba(22,163,74,0.12);border-radius:9px;padding:7px 11px">
                <div style="font-size:20px;font-weight:900;color:#4ade80">${fmtN(totalQty)}</div>
                <div style="font-size:9px;color:#5b6b85">✓ وصل</div>
              </div>
            </div>
          </div>`;

async function confirmReceiveBranch(bc, src, sentTotal){
  const items = TRANSFERS.filter(t=>t.barcode===bc && t.to===BRANCH && t.from===src && t.printed && !t.received);
  if (items.length===0) return;
  const inp = document.getElementById("rb_"+bc+"_"+src);
  const receivedQty = inp ? Math.max(0, num(inp.value)) : sentTotal;
  const name = items[0].name || bc;
  const partial = receivedQty < sentTotal;
  const msg = partial
    ? `استلمت ${fmtN(receivedQty)} من ${fmtN(sentTotal)} من فرع ${src} (ناقص ${fmtN(sentTotal-receivedQty)})؟`
    : `تأكيد استلام ${fmtN(receivedQty)} قطعة من ${name} (من فرع ${src})؟`;
  if (!confirm(msg)) return;
  const now = Date.now();
  let first = true;
  TRANSFERS.forEach(t=>{

      t.receivedQty = first ? receivedQty : 0;

// جرد سريع من بطاقة التسليم (لو المنتج ما جُرد بعد)
async function quickCount(bc, name){
  const inp = document.getElementById("qc_"+bc);
  if (!inp || inp.value === ""){ showToast("اكتب كم باقي عندك"); return; }
  const count = Math.max(0, num(inp.value));
  const calc = calcRemaining(bc);
  const soldAtCount = branchSoldOf(bc);
  COUNTS[bc+"_"+BRANCH] = { count, calc, soldAtCount, branch: BRANCH, barcode: bc, name, emp: EMP, date: Date.now() };
  await save("baro_branch_counts_v2", COUNTS);
  showToast(`✓ جردت ${name||bc}: ${fmtN(count)}`);
  renderTabBody(); // يعيد رسم التسليم — يبيّن ✓ جردته
}

function stepDeliver(bc, dest, delta){
  const inp = document.getElementById("dlv_"+bc+"_"+dest);

async function confirmDeliver(bc, dest, suggested){
  const items = TRANSFERS.filter(t=>t.barcode===bc && t.from===BRANCH && t.to===dest && t.printed && !t.delivered);
  if (items.length===0) return;
  const inp = document.getElementById("dlv_"+bc+"_"+dest);
  const deliverQty = inp ? Math.max(0, num(inp.value)) : suggested;
  const name = items[0].name || bc;
  const changed = deliverQty !== suggested;
  const msg = changed
    ? `ترسل ${fmtN(deliverQty)} بدل ${fmtN(suggested)} لفرع ${dest}؟`
    : `تأكيد تسليم ${fmtN(deliverQty)} قطعة من ${name} لفرع ${dest}؟`;
  if (!confirm(msg)) return;
  const now = Date.now();
  // نعلّم كل السجلات مسلّمة، ونحدّث الكمية الفعلية (على أول سجل، والباقي صفر)
  let first = true;
  TRANSFERS.forEach(t=>{
    if (t.barcode===bc && t.from===BRANCH && t.to===dest && t.printed && !t.delivered){
      t.delivered = true; t.deliveredDate = now; t.deliveredBy = EMP;
      if (first){
        t.qty = deliverQty;          // ✅ الكمية المعدّلة = الفعلية (المستقبِل يشوفها)
        t.deliveredQty = deliverQty;
        first = false;
      } else {
        t.qty = 0;                   // باقي السجلات صفر (دُمجت في الأول)
      }
    }
  });
  await save("baro_transfers_v2", TRANSFERS);
  showToast(changed ? `✓ سلّمت ${fmtN(deliverQty)} (معدّلة) لفرع ${dest}` : `✓ سلّمت ${fmtN(deliverQty)} لفرع ${dest}`);
  render();
}

let _html5Qr = null;
async function loadQrLib(){
  if (window.Html5Qrcode) return true;
  const urls = [
    "https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js",
    "https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js",
  ];
  for (const url of urls){
    try {
      await new Promise((res,rej)=>{
        const s=document.createElement("script");
        s.src=url; s.onload=res; s.onerror=rej;
        setTimeout(rej,8000);
        document.head.appendChild(s);
      });
      if (window.Html5Qrcode) return true;
    } catch {}
  }
  return false;
}

    <div id="zoomBar" style="background:#0a0e1a;padding:12px 16px 18px;display:none">
      <div style="display:flex;align-items:center;gap:10px">
        <span style="color:#94a3b8;font-family:'Cairo';font-size:13px;font-weight:900">🔍</span>
        <input id="zoomRange" type="range" min="1" max="5" step="0.1" value="1" oninput="qrZoom(this.value)" style="flex:1;accent-color:#4ade80;height:26px" />
        <span id="zoomVal" style="color:#4ade80;font-family:'Cairo';font-size:13px;font-weight:900;min-width:32px;text-align:center">1x</span>
      </div>
    </div>
    <div id="scanMsg" style="text-align:center;color:#7cb3e8;font-family:'Cairo';font-size:13px;padding:0 0 14px;background:#0a0e1a">وجّه الكاميرا على الباركود</div>`;
  document.body.appendChild(ov);

  const ok = await loadQrLib();
  if (!ok || !window.Html5Qrcode){
    showCameraFallback();   // ما تحمّلت المكتبة → تصوير مباشر
    return;
  }
  try {
    _html5Qr = new Html5Qrcode("qrReader", {
      formatsToSupport: [
        Html5QrcodeSupportedFormats.CODE_128, Html5QrcodeSupportedFormats.EAN_13,
        Html5QrcodeSupportedFormats.EAN_8, Html5QrcodeSupportedFormats.CODE_39,
        Html5QrcodeSupportedFormats.UPC_A, Html5QrcodeSupportedFormats.UPC_E,
        Html5QrcodeSupportedFormats.ITF, Html5QrcodeSupportedFormats.CODABAR,
        Html5QrcodeSupportedFormats.QR_CODE,
      ],
      verbose: false
    });
    const config = {
      fps: 12,
      qrbox: (w,h)=>{ const m=Math.min(w,h); return { width: Math.floor(m*0.82), height: Math.floor(m*0.5) }; },
      aspectRatio: 1.4,
      experimentalFeatures: { useBarCodeDetectorIfSupported: true }
    };
    await _html5Qr.start(
      { facingMode: "environment" },
      config,
      (decodedText)=>{ onScanned(decodedText); },
      ()=>{}
    );
    setTimeout(setupZoomTorch, 800);
    addFallbackButton();   // زر "صوّر الباركود" — احتياطي لو الماسح ما لقط
  } catch(e){
    showCameraFallback();  // الماسح ما اشتغل نهائياً → تصوير مباشر
  }
}

// زر احتياطي داخل شاشة الماسح
function addFallbackButton(){
  const msg = document.getElementById("scanMsg");
  if (!msg) return;
  msg.innerHTML = `وجّه الكاميرا على الباركود<br><button onclick="fallbackCapture()" style="margin-top:10px;background:#7c3aed;color:#fff;border:none;border-radius:10px;padding:10px 20px;font-family:'Cairo';font-weight:900;font-size:14px;cursor:pointer">📸 ما لقط؟ صوّر الباركود</button>`;
}

// لو الماسح ما اشتغل أصلاً — تصوير مباشر
function showCameraFallback(){
  const reader = document.getElementById("qrReader");
  const msg = document.getElementById("scanMsg");
  if (reader) reader.innerHTML = `<div style="height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;text-align:center">
    <div style="font-size:50px;margin-bottom:16px">📸</div>
    <div style="color:#fff;font-family:'Cairo';font-size:15px;margin-bottom:20px">الماسح ما اشتغل على جهازك<br>صوّر الباركود بالكاميرا</div>
    <button onclick="fallbackCapture()" style="background:#7c3aed;color:#fff;border:none;border-radius:12px;padding:14px 28px;font-family:'Cairo';font-weight:900;font-size:16px;cursor:pointer">📸 صوّر الباركود</button>
  </div>`;
  if (msg) msg.textContent = "يعمل على أي جوال";
}

// يفتح كاميرا الجهاز مباشرة ويقرأ الباركود من الصورة
function fallbackCapture(){
  const inp = document.createElement("input");
  inp.type = "file"; inp.accept = "image/*"; inp.capture = "environment";
  inp.onchange = async () => {
    const file = inp.files?.[0]; if (!file) return;
    const reader = document.getElementById("qrReader");
    if (reader) reader.innerHTML = `<div style="height:100%;display:flex;align-items:center;justify-content:center;color:#7cb3e8;font-family:'Cairo'"><span class="spin">⏳</span>&nbsp; جاري قراءة الباركود…</div>`;
    try {
      const b64 = await fileToBase64(file);
      const code = await ocrBarcode(b64);
      if (code){ onScanned(code); }
      else if (reader){
        reader.innerHTML = `<div style="height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;text-align:center;color:#f87171;font-family:'Cairo'"><div>ما قدرت أقرأ الباركود</div><button onclick="fallbackCapture()" style="margin-top:14px;background:#7c3aed;color:#fff;border:none;border-radius:10px;padding:10px 20px;font-family:'Cairo';font-weight:900;cursor:pointer">📸 صوّر مرة ثانية</button></div>`;
      }
    } catch(e){
      if (reader) reader.innerHTML = `<div style="padding:20px;text-align:center;color:#f87171;font-family:'Cairo'">تعذّر — ${e.message}<br><button onclick="fallbackCapture()" style="margin-top:12px;background:#7c3aed;color:#fff;border:none;border-radius:10px;padding:10px 20px;font-family:'Cairo';font-weight:900;cursor:pointer">📸 حاول ثانية</button></div>`;
    }
  };
  inp.click();
}

function fileToBase64(file){
  return new Promise((res,rej)=>{
    const r = new FileReader();
    r.onload = () => res(String(r.result).split(",")[1]);
    r.onerror = rej;
    r.readAsDataURL(file);
  });
}

// قراءة الباركود من الصورة عبر السيرفر
async function ocrBarcode(base64){
  try {
    const r = await fetch("/api/scan-barcode", {
      method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({ imageBase64: base64 })
    });
    const j = await r.json();
    return (j.barcode || "").trim() || null;
  } catch { return null; }
}

function setupZoomTorch(){
  try {
    const caps = _html5Qr.getRunningTrackCapabilities();
    if (caps && caps.zoom){
      const zb=document.getElementById("zoomBar"), zr=document.getElementById("zoomRange");
      if (zb && zr){
        zb.style.display="block";
        zr.min=caps.zoom.min; zr.max=caps.zoom.max; zr.step=caps.zoom.step||0.1;
        const z=Math.min(2,caps.zoom.max); zr.value=z; qrZoom(z);
      }
    }
    if (caps && caps.torch){ const tb=document.getElementById("torchBtn"); if(tb) tb.style.display="block"; }
  } catch {}
}
function qrZoom(v){
  const val=parseFloat(v);
  const el=document.getElementById("zoomVal"); if(el) el.textContent=val.toFixed(1).replace(/\.0$/,"")+"x";
  try { _html5Qr.applyVideoConstraints({ advanced:[{zoom:val}] }); } catch {}
}
let _torchOn=false;
async function qrTorch(){
  _torchOn=!_torchOn;
  try { await _html5Qr.applyVideoConstraints({ advanced:[{torch:_torchOn}] });
    const tb=document.getElementById("torchBtn"); if(tb) tb.style.background=_torchOn?"rgba(251,191,36,0.3)":"#1a2236";
  } catch {}
}

function onScanned(code){
  if (!code) return;
  try { navigator.vibrate && navigator.vibrate(90); } catch(e){}
  const c = code.trim();
  const qr = _html5Qr; _html5Qr = null; _torchOn = false;
  const ov = document.getElementById("scanOverlay");
  const cleanup = ()=>{ if(ov) ov.remove(); };
  if (qr){ try { qr.stop().then(cleanup).catch(cleanup); } catch { cleanup(); } }
  else cleanup();
  if (_scanTarget === "fast"){
    _scanTarget = null;
    const bcEl = document.getElementById("fastBc");
    if (bcEl){
      bcEl.value = c;
      fastLookup();
      const qtyEl = document.getElementById("fastQty");
      if (qtyEl) qtyEl.focus();
      showToast("✓ " + c);
      return;
    }
  }
  _scanTarget = null;
  searchTerm = c;
  render();
  showToast("🔍 " + c);
}

async function closeScanner(){
  const qr = _html5Qr; _html5Qr = null; _torchOn = false;
  const done = ()=>{ const ov=document.getElementById("scanOverlay"); if(ov) ov.remove(); };
  if (qr){ try { qr.stop().then(done).catch(done); } catch { done(); } }
  else done();
}

init();
</script>
