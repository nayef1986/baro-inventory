<style>
  @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap');
  *{font-family:'Cairo',sans-serif;box-sizing:border-box;margin:0;padding:0}

  .logbr button{background:rgba(239,68,68,0.15);color:#fca5a5;border:none;border-radius:7px;padding:4px 12px;font-size:11px;font-weight:700;font-family:'Cairo';cursor:pointer}

  .unitbar .ub{background:#1a2236;border:1px solid #2d3a52;color:#cbd5e1;border-radius:8px;padding:6px 14px;font-size:14px;font-weight:900;font-family:'Cairo';cursor:pointer}
  .unitbar .ub.on{background:#3b82f6;border-color:#3b82f6;color:#fff}
  .unitbar .uinput{width:60px;background:#1a2236;border:1px solid #2d3a52;color:#fff;border-radius:8px;padding:6px;font-size:14px;font-weight:900;text-align:center;font-family:'Cairo'}

<script>
const SUPABASE_URL = "https://tvxxprynqeufzlgleurm.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InR2eHhwcnlucWV1ZnpsZ2xldXJtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkwNjk4NTAsImV4cCI6MjA5NDY0NTg1MH0.FfHtUehBX0yjZsuMiE8Z8UP7bE1Ii_RFB5FKT4EJuXk";
const TABLE = "baro_store";
const MIN = 12, RECENT_DAYS = 7;
// كمية الوحدة (البوكس/الدزينة) لكل منتج — افتراضي 12، يعدّلها موظف المستودع
function unitOf(bc){
  const p = PRODUCTS.find(x=>x.barcode===bc);
  const u = num(p?.unitQty ?? 0);
  return u >= 1 ? u : MIN;
}
function toUnit(sold, unit){ const u = unit||MIN; return Math.ceil(sold/u)*u; }
async function saveUnitQty(bc, qty){
  const u = Math.max(1, num(qty));
  const p = PRODUCTS.find(x=>x.barcode===bc);
  if (!p) return;
  p.unitQty = u;
  await save("baro_products_v2", PRODUCTS);
  SALES_MAP = null; currentNeeds = [];
  showToast(`كمية ${bc}: ${u} ✓`);
  const y = window.scrollY;
  currentNeeds = computeNeeds();
  if (selectedCont) drawContPage(document.getElementById("content"));
  requestAnimationFrame(()=>window.scrollTo(0,y));
}
const FIXED_QTY = 12; // كمية الاعتماد دائماً 12
const toDozen = n => Math.ceil(n/MIN)*MIN;
const num = v => { const n = parseFloat(v); return isNaN(n)?0:n; };
const fmtN = n => Math.round(num(n)).toLocaleString("en-US");

let PRODUCTS = [], PERIODS = [], SETTINGS = {}, IMAGES = {}, TRANSFERS = [], COUNTS = {}, WH_COUNTS = {};
const isWh = f => !f || f==="المستودع" || f==="المستودع الرئيسي";

// ═══ حارس الأداء: يقيس العمليات الثقيلة ويحذّر لو تجاوزت الحد ═══
const PERF_LIMIT_MS = 400; // لو عملية أخذت أكثر من هذا = تحذير
function perf(label, fn){
  const t0 = performance.now();
  const result = fn();
  const dt = performance.now() - t0;
  if (dt > PERF_LIMIT_MS){
    console.warn(`🔴 بطء [${label}]: ${dt.toFixed(0)}ms (الحد ${PERF_LIMIT_MS}ms) — منتجات:${PRODUCTS.length} تحويلات:${TRANSFERS.length} فترات:${PERIODS.length}`);
  } else {
    console.log(`⏱️ [${label}]: ${dt.toFixed(0)}ms`);
  }
  return result;
}
// حد أقصى صارم للعرض (يمنع رسم آلاف العناصر مرة وحدة)
const MAX_RENDER = 300;
let SALES_MAP = null;
let currentNeeds = [];
let activeTab = "needs";
let openCont = null, openProd = null, openLog = null;
let selectedCont = null; // الكونتينر المفتوح (شاشة مستقلة)
let excluded = {}; // {barcode_branch: true} = مستثنى
let approvedNow = {}; // {barcode: count} = اعتُمد بهذه الجلسة
let qtyEdit = {};  // {barcode_branch: qty} كمية معدّلة
let viewImg = null; // الصورة المكبّرة

// ─── كاش IndexedDB (تحميل فوري بعد أول مرة) ──────────────────
const IDB_NAME = "baro_cache", IDB_STORE = "kv";
function idbOpen(){
  return new Promise((res, rej) => {
    const r = indexedDB.open(IDB_NAME, 1);
    r.onupgradeneeded = () => r.result.createObjectStore(IDB_STORE);
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
}
async function idbGet(key){
  try { const db = await idbOpen(); return await new Promise((res)=>{ const t=db.transaction(IDB_STORE,"readonly").objectStore(IDB_STORE).get(key); t.onsuccess=()=>res(t.result??null); t.onerror=()=>res(null); }); }
  catch { return null; }
}
async function idbSet(key, val){
  try { const db = await idbOpen(); const t=db.transaction(IDB_STORE,"readwrite"); t.objectStore(IDB_STORE).put(val, key); }
  catch {}
}

// جلب من Supabase (بدون كاش)
async function fetchRemote(key){
  const r = await fetch(`${SUPABASE_URL}/rest/v1/${TABLE}?key=eq.${key}&select=value`,
    { headers:{ apikey:SUPABASE_KEY, Authorization:`Bearer ${SUPABASE_KEY}` } });
  const j = await r.json();
  const raw = j?.[0]?.value;
  if (raw == null) return null;
  if (typeof raw === "string") { try { return JSON.parse(raw); } catch { return null; } }
  return raw;
}

// load: يرجع الكاش فوراً لو موجود، ويحدّثه من Supabase بالخلفية
async function load(key) {
  const cached = await idbGet(key);
  if (cached != null){
    // حدّث بالخلفية (ما ننتظره)
    fetchRemote(key).then(fresh => { if (fresh != null) idbSet(key, fresh); }).catch(()=>{});
    return cached;
  }
  // أول مرة: من Supabase + خزّن
  const fresh = await fetchRemote(key);
  if (fresh != null) idbSet(key, fresh);
  return fresh;
}
// 🛡️ حماية: لا نحفظ أبداً مصفوفة فاضية فوق بيانات حرجة (يمنع مسح كل شي)
let DATA_LOADED = false; // يصير true فقط بعد تحميل ناجح من Supabase
const CRITICAL_KEYS = ["baro_products_v2", "baro_periods_v2", "baro_transfers_v2"];

async function save(key, value) {
  // الحارس: لو المفتاح حرج والقيمة فاضية → ارفض الحفظ
  if (CRITICAL_KEYS.includes(key)) {
    const isEmpty = !value || (Array.isArray(value) && value.length === 0);
    if (isEmpty) {
      showToast("⚠️ مُنع حفظ بيانات فاضية (حماية)");
      console.warn(`🛡️ رُفض حفظ ${key} لأنه فاضي`);
      return false;
    }
    if (!DATA_LOADED) {
      showToast("⚠️ انتظر اكتمال التحميل قبل الحفظ");
      console.warn(`🛡️ رُفض حفظ ${key} — البيانات لم تُحمّل بعد`);
      return false;
    }
  }
  await fetch(`${SUPABASE_URL}/rest/v1/${TABLE}`, {
    method:"POST",
    headers:{ apikey:SUPABASE_KEY, Authorization:`Bearer ${SUPABASE_KEY}`, "Content-Type":"application/json", Prefer:"resolution=merge-duplicates" },
    body: JSON.stringify({ key, value: JSON.stringify(value), updated_at: new Date().toISOString() })
  });
  idbSet(key, value); // حدّث الكاش عشان القراءة الجاية تكون صحيحة
  return true;
}

function getFactoryCode(bc){ const s=String(bc??"").trim(); return s.length<5?s:s.slice(0,5); }
function totalPurchases(p){ return (p.purchases??[]).reduce((s,x)=>s+num(x.qty),0); }
// تاريخ آخر توريد (آخر عملية شراء)
function lastSupplyDate(p){
  const ps = p.purchases ?? [];
  if (ps.length === 0) return "";
  const last = ps[ps.length-1];
  const d = last.date || last.invoiceDate || last.day;
  if (!d) return "";
  const dt = new Date(d);
  if (isNaN(dt)) return String(d);
  return (dt.getDate()+"").padStart(2,"0")+"/"+(dt.getMonth()+1+"").padStart(2,"0")+"/"+dt.getFullYear();
}
function showToast(msg){ const t=document.getElementById("toast"); t.textContent=msg; t.classList.add("show"); setTimeout(()=>t.classList.remove("show"),2000); }

// ─── بحث سلس: المربع ثابت خارج #content (ما ينحذف) + تأخير 250ms ─────
const _searchTimers = {};
const _renderMap = {};
function onSearchType(id, setter, renderFn, val){
  setSearchVar(setter, val);                  // نحدّث النص فوراً
  clearTimeout(_searchTimers[id]);
  _searchTimers[id] = setTimeout(()=>{        // نفلتر بعد ما يوقف عن الكتابة
    const fn = _renderMap[renderFn];
    if (fn) fn(document.getElementById("content"));
  }, 250);
}
function setSearchVar(name, val){
  if (name==="whCountSearch") whCountSearch = val;
  else if (name==="countSearch") countSearch = val;
  else if (name==="btxSearch") btxSearch = val;
  else if (name==="logSearch") logSearch = val;
}

// نسخ الباركود للحافظة
function copyBarcode(bc){
  const done = ()=>showToast(`نُسخ: ${bc} ✓`);
  if (navigator.clipboard?.writeText){
    navigator.clipboard.writeText(bc).then(done).catch(()=>{
      const ta=document.createElement("textarea"); ta.value=bc; document.body.appendChild(ta); ta.select();
      try{ document.execCommand("copy"); done(); }catch{} ta.remove();
    });
  } else {
    const ta=document.createElement("textarea"); ta.value=bc; document.body.appendChild(ta); ta.select();
    try{ document.execCommand("copy"); done(); }catch{} ta.remove();
  }
}

// إجمالي الموزّع لفرع معين (كل التوزيعات المُرحّلة للسجل — مو بس آخر أسبوع)
let _txIndex = null;
let _txByBc = null; // باركود → تحويلات المستودع (لأداء priorTransfers)
function buildTxIndex(){
  const _t0 = performance.now();
  _txIndex = {};
  _txByBc = {};
  TRANSFERS.forEach(t=>{
    if (!t.printed) return;
    const key = t.barcode+"_"+t.to;
    if (!_txIndex[key]) _txIndex[key] = { total:0, items:[] };
    _txIndex[key].total += num(t.qty);
    _txIndex[key].items.push(t);
    // فهرس بالباركود لتحويلات المستودع فقط
    const fromWh = !t.from || t.from==="المستودع" || t.from==="المستودع الرئيسي";
    if (fromWh){
      if (!_txByBc[t.barcode]) _txByBc[t.barcode] = [];
      _txByBc[t.barcode].push(t);
    }
  });
  const _dt = performance.now() - _t0;
  if (_dt > 300) console.warn(`🔴 بطء [buildTxIndex]: ${_dt.toFixed(0)}ms — تحويلات:${TRANSFERS.length}`);
}
function whTransfersOf(bc){
  if (_txIndex === null) buildTxIndex();
  return _txByBc[bc] || [];
}
function totalDistributed(bc, branch){
  if (_txIndex === null) buildTxIndex();
  return _txIndex[bc+"_"+branch]?.total || 0;
}
// التحويلات بعد وقت معيّن (وقت الجرد)
function distributedAfter(bc, branch, sinceTs){
  if (_txIndex === null) buildTxIndex();
  const rec = _txIndex[bc+"_"+branch];
  if (!rec) return 0;
  let s = 0;
  for (const t of rec.items){
    if (!isWh(t.from)) continue;             // من المستودع فقط
    if (num(t.date) > num(sinceTs)) s += num(t.qty); // بعد الجرد
  }
  return s;
}
// كل الوارد من المستودع لهذا الفرع (بغض النظر عن وقت الجرد)
function whReceivedTotal(bc, branch){
  if (_txIndex === null) buildTxIndex();
  const rec = _txIndex[bc+"_"+branch];
  if (!rec) return 0;
  let s = 0;
  for (const t of rec.items){ if (isWh(t.from)) s += num(t.qty); }
  return s;
}

function recentTransfer(bc, branch){
  if (_txIndex === null) buildTxIndex();
  const rec = _txIndex[bc+"_"+branch];
  if (!rec) return 0;
  const now = Date.now(), cutoff = RECENT_DAYS*86400000;
  let s = 0;
  for (const t of rec.items){ if ((now-t.date) < cutoff) s += num(t.qty); }
  return s;
}

// ✅ المباع/المتبقي: يحسب كل الفروع (يطابق النظام الأساسي)
function buildSalesMap(){
  const map = {};
  PERIODS.forEach(per=>{
    Object.entries(per.sales??{}).forEach(([branch,d])=>{
      Object.entries(d).forEach(([bc,v])=>{
        const q = num(v?.qty??0);
        if (q<=0) return;
        if (!map[bc]) map[bc] = {};
        map[bc][branch] = (map[bc][branch]??0) + q;
      });
    });
  });
  return map;
}

// نضيف الباركودات اليتيمة (لها مبيعات بس ما لها فاتورة) كمنتجات مؤقتة
// كمية الشراء = المباع + 20% → تظهر في النواقص فوراً بدون نقل
let _orphansInjected = false;
function injectOrphans(){
  if (_orphansInjected) return; // مرة وحدة فقط (يمنع التكرار الثقيل)
  _orphansInjected = true;
  const known = new Set(PRODUCTS.map(p=>p.barcode));
  const orphanAgg = {}; // barcode → { sold, names:Set }
  PERIODS.forEach(per=>{
    Object.values(per.sales??{}).forEach(d=>{
      Object.entries(d).forEach(([bc,v])=>{
        if (known.has(bc)) return;
        const q = num(v?.qty??0);
        if (q<=0) return;
        if (!orphanAgg[bc]) orphanAgg[bc] = { sold:0, names:new Set() };
        orphanAgg[bc].sold += q;
        (v?.salesNames??[]).forEach(n=>n && orphanAgg[bc].names.add(n));
      });
    });
  });
  const orphanProducts = Object.entries(orphanAgg).map(([bc,o])=>({
    barcode: bc,
    name: [...o.names][0] || bc,
    container: "📋 بلا فاتورة",
    _orphan: true,
    purchases: [{ qty: Math.ceil(o.sold * 1.2), buyPrice: 0, sellPrice: 0, container: "📋 بلا فاتورة" }],
  }));
  if (orphanProducts.length){
    PRODUCTS = PRODUCTS.concat(orphanProducts);
  }
}

// النواقص مقسّمة بالكونتينر
function computeNeeds(){
  if (!SALES_MAP) SALES_MAP = buildSalesMap();
  if (_txIndex === null) buildTxIndex(); // الفهرس مرة وحدة (الحل الجذري للأداء)
  const needs = [];
  let _cnI = 0;
  PRODUCTS.forEach(p=>{
    _cnI++;
    const bought = totalPurchases(p);
    const branchSales = SALES_MAP[p.barcode];
    if (!branchSales) return;
    const totalSold = Object.values(branchSales).reduce((s,q)=>s+q,0);
    const closing = Math.max(0, bought-totalSold);
    if (closing <= 0) return;
    const unit = unitOf(p.barcode);
    const threshold = Math.ceil(unit/2); // العتبة = نص الوحدة (12→6, 24→12, 36→18)
    // ✅ التوزيع فقط يستثني الفروع المقفلة (المباع فوق يشمل الكل)
    const closedB = SETTINGS?.closedBranches ?? [];
    const branches = Object.entries(branchSales).filter(([branch])=>!closedB.includes(branch)).map(([branch,bsold])=>{
      const given = toUnit(bsold, unit);
      const distributed = totalDistributed(p.barcode, branch); // كل اللي وزّعناه لهذا الفرع
      const recent = recentTransfer(p.barcode, branch);
      // الباقي المحسوب = المفروض يأخذ − اللي باعه + اللي وزّعناه له فعلاً
      let remaining = given - bsold + distributed;
      // ✅ لو فيه جرد فعلي لهذا الفرع، نستخدمه بدل الحساب
      const cnt = COUNTS?.[p.barcode+"_"+branch];
      let counted = false, staleCount = false, soldAfter = 0;
      if (cnt){
        const soldAtCount = num(cnt.soldAtCount);
        // التحويلات من المستودع لهذا الفرع بعد وقت الجرد (تزيد المتبقي)
        const distAfterCount = distributedAfter(p.barcode, branch, num(cnt.date));
        if (bsold >= soldAtCount){
          // ✅ الوضع الطبيعي: المبيعات زادت من وقت الجرد
          soldAfter = bsold - soldAtCount;                 // باع كم بعد الجرد
          remaining = num(cnt.count) - soldAfter + distAfterCount; // − المباع بعده + التحويلات بعده
          counted = true;
        } else {
          // 🔴 المبيع الحالي أقل من وقت الجرد = المبيعات حُذفت/رُفعت من جديد
          //    المرجع القديم مات → نعتبر الجرد نظيفاً: نطرح كل المبيعات الحالية للفرع + نضيف التحويلات
          remaining = num(cnt.count) - bsold + distAfterCount;
          if (remaining < 0){ staleCount = true; }        // الجرد قديم فعلاً → ننبّه
          else counted = true;
        }
        if (remaining < 0) remaining = 0;
      }
      return { branch, sold:bsold, given, remaining, recent, distributed, counted, staleCount, soldAfter, countVal: cnt?num(cnt.count):null };
    }).filter(b=> b.remaining < threshold).sort((a,b)=>a.remaining-b.remaining);
    if (branches.length === 0) return;
    // ✅ هل وزّع المستودع هذا المنتج سابقاً؟ (نقل الفروع فرع→فرv لا يُحسب هنا)

    const priorTransfers = whTransfersOf(p.barcode); // من الفهرس (خفيف)
    const distributedBefore = priorTransfers.length > 0;
    const lastDistDate = distributedBefore ? Math.max(...priorTransfers.map(t=>num(t.date))) : 0;
    const priorBranches = [...new Set(priorTransfers.map(t=>t.to))];
    // هل أي فرع في هذا المنتج مجرود فعلياً؟
    const hasCount = branches.some(b=>b.counted);
    const hasStale = branches.some(b=>b.staleCount);
    needs.push({ p, bought, totalSold, closing, branches, distributedBefore, lastDistDate, priorBranches, hasCount, hasStale });
  });
  // نجمّع الموزّع سابقاً فوق (عشان الموظف يلقاها بسرعة)
  // الترتيب: الموزّع سابقاً (يحتاج توزيع مرة أخرى) أولاً، ثم الأكثر متبقّي
  needs.sort((a,b)=>
    (b.distributedBefore?1:0) - (a.distributedBefore?1:0)   // الموزّع سابقاً أولاً
    || b.closing - a.closing                                 // ثم الأكثر متبقّي
  );
  return needs;
}

// تجميع بالكونتينر
function groupByContainer(needs){
  const g = {};
  needs.forEach(n=>{
    const cont = n.p.container || "بدون كونتينر";
    if (!g[cont]) g[cont] = [];
    g[cont].push(n);
  });
  return g;
}

async function saveProduct(bc){
  const n = currentNeeds.find(x=>x.p.barcode===bc);
  if (!n) return;
  const added = [];
  const batchId = Date.now();
  n.branches.forEach(b=>{
    const key = bc+"_"+b.branch;
    if (excluded[key]) return;
    const qty = num(qtyEdit[key] ?? unitOf(bc));
    TRANSFERS.push({ barcode:bc, name:n.p.name, from:"المستودع", to:b.branch, qty, sold:b.sold, given:b.given, remaining:b.remaining, date:Date.now(), printed:true, batch:batchId });
    added.push(b.branch);
  });
  if (added.length === 0){ showToast("ما فيه فروع معتمدة"); return; }
  _txIndex = null; await save("baro_transfers_v2", TRANSFERS);
  showToast(`✓ اعتُمد ${added.length} فرع — في تبويب الطباعة`);
  SALES_MAP = null;
  // نعلّم المنتج "معتمد" بدون إعادة حساب أو إعادة رسم كامل (نحافظ على المكان تماماً)
  approvedNow[bc] = added.length;
  const card = document.getElementById("prod_"+bc);
  if (card){
    const btn = card.querySelector(".save");
    if (btn){ btn.textContent = "✓ تم الاعتماد ("+added.length+" فرع)"; btn.style.background = "#334155"; btn.disabled = true; }
  }
}

// عارض الصورة (تكبير + حفظ)
function openImg(src, name){
  const ov = document.createElement("div");
  ov.style.cssText = "position:fixed;inset:0;background:rgba(0,0,0,0.92);z-index:300;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px";
  ov.onclick = ()=>ov.remove();
  ov.innerHTML = `
    <img src="${src}" style="max-width:100%;max-height:70vh;border-radius:14px;object-fit:contain" onclick="event.stopPropagation()" />
    <div style="color:#fff;font-weight:700;margin-top:12px;text-align:center">${name||''}</div>
    <div style="display:flex;gap:10px;margin-top:16px" onclick="event.stopPropagation()">
      <button id="saveImgBtn" style="padding:12px 24px;border-radius:100px;border:none;background:linear-gradient(135deg,#22c55e,#16a34a);color:#fff;font-size:14px;font-weight:900;font-family:'Cairo';cursor:pointer">💾 حفظ الصورة</button>
      <button onclick="this.closest('div').parentElement.remove()" style="padding:12px 24px;border-radius:100px;border:1px solid rgba(255,255,255,0.2);background:rgba(255,255,255,0.1);color:#fff;font-size:14px;font-weight:700;font-family:'Cairo';cursor:pointer">إغلاق</button>
    </div>`;
  document.body.appendChild(ov);
  ov.querySelector("#saveImgBtn").onclick = async ()=>{
    try {
      const res = await fetch(src); const blob = await res.blob();
      const fn = (name||"image").replace(/[^\w\u0600-\u06FF]/g,"_")+".jpg";
      if (navigator.canShare){
        const file = new File([blob], fn, {type:blob.type});
        if (navigator.canShare({files:[file]})){ await navigator.share({files:[file]}); return; }
      }
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a"); a.href=url; a.download=fn; a.click();
      setTimeout(()=>URL.revokeObjectURL(url),1000);
    } catch { alert("اضغط مطوّل على الصورة لحفظها"); }
  };
}

let whCountSearch = "";
function whStockOf(bc){
  const p = PRODUCTS.find(x=>x.barcode===bc);
  if (!p) return 0;
  let bought = 0;
  (p.purchases||[]).forEach(pu=>bought += num(pu.qty));
  if (!bought) bought = num(p.qty)||0;
  let totalSold = 0;
  PERIODS.forEach(per=>{ Object.values(per.sales??{}).forEach(bd=>{ totalSold += num(bd[bc]?.qty??0); }); });
  return Math.max(0, bought - totalSold);
}

function renderCounts(c){
  const counted = Object.values(COUNTS||{});
  // نضيف المنتجات اللي لها تحويل من المستودع بس مو مجرودة (عشان تظهر برضه)
  const countedKeys = new Set(counted.map(e=>e.barcode+"_"+e.branch));
  // نحسب إجمالي الوارد من المستودع لكل (باركود_فرع) مرة وحدة — بدل تكرار الفلترة
  const txTotals = {};
  TRANSFERS.forEach(t=>{
    if (!(t.from==="المستودع"||t.from==="المستودع الرئيسي") || !t.printed) return;
    const key = t.barcode+"_"+t.to;
    txTotals[key] = (txTotals[key]||0) + num(t.qty);
  });
  const transferOnly = [];
  const seenTx = new Set();
  TRANSFERS.forEach(t=>{
    if (!(t.from==="المستودع"||t.from==="المستودع الرئيسي") || !t.printed) return;
    const key = t.barcode+"_"+t.to;
    if (countedKeys.has(key) || seenTx.has(key)) return; // مجرود أصلاً أو مضاف
    seenTx.add(key);
    transferOnly.push({ barcode:t.barcode, name:t.name, branch:t.to, emp:"—", count:null, calc:0, soldAtCount:0, date:0, _transferOnly:true, _txTotal: txTotals[key]||0 });
  });

  const q = (countSearch||"").trim().toLowerCase();
  let filtered = entries;
  if (q) filtered = entries.filter(e => (e.barcode||"").toLowerCase().includes(q) || (e.name||"").toLowerCase().includes(q) || (e.branch||"").toLowerCase().includes(q) || (e.emp||"").toLowerCase().includes(q));

function fInvNo(t){
  // مفتاح داخلي لتجميع أصناف الفاتورة الواحدة (نفس الدقيقة + نفس الوجهة)
  const d = new Date(t.date||t.ts||0);
  if (!d.getTime()) return "—";
  const p=n=>String(n).padStart(2,"0");
  return `${p(d.getMonth()+1)}${p(d.getDate())}-${p(d.getHours())}${p(d.getMinutes())}`;
}
// تاريخ الفاتورة للعرض
function fInvDate(ts){
  const d = new Date(ts||0);
  if (!d.getTime()) return "—";
  const p=n=>String(n).padStart(2,"0");
  return `${p(d.getDate())}/${p(d.getMonth()+1)}/${d.getFullYear()} · ${p(d.getHours())}:${p(d.getMinutes())}`;
}
function renderBranchTx(c){

// يبني محتوى بوليصة واحدة (نفس تصميم النواقص) — يُستخدم في الإفرادي والمجمّع
// يحسب فروع المنتج (باع/أخذ/باقي) من periods مباشرة — نفس منطق فاتورة الاحتياج (مضمون)
function branchesForPrint(bc){
  const closed = SETTINGS?.closedBranches ?? [];
  const branchSales = {};
  PERIODS.forEach(per => {
    Object.entries(per.sales ?? {}).forEach(([branch, d]) => {
      if (closed.includes(branch)) return;
      const q = num(d[bc]?.qty ?? 0);
      if (q > 0) branchSales[branch] = (branchSales[branch] ?? 0) + q;
    });
  });
  const unit = unitOf(bc);
  return Object.entries(branchSales).map(([branch, sold]) => {
    const given = toUnit(sold, unit);
    return { branch, sold, given, remaining: given - sold };
  }).sort((a,b)=>a.remaining-b.remaining);
}

// طباعة كل المعتمد غير المطبوع — نفس تصميم النواقص بالضبط
function printAll(){
  const _DAY2=86400000, _now2=Date.now();
  const unprinted = TRANSFERS.filter(t=> isWh(t.from) && (_now2-num(t.date))<_DAY2);
  if (unprinted.length === 0) return;
  if (!SALES_MAP) SALES_MAP = buildSalesMap();
  const d = new Date();
  const ds = (d.getDate()+"").padStart(2,"0")+"/"+(d.getMonth()+1+"").padStart(2,"0")+"/"+d.getFullYear();
  const byProd = {};
  unprinted.forEach(t=>{ if(!byProd[t.barcode]) byProd[t.barcode]=[]; byProd[t.barcode].push(t); });

  const slips = Object.entries(byProd).map(([bc, items])=>{
    const prod = PRODUCTS.find(p=>p.barcode===bc);
    const bought = prod ? totalPurchases(prod) : 0;
    // فروع المنتج محسوبة من periods مباشرة (مضمون — زي الاحتياج)
    const allBranches = branchesForPrint(bc);
    const totalSold = allBranches.reduce((s,b)=>s+b.sold,0);
    const closing = Math.max(0, bought-totalSold);
    // الفروع المعتمدة (في التوزيع) فقط
    const approvedNames = new Set(items.map(t=>t.to));
    const qtyByBranch = {}; items.forEach(t=>{ qtyByBranch[t.to] = num(t.qty); });
    const printBranches = allBranches.filter(b=>approvedNames.has(b.branch));
    const rows = printBranches.map((b,i)=>
      `<tr><td class="rn">${i+1}</td><td class="brn">${b.branch}</td><td class="num">${fmtN(b.sold)}</td><td class="num">${fmtN(b.given)}</td><td class="rem">${fmtN(b.remaining)}</td><td class="send">${fmtN(qtyByBranch[b.branch] ?? 12)}</td></tr>`
    ).join("");
    const info = { name: prod?.name ?? items[0].name, enName: prod?.nameEn ?? prod?.englishName ?? "", container: prod?.container ?? "", ds, lastSupply: prod?lastSupplyDate(prod):"", closing, bought, totalSold, needyCount: printBranches.length };
    return buildSlipBody(bc, rows, info);
  }).join("");

  const count = Object.keys(byProd).length;
  // نعرض overlay داخل الصفحة (مو نافذة — عشان الإغلاق يشتغل أكيد)
  const ov = document.createElement("div");
  ov.id = "printOverlay";
  ov.style.cssText = "position:fixed;inset:0;background:#ddd;z-index:500;overflow:auto;-webkit-overflow-scrolling:touch";
  ov.innerHTML = `
    <style>${slipCSS()}</style>
    <div class="tb" style="position:sticky">
      <button class="bk" onclick="closePrintOverlay()">✕ إغلاق</button>
      <button class="pr" onclick="doPrintOverlay('بوليصات_${ds.replace(/\//g,'-')}')">🖨️ طباعة (${count})</button>
    </div>
    <div class="wrap" id="printSlips">${slips}</div>`;
  document.body.appendChild(ov);
  document.body.style.overflow = "hidden";
  // نرسم الباركودات
  ov.querySelectorAll('svg.bcsvg').forEach(function(el){ try{ JsBarcode(el, el.getAttribute('data-code'), {format:"CODE128",width:2,height:60,displayValue:false,margin:2}); }catch(e){} });
}

  setTimeout(()=>{ document.title = old; }, 1000);

  const d = new Date();
  const ds = (d.getDate()+"").padStart(2,"0")+"/"+(d.getMonth()+1+"").padStart(2,"0")+"/"+d.getFullYear();
  const active = n.branches.filter(b=> b.branch && String(b.branch).trim() && !excluded[bc+"_"+b.branch]);
  const rows = active.map((b,i)=>{
    const qv = qtyEdit[bc+"_"+b.branch] ?? unitOf(bc);
    return `<tr><td class="rn">${i+1}</td><td class="brn">${b.branch}</td><td class="num">${fmtN(b.sold)}</td><td class="num">${fmtN(b.given)}</td><td class="rem">${fmtN(b.remaining)}</td><td class="send">${fmtN(qv)}</td></tr>`;
  }).join("");
  const info = { name:n.p.name, enName:n.p.nameEn ?? n.p.englishName ?? "", container:n.p.container ?? "", ds, lastSupply:lastSupplyDate(n.p), closing:n.closing, bought:n.bought, totalSold:n.totalSold, needyCount:active.length };

    <style>${slipCSS()}</style>

      <button class="pr" onclick="doPrintOverlay('${bc}_${ds.replace(/\//g,'-')}')">🖨️ طباعة</button>
      <button class="im" onclick="saveSlipImage('${bc}')">🖼️ حفظ صورة</button>
    </div>
    <div class="wrap">${slips}</div>`;
  document.body.appendChild(ov);
  document.body.style.overflow = "hidden";
  ov.querySelectorAll('svg.bcsvg').forEach(function(el){ try{ JsBarcode(el, el.getAttribute('data-code'), {format:"CODE128",width:2,height:60,displayValue:false,margin:2}); }catch(e){} });
}

async function saveSlipImage(bc){
  showToast("جاري إنشاء الصورة…");
  try {
    if (!window.html2canvas){
      await new Promise((res,rej)=>{ const s=document.createElement("script"); s.src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"; s.onload=res; s.onerror=rej; document.head.appendChild(s); });
    }
    const slip = document.querySelector("#printOverlay .slip");
    if (!slip) return;
    const canvas = await window.html2canvas(slip, { scale:2, backgroundColor:"#fff", useCORS:true });
    canvas.toBlob(async (blob)=>{
      const dd = new Date();
      const dstr = (dd.getDate()+"").padStart(2,"0")+"-"+(dd.getMonth()+1+"").padStart(2,"0")+"-"+dd.getFullYear();
      const fn = bc+"_"+dstr+".png";
      if (navigator.canShare){
        const file = new File([blob], fn, {type:"image/png"});
        if (navigator.canShare({files:[file]})){ await navigator.share({files:[file]}); return; }
      }
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a"); a.href=url; a.download=fn; a.click();
      setTimeout(()=>URL.revokeObjectURL(url),1000);
    }, "image/png");
  } catch(e){ alert("تعذّر حفظ الصورة — استخدم الطباعة بدلاً"); }
}

    navigator.clipboard.writeText(link).then(done).catch(()=>{ const ta=document.createElement("textarea");ta.value=link;document.body.appendChild(ta);ta.select();try{document.execCommand("copy");done();}catch{}ta.remove(); });

let REGIONS = {}; // { "منطقة": ["فرع1","فرع2"] }
async function loadRegions(){
  try { const r = await load("baro_regions_v2"); REGIONS = r ?? {}; } catch { REGIONS = {}; }
}
function branchRegion(branch){
  for (const reg in REGIONS){ if ((REGIONS[reg]||[]).includes(branch)) return reg; }
  return "بدون منطقة";
}
async function saveRegions(){
  try { await save("baro_regions_v2", REGIONS); } catch {}
}
function assignRegion(branch, region){
  // نشيله من أي منطقة قديمة
  for (const reg in REGIONS){ REGIONS[reg] = (REGIONS[reg]||[]).filter(b=>b!==branch); }
  // نحطه في الجديدة (لو مو "بدون منطقة")
  if (region && region !== "بدون منطقة"){
    if (!REGIONS[region]) REGIONS[region] = [];
    if (!REGIONS[region].includes(branch)) REGIONS[region].push(branch);
  }
  // ننظّف المناطق الفاضية
  Object.keys(REGIONS).forEach(reg=>{ if ((REGIONS[reg]||[]).length===0) delete REGIONS[reg]; });
  saveRegions();
  showBranchLinks(); // نعيد الرسم
}
function addRegion(){
  const name = (prompt("اسم المنطقة الجديدة:")||"").trim();
  if (!name) return;
  if (!REGIONS[name]) REGIONS[name] = [];
  saveRegions();
  showBranchLinks();
}

  const orderedRegions = Object.keys(REGIONS).filter(r=>grouped[r]?.length).sort();

      <div style="display:flex;gap:7px">

      </div>
    </div>`;
  };

  const regionBlock = (reg) => {

      </div>
      ${list.map(branchCard).join("")}

  };

  ov.innerHTML = `

      </div>
      ${branches.length===0 ? `<div style="text-align:center;padding:40px;color:#5b6b85">لا فروv مفتوحة</div>` : orderedRegions.map(regionBlock).join("")}

// ═══ ماسح الباركود — html5-qrcode (الأوثق عالمياً) ═══════════
let _html5Qr = null;
async function loadQrLib(){
  if (window.Html5Qrcode) return true;
  const urls = [
    "https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js",
    "https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js",
  ];
  for (const url of urls){
    try {
      await new Promise((res,rej)=>{
        const s=document.createElement("script");
        s.src=url; s.onload=res; s.onerror=rej;
        setTimeout(rej,8000);
        document.head.appendChild(s);
      });
      if (window.Html5Qrcode) return true;
    } catch {}
  }
  return false;
}

async function openScanner(targetId, setter, renderFn){
  window._scanTarget = { targetId, setter, renderFn };
  const ov = document.createElement("div");
  ov.id = "scanOverlay";
  ov.style.cssText = "position:fixed;inset:0;background:#000;z-index:600;display:flex;flex-direction:column";
  ov.innerHTML = `
    <div style="display:flex;justify-content:space-between;align-items:center;padding:14px;background:#0a0e1a">
      <button onclick="closeScanner()" style="background:#334155;color:#fff;border:none;border-radius:100px;padding:10px 18px;font-family:'Cairo';font-weight:900;font-size:14px;cursor:pointer">✕ إغلاق</button>
      <div style="color:#4ade80;font-family:'Cairo';font-weight:900;font-size:15px">📷 مسح الباركود</div>
      <button id="torchBtn" onclick="qrTorch()" style="background:#1a2236;color:#fbbf24;border:none;border-radius:100px;padding:10px 16px;font-family:'Cairo';font-weight:900;font-size:14px;cursor:pointer;display:none">🔦</button>
    </div>
    <div id="qrReader" style="flex:1;width:100%;overflow:hidden"></div>
    <div id="zoomBar" style="background:#0a0e1a;padding:12px 16px 18px;display:none">
      <div style="display:flex;align-items:center;gap:10px">
        <span style="color:#94a3b8;font-family:'Cairo';font-size:13px;font-weight:900">🔍</span>
        <input id="zoomRange" type="range" min="1" max="5" step="0.1" value="1" oninput="qrZoom(this.value)" style="flex:1;accent-color:#4ade80;height:26px" />
        <span id="zoomVal" style="color:#4ade80;font-family:'Cairo';font-size:13px;font-weight:900;min-width:32px;text-align:center">1x</span>
      </div>
    </div>
    <div id="scanMsg" style="text-align:center;color:#7cb3e8;font-family:'Cairo';font-size:13px;padding:0 0 14px;background:#0a0e1a">وجّه الكاميرا على الباركود</div>`;
  document.body.appendChild(ov);

  const ok = await loadQrLib();
  if (!ok || !window.Html5Qrcode){
    document.getElementById("scanMsg").textContent = "تعذّر تحميل القارئ — تحقق من الإنترنت";
    document.getElementById("scanMsg").style.color = "#f87171";
    return;
  }

  try {
    _html5Qr = new Html5Qrcode("qrReader", {
      formatsToSupport: [
        Html5QrcodeSupportedFormats.CODE_128,
        Html5QrcodeSupportedFormats.EAN_13,
        Html5QrcodeSupportedFormats.EAN_8,
        Html5QrcodeSupportedFormats.CODE_39,
        Html5QrcodeSupportedFormats.UPC_A,
        Html5QrcodeSupportedFormats.UPC_E,
        Html5QrcodeSupportedFormats.ITF,
        Html5QrcodeSupportedFormats.CODABAR,
        Html5QrcodeSupportedFormats.QR_CODE,
      ],
      verbose: false
    });
    const config = {
      fps: 12,
      qrbox: (w,h)=>{ const m=Math.min(w,h); return { width: Math.floor(m*0.82), height: Math.floor(m*0.5) }; },
      aspectRatio: 1.4,
      experimentalFeatures: { useBarCodeDetectorIfSupported: true }
    };
    await _html5Qr.start(
      { facingMode: "environment" },
      config,
      (decodedText)=>{ qrSuccess(decodedText); },
      ()=>{} // نتجاهل أخطاء كل فريم
    );
    // زوم + فلاش لو مدعوم
    setTimeout(setupZoomTorch, 800);
  } catch(e){
    document.getElementById("scanMsg").textContent = "تعذّر فتح الكاميرا — تأكد من الإذن";
    document.getElementById("scanMsg").style.color = "#f87171";
  }
}

function setupZoomTorch(){
  try {
    const caps = _html5Qr.getRunningTrackCapabilities();
    if (caps && caps.zoom){
      const zb=document.getElementById("zoomBar"), zr=document.getElementById("zoomRange");
      if (zb && zr){
        zb.style.display="block";
        zr.min=caps.zoom.min; zr.max=caps.zoom.max; zr.step=caps.zoom.step||0.1;
        const z=Math.min(2,caps.zoom.max); zr.value=z; qrZoom(z);
      }
    }
    if (caps && caps.torch){ const tb=document.getElementById("torchBtn"); if(tb) tb.style.display="block"; }
  } catch {}
}
function qrZoom(v){
  const val=parseFloat(v);
  const el=document.getElementById("zoomVal"); if(el) el.textContent=val.toFixed(1).replace(/\.0$/,"")+"x";
  try { _html5Qr.applyVideoConstraints({ advanced:[{zoom:val}] }); } catch {}
}
let _torchOn=false;
async function qrTorch(){
  _torchOn=!_torchOn;
  try { await _html5Qr.applyVideoConstraints({ advanced:[{torch:_torchOn}] });
    const tb=document.getElementById("torchBtn"); if(tb) tb.style.background=_torchOn?"rgba(251,191,36,0.3)":"#1a2236";
  } catch {}
}

function qrSuccess(code){
  if (!code) return;
  const t = window._scanTarget; if (!t) return;
  window._scanTarget = null; // نمنع الالتقاط المزدوج فوراً
  if (navigator.vibrate) navigator.vibrate(70);

  // 1) نحدّث البحث فوراً (قبل إيقاف الكاميرا — ما ننتظر أي promise)
  const el = document.getElementById(t.targetId);
  if (el) el.value = code;
  if (t.setter==="searchTerm"){ searchTerm = code; }
  else { setSearchVar(t.setter, code); }

  // 2) نوقف الكاميرا ونشيل الشاشة (مرة وحدة، آمن)
  const ov = document.getElementById("scanOverlay");
  const cleanup = ()=>{ if(ov) ov.remove(); _html5Qr=null; _torchOn=false; };
  const qr = _html5Qr; _html5Qr = null; // نفرّغ المرجع عشان ما ينستدعى مرتين
  if (qr){ try { qr.stop().then(cleanup).catch(cleanup); } catch { cleanup(); } }
  else cleanup();

  // 3) نعيد رسم النتائج + رسالة
  if (t.setter==="searchTerm"){ drawNeeds(document.getElementById("content")); }
  else { const fn=_renderMap[t.renderFn]; if(fn) fn(document.getElementById("content")); }
  showToast("🔍 بحث: "+code);
}

function closeScanner(){
  window._scanTarget = null;
  const ov = document.getElementById("scanOverlay");
  const done = ()=>{ if(ov) ov.remove(); _html5Qr=null; _torchOn=false; };
  const qr = _html5Qr; _html5Qr = null; // نفرّغ المرجع (يمنع استدعاء stop مرتين)
  if (qr){ try { qr.stop().then(done).catch(done); } catch { done(); } }
  else done();
}

async function init(){
  try {
    const [prods, pers, sett, imgs, trans, counts, whc] = await Promise.all([
      load("baro_products_v2"), load("baro_periods_v2"), load("baro_settings_v2"), load("baro_images_v2"), load("baro_transfers_v2"), load("baro_branch_counts_v2"), load("baro_wh_counts_v2")
    ]);
    PRODUCTS = prods ?? []; PERIODS = pers ?? []; SETTINGS = sett ?? {}; IMAGES = imgs ?? {}; TRANSFERS = trans ?? []; COUNTS = counts ?? {}; WH_COUNTS = whc ?? {};
    await loadRegions();
    DATA_LOADED = (prods !== null);
  } catch(e){
    document.getElementById("app").innerHTML = `<div class="empty">تعذّر الاتصال — حدّث الصفحة</div>`;
    return;
  }
  renderApp();
}
init();
</script>
