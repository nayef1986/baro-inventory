<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مدير المستودع — ALBAROO</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jsbarcode/3.11.6/JsBarcode.all.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap');
  *{font-family:'Cairo',sans-serif;box-sizing:border-box;margin:0;padding:0}
  body{background:#0a0e1a;color:#e8eef7;padding:14px;max-width:680px;margin:0 auto;padding-bottom:60px}
  h1{font-size:20px;color:#fff}
  .sub{font-size:11px;color:#5b9bd5;margin-bottom:12px}
  .gate{max-width:300px;margin:80px auto;text-align:center}
  .gate input{width:100%;background:#1a2236;border:1px solid #2d3a52;color:#fff;border-radius:12px;padding:14px;font-size:18px;text-align:center;font-family:'Cairo';letter-spacing:4px;margin:14px 0}
  .gate button{width:100%;background:#2563eb;color:#fff;border:none;border-radius:12px;padding:14px;font-size:16px;font-weight:900;font-family:'Cairo';cursor:pointer}
  .loading{text-align:center;padding:60px;color:#5b9bd5}
  .spin{font-size:32px;animation:s 1s linear infinite;display:inline-block}@keyframes s{to{transform:rotate(360deg)}}
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
  .stat{background:#141b2d;border:1px solid #1f2940;border-radius:12px;padding:10px;text-align:center}
  .stat .v{font-size:22px;font-weight:900}.stat .l{font-size:10px;color:#5b6b85;margin-top:3px;line-height:1.3}
  .tabs{display:flex;gap:6px;margin-bottom:12px}
  .tabs button{flex:1;padding:9px;border-radius:10px;border:1px solid #2d3a52;background:#141b2d;color:#5b6b85;font-family:'Cairo';font-weight:700;font-size:13px;cursor:pointer}
  .tabs button.on{background:#2563eb;color:#fff;border-color:#2563eb}
  /* كونتينر */
  .cont{background:#10172a;border:1px solid #1f2940;border-radius:14px;margin-bottom:10px;overflow:hidden}
  .conth{display:flex;align-items:center;justify-content:space-between;padding:13px;cursor:pointer}
  .conth .nm{font-weight:900;font-size:15px;color:#fff}
  .conth .badge{background:#2563eb;color:#fff;font-size:12px;font-weight:900;padding:3px 11px;border-radius:100px}
  .contbody{padding:0 10px 10px}
  /* منتج */
  .prod{background:#141b2d;border:1px solid #1f2940;border-radius:12px;margin-bottom:8px;overflow:hidden}
  .prodh{display:flex;gap:10px;align-items:center;padding:11px;cursor:pointer}
  .prodh img{width:60px;height:60px;border-radius:10px;object-fit:cover;border:1px solid #2d3a52;background:#fff}
  .prodh .noimg{width:60px;height:60px;border-radius:10px;background:#1f2940;display:flex;align-items:center;justify-content:center;font-size:26px}
  .prodh .info{flex:1;min-width:0}
  .prodh .pnm{font-weight:900;font-size:14px;color:#fff;line-height:1.3}
  .prodh .pbc{font-family:monospace;font-size:15px;font-weight:900;color:#94a3b8;margin-top:3px;letter-spacing:1px}
  .prodh .arrow{font-size:14px;color:#5b6b85}
  .pstats{display:flex;gap:5px;margin-top:6px}
  .pstats span{flex:1;text-align:center;padding:4px 2px;border-radius:7px;font-size:9px}
  .pstats b{display:block;font-size:16px;font-weight:900;margin-bottom:1px}
  .ps-buy{background:rgba(91,155,213,0.12)}.ps-buy b{color:#7cb3e8}
  .ps-sold{background:rgba(245,158,11,0.12)}.ps-sold b{color:#fbbf24}
  .ps-left{background:rgba(34,197,94,0.12)}.ps-left b{color:#4ade80}
  /* جسم المنتج (الفروع) */
  .prodbody{padding:0 11px 11px;border-top:1px solid #1f2940}
  .saverow{display:flex;gap:8px;margin:10px 0}
  .saverow button{flex:1;border:none;border-radius:9px;padding:11px;font-size:13px;font-weight:900;font-family:'Cairo';cursor:pointer}
  .save{background:#16a34a;color:#fff}.slip{background:#7c3aed;color:#fff}
  .recent{background:rgba(239,68,68,0.12);border:1px solid rgba(239,68,68,0.3);border-radius:8px;padding:7px 10px;font-size:11px;color:#fca5a5;margin:8px 0}
  .br{display:flex;align-items:center;gap:8px;background:#0f1626;border-radius:9px;padding:9px 10px;margin-bottom:6px;transition:opacity .2s}
  .br.excluded{opacity:0.35}
  .br .chk{font-size:20px;cursor:pointer;width:26px;text-align:center}
  .br .bn{flex:1}
  .br .bname{font-size:13px;font-weight:700;color:#e8eef7}
  .br .q3{display:flex;gap:5px;margin-top:4px}
  .br .q3 span{padding:4px 8px;border-radius:7px;font-size:9px;text-align:center;line-height:1.2}
  .br .q3 b{display:block;font-size:17px;font-weight:900;margin-bottom:1px}
  .s-sold{background:rgba(245,158,11,0.15);color:#fbbf24}
  .s-given{background:rgba(91,155,213,0.15);color:#7cb3e8}
  .s-left{background:rgba(34,197,94,0.18);color:#4ade80}
  .br .qty{width:48px;background:#1a2236;border:1px solid #2d3a52;color:#fff;border-radius:7px;padding:6px;font-size:16px;font-weight:900;text-align:center;font-family:'Cairo'}
  .empty{text-align:center;padding:50px;color:#5b6b85}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#16a34a;color:#fff;padding:12px 24px;border-radius:100px;font-weight:900;z-index:99;opacity:0;transition:opacity 0.3s}
  .toast.show{opacity:1}
  .log{background:#141b2d;border:1px solid #1f2940;border-radius:12px;margin-bottom:8px;overflow:hidden}
  .logh{display:flex;gap:10px;align-items:center;padding:11px;cursor:pointer}
  .logh img{width:48px;height:48px;border-radius:9px;object-fit:cover;background:#fff}
  .logh .noimg{width:48px;height:48px;border-radius:9px;background:#1f2940;display:flex;align-items:center;justify-content:center;font-size:22px}
  .logh .info{flex:1;min-width:0}
  .logh .lnm{font-weight:900;font-size:13px;color:#fff}
  .logh .lqt{font-size:11px;color:#4ade80;margin-top:2px}
  .logbody{padding:0 11px 11px;border-top:1px solid #1f2940}
  .logbr{display:flex;justify-content:space-between;align-items:center;background:#0f1626;border-radius:8px;padding:8px 10px;margin-top:6px;font-size:12px}
  .logbr .ldt{color:#5b6b85;font-size:10px}
  .logbr button{background:rgba(239,68,68,0.15);color:#fca5a5;border:none;border-radius:7px;padding:4px 12px;font-size:11px;font-weight:700;font-family:'Cairo';cursor:pointer}
  @media print {
    body > #app, body > .toast { display: none !important; }
    #printOverlay { position: static !important; overflow: visible !important; background:#fff !important; }
    #printOverlay .tb { display: none !important; }
  }
</style>
</head>
<body>
<div id="app"><div class="loading"><span class="spin">⏳</span></div></div>
<div class="toast" id="toast"></div>

<script>
const SUPABASE_URL = "https://tvxxprynqeufzlgleurm.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InR2eHhwcnlucWV1ZnpsZ2xldXJtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkwNjk4NTAsImV4cCI6MjA5NDY0NTg1MH0.FfHtUehBX0yjZsuMiE8Z8UP7bE1Ii_RFB5FKT4EJuXk";
const TABLE = "baro_store";
const MIN = 12, RECENT_DAYS = 7;
const FIXED_QTY = 12; // كمية الاعتماد دائماً 12
const toDozen = n => Math.ceil(n/MIN)*MIN;
const num = v => { const n = parseFloat(v); return isNaN(n)?0:n; };
const fmtN = n => Math.round(num(n)).toLocaleString("en-US");

let PRODUCTS = [], PERIODS = [], SETTINGS = {}, IMAGES = {}, TRANSFERS = [];
let SALES_MAP = null;
let currentNeeds = [];
let activeTab = "needs";
let openCont = null, openProd = null, openLog = null;
let selectedCont = null; // الكونتينر المفتوح (شاشة مستقلة)
let excluded = {}; // {barcode_branch: true} = مستثنى
let approvedNow = {}; // {barcode: count} = اعتُمد بهذه الجلسة
let qtyEdit = {};  // {barcode_branch: qty} كمية معدّلة
let viewImg = null; // الصورة المكبّرة

async function load(key) {
  const r = await fetch(`${SUPABASE_URL}/rest/v1/${TABLE}?key=eq.${key}&select=value`,
    { headers:{ apikey:SUPABASE_KEY, Authorization:`Bearer ${SUPABASE_KEY}` } });
  const j = await r.json();
  const raw = j?.[0]?.value;
  if (raw == null) return null;
  if (typeof raw === "string") { try { return JSON.parse(raw); } catch { return null; } }
  return raw;
}
async function save(key, value) {
  await fetch(`${SUPABASE_URL}/rest/v1/${TABLE}`, {
    method:"POST",
    headers:{ apikey:SUPABASE_KEY, Authorization:`Bearer ${SUPABASE_KEY}`, "Content-Type":"application/json", Prefer:"resolution=merge-duplicates" },
    body: JSON.stringify({ key, value: JSON.stringify(value), updated_at: new Date().toISOString() })
  });
}

function getFactoryCode(bc){ const m=String(bc).match(/^(\d+)B/); return m?m[1]:""; }
function totalPurchases(p){ return (p.purchases??[]).reduce((s,x)=>s+num(x.qty),0); }
// تاريخ آخر توريد (آخر عملية شراء)
function lastSupplyDate(p){
  const ps = p.purchases ?? [];
  if (ps.length === 0) return "";
  const last = ps[ps.length-1];
  const d = last.date || last.invoiceDate || last.day;
  if (!d) return "";
  const dt = new Date(d);
  if (isNaN(dt)) return String(d);
  return (dt.getDate()+"").padStart(2,"0")+"/"+(dt.getMonth()+1+"").padStart(2,"0")+"/"+dt.getFullYear();
}
function showToast(msg){ const t=document.getElementById("toast"); t.textContent=msg; t.classList.add("show"); setTimeout(()=>t.classList.remove("show"),2000); }

function recentTransfer(bc, branch){
  const now = Date.now();
  return TRANSFERS.filter(t=>t.barcode===bc && t.to===branch && (now-t.date) < RECENT_DAYS*86400000)
    .reduce((s,t)=>s+num(t.qty),0);
}

function buildSalesMap(){
  const closed = SETTINGS?.closedBranches ?? [];
  const map = {};
  PERIODS.forEach(per=>{
    Object.entries(per.sales??{}).forEach(([branch,d])=>{
      if (closed.includes(branch)) return;
      Object.entries(d).forEach(([bc,v])=>{
        const q = num(v?.qty??0);
        if (q<=0) return;
        if (!map[bc]) map[bc] = {};
        map[bc][branch] = (map[bc][branch]??0) + q;
      });
    });
  });
  return map;
}

// النواقص مقسّمة بالكونتينر
function computeNeeds(){
  if (!SALES_MAP) SALES_MAP = buildSalesMap();
  const needs = [];
  PRODUCTS.forEach(p=>{
    const bought = totalPurchases(p);
    const branchSales = SALES_MAP[p.barcode];
    if (!branchSales) return;
    const totalSold = Object.values(branchSales).reduce((s,q)=>s+q,0);
    const closing = Math.max(0, bought-totalSold);
    if (closing <= 0) return;
    const branches = Object.entries(branchSales).map(([branch,bsold])=>{
      const given = toDozen(bsold);
      const recent = recentTransfer(p.barcode, branch);
      const remaining = given - bsold + recent;
      return { branch, sold:bsold, given, remaining, recent };
    }).filter(b=> b.remaining < 7).sort((a,b)=>a.remaining-b.remaining);
    if (branches.length === 0) return;
    needs.push({ p, bought, totalSold, closing, branches });
  });
  return needs;
}

// تجميع بالكونتينر
function groupByContainer(needs){
  const g = {};
  needs.forEach(n=>{
    const cont = n.p.container || "بدون كونتينر";
    if (!g[cont]) g[cont] = [];
    g[cont].push(n);
  });
  return g;
}

// ─── حفظ توزيع منتج (كل الفروع عدا المستثناة) ────────────────
async function saveProduct(bc){
  const n = currentNeeds.find(x=>x.p.barcode===bc);
  if (!n) return;
  const added = [];
  n.branches.forEach(b=>{
    const key = bc+"_"+b.branch;
    if (excluded[key]) return;
    const qty = num(qtyEdit[key] ?? FIXED_QTY);
    TRANSFERS.push({ barcode:bc, name:n.p.name, from:"المستودع", to:b.branch, qty, sold:b.sold, given:b.given, remaining:b.remaining, date:Date.now(), printed:false });
    added.push(b.branch);
  });
  if (added.length === 0){ showToast("ما فيه فروع معتمدة"); return; }
  await save("baro_transfers_v2", TRANSFERS);
  showToast(`✓ اعتُمد ${added.length} فرع — في تبويب الطباعة`);
  SALES_MAP = null;
  // نعلّم المنتج "معتمد" بدون إعادة حساب أو إعادة رسم كامل (نحافظ على المكان تماماً)
  approvedNow[bc] = added.length;
  const card = document.getElementById("prod_"+bc);
  if (card){
    const btn = card.querySelector(".save");
    if (btn){ btn.textContent = "✓ تم الاعتماد ("+added.length+" فرع)"; btn.style.background = "#334155"; btn.disabled = true; }
  }
}

async function cancelTransferByDate(date, name){
  if (!confirm(`إلغاء توزيع "${name}"؟\nالكمية سترجع.`)) return;
  TRANSFERS = TRANSFERS.filter(t=>t.date !== date);
  await save("baro_transfers_v2", TRANSFERS);
  SALES_MAP = null;
  showToast("أُلغيت — رجعت الكمية");
  renderContent();
}

// حذف كل توزيعات منتج
async function deleteProduct(bc, name){
  if (!confirm(`حذف كل توزيعات "${name}"؟\nكل الكميات سترجع.`)) return;
  TRANSFERS = TRANSFERS.filter(t=>t.barcode !== bc);
  await save("baro_transfers_v2", TRANSFERS);
  SALES_MAP = null;
  openLog = null;
  showToast("حُذف المنتج — رجعت الكميات");
  renderContent();
}

function toggleExclude(bc, branch){
  const key = bc+"_"+branch;
  excluded[key] = !excluded[key];
  const el = document.getElementById("br_"+key);
  if (el){ el.classList.toggle("excluded", excluded[key]); document.getElementById("chk_"+key).textContent = excluded[key]?"☐":"✅"; }
}

function setQty(bc, branch, val){ /* الكمية ثابتة 12، لكن نسمح بالتعديل لو احتاج */ }

// ─── الواجهة ─────────────────────────────────────────────────
function renderStats(){
  const el = document.getElementById("stats");
  if (!el) return;
  const now = Date.now();
  const today = TRANSFERS.filter(t=>(now-t.date)<86400000);
  const week = TRANSFERS.filter(t=>(now-t.date)<RECENT_DAYS*86400000);
  // عدد المنتجات (الأصناف) المختلفة
  const todayItems = new Set(today.map(t=>t.barcode)).size;
  const weekItems = new Set(week.map(t=>t.barcode)).size;
  el.innerHTML = `
    <div class="stat"><div class="v" style="color:#7cb3e8">${currentNeeds.length}</div><div class="l">صنف يحتاج توزيع</div></div>
    <div class="stat"><div class="v" style="color:#4ade80">${todayItems}</div><div class="l">صنف معتمد اليوم</div></div>
    <div class="stat"><div class="v" style="color:#fbbf24">${weekItems}</div><div class="l">صنف موزّع الأسبوع</div></div>`;
}

function renderApp(){
  const unprinted = TRANSFERS.filter(t=>!t.printed).length;
  document.getElementById("app").innerHTML = `
    <h1>🏬 مدير المستودع</h1>
    <div class="sub">توزيع النواقص · ALBAROO</div>
    <div class="tabs">
      <button class="${activeTab==='needs'?'on':''}" onclick="setTab('needs')">📦 النواقص</button>
      <button class="${activeTab==='print'?'on':''}" onclick="setTab('print')">🖨️ للطباعة${unprinted>0?` (${unprinted})`:''}</button>
      <button class="${activeTab==='log'?'on':''}" onclick="setTab('log')">📋 السجل</button>
    </div>
    <div id="stats" class="stats"></div>
    ${activeTab==='needs' && !selectedCont?`<input id="searchBox" placeholder="🔍 بحث بالباركود أو الاسم…" oninput="onSearch(this.value)" value="${searchTerm}" style="width:100%;background:#1a2236;border:1px solid #2d3a52;color:#fff;border-radius:12px;padding:11px 14px;font-size:14px;font-family:'Cairo';margin-bottom:12px" />`:''}
    <div id="content"></div>`;
  renderStats();
  renderContent();
}
let searchTerm = "";
function onSearch(v){ searchTerm = v; drawNeeds(document.getElementById("content")); }
function setTab(t){ activeTab=t; openCont=null; openProd=null; openLog=null; selectedCont=null; searchTerm=""; renderApp(); }

function renderContent(){
  const c = document.getElementById("content");
  if (activeTab === "log"){ renderLog(c); return; }
  if (activeTab === "print"){ renderPrintQueue(c); return; }
  // النواقص
  if (currentNeeds.length === 0 && !SALES_MAP){
    c.innerHTML = `<div class="loading"><span class="spin">⏳</span><div style="margin-top:10px;font-size:13px">جاري حساب النواقص…</div></div>`;
    setTimeout(()=>{ currentNeeds = computeNeeds(); renderStats(); routeNeeds(c); }, 50);
  } else {
    if (!SALES_MAP || currentNeeds.length===0) currentNeeds = computeNeeds();
    renderStats(); routeNeeds(c);
  }
}

function routeNeeds(c){
  if (selectedCont) drawContPage(c); else drawNeeds(c);
}

// قائمة الكونتينرات (شبكة)
function drawNeeds(c){
  if (currentNeeds.length === 0){ c.innerHTML = `<div class="empty">✅ لا نواقص حالياً</div>`; return; }
  let filtered = currentNeeds;
  const q = (searchTerm||"").trim().toLowerCase();
  if (q) filtered = currentNeeds.filter(n => n.p.barcode.toLowerCase().includes(q) || (n.p.name||"").toLowerCase().includes(q));
  if (filtered.length === 0){ c.innerHTML = `<div class="empty">لا نتائج لـ "${searchTerm}"</div>`; return; }
  const groups = groupByContainer(filtered);
  const contNames = Object.keys(groups).sort();
  // لو بحث، نعرض المنتجات مباشرة (كل الكونتينرات)
  if (q){
    c.innerHTML = contNames.map(cont=>`<div class="cont"><div class="conth"><div class="nm">📦 ${cont}</div><span class="badge">${groups[cont].length}</span></div><div class="contbody">${groups[cont].map(n=>renderProd(n)).join("")}</div></div>`).join("");
    return;
  }
  // شبكة الكونتينرات
  c.innerHTML = contNames.map(cont=>{
    const list = groups[cont];
    return `<div class="cont"><div class="conth" onclick="enterCont('${cont.replace(/'/g,'')}')">
      <div class="nm">📦 ${cont}</div>
      <div style="display:flex;align-items:center;gap:8px"><span class="badge">${list.length} صنف</span><span style="color:#5b6b85">←</span></div>
    </div></div>`;
  }).join("");
}

// داخل كونتينر (شاشة مستقلة)
function drawContPage(c){
  const groups = groupByContainer(currentNeeds);
  const list = groups[selectedCont] || [];
  c.innerHTML = `
    <button onclick="exitCont()" style="background:#1f2940;color:#7cb3e8;border:none;border-radius:10px;padding:10px 16px;font-family:'Cairo';font-weight:700;font-size:14px;cursor:pointer;margin-bottom:12px">← كل الكونتينرات</button>
    <div style="font-weight:900;font-size:17px;color:#fff;margin-bottom:4px">📦 ${selectedCont}</div>
    <div style="font-size:12px;color:#5b6b85;margin-bottom:12px">${list.length} صنف يحتاج توزيع</div>
    ${list.map(n=>renderProd(n)).join("")}`;
}

function enterCont(cont){ selectedCont = cont; openProd = null; renderApp(); }
function exitCont(){ selectedCont = null; openProd = null; renderApp(); }

function renderProd(n){
  const bc = n.p.barcode;
  const img = IMAGES?.[bc];
  const isOpen = openProd === bc;
  const safeBc = bc.replace(/'/g,'');
  const safeName = (n.p.name||'').replace(/'/g,'');
  let body = "";
  if (isOpen){
    const brs = n.branches.map(b=>{
      const key = bc+"_"+b.branch;
      const ex = excluded[key];
      const qv = qtyEdit[key] ?? FIXED_QTY;
      const recentWarn = b.recent>0 ? `<div class="recent">⚠️ نُقل ${fmtN(b.recent)} قطعة خلال أسبوع — تأكد</div>` : "";
      return `${recentWarn}<div class="br${ex?' excluded':''}" id="br_${key}">
        <span class="chk" id="chk_${key}" onclick="toggleExclude('${safeBc}','${b.branch.replace(/'/g,'')}')">${ex?'☐':'✅'}</span>
        <div class="bn">
          <div class="bname">🏪 ${b.branch}</div>
          <div class="q3">
            <span class="s-sold"><b>${fmtN(b.sold)}</b>باع</span>
            <span class="s-given"><b>${fmtN(b.given)}</b>أخذ</span>
            <span class="s-left"><b>${fmtN(b.remaining)}</b>باقي</span>
          </div>
        </div>
        <input class="qty" type="number" value="${qv}" onchange="qtyEdit['${key}']=this.value" />
      </div>`;
    }).join("");
    const ap = approvedNow[bc];
    const saveBtn = ap
      ? `<button class="save" style="background:#334155" disabled>✓ تم الاعتماد (${ap} فرع)</button>`
      : `<button class="save" onclick="saveProduct('${safeBc}')">✅ اعتمد التوزيع (${n.branches.length} فرع)</button>`;
    body = `<div class="prodbody">
      ${brs}
      <div class="saverow">
        ${saveBtn}
        <button class="slip" onclick="printSlip('${safeBc}')">🖨️ بوليصة</button>
      </div>
    </div>`;
  }
  return `<div class="prod" id="prod_${bc}">
    <div class="prodh">
      ${img?`<img src="${img}" onclick="event.stopPropagation();openImg('${img.replace(/'/g,"\\\\'")}','${safeName}')"/>`:`<div class="noimg" onclick="toggleProd('${safeBc}')">📦</div>`}
      <div class="info" onclick="toggleProd('${safeBc}')">

        <div class="pbc">${bc}</div>
        <div class="pstats">
          <span class="ps-buy"><b>${fmtN(n.bought)}</b>مشترى</span>
          <span class="ps-sold"><b>${fmtN(n.totalSold)}</b>اتباع</span>
          <span class="ps-left"><b>${fmtN(n.closing)}</b>باقي</span>
        </div>
      </div>
      <span class="arrow" onclick="toggleProd('${safeBc}')">${isOpen?'▲':'▼'}</span>
    </div>
    ${body}
  </div>`;
}

function toggleCont(cont){ openCont = (openCont===cont)?null:cont; openProd=null; renderContent(); }
function toggleProd(bc){
  const y = window.scrollY;
  openProd = (openProd===bc)?null:bc;
  routeNeeds(document.getElementById("content"));
  requestAnimationFrame(()=>window.scrollTo(0,y));
}

// عارض الصورة (تكبير + حفظ)
function openImg(src, name){
  const ov = document.createElement("div");
  ov.style.cssText = "position:fixed;inset:0;background:rgba(0,0,0,0.92);z-index:300;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px";
  ov.onclick = ()=>ov.remove();
  ov.innerHTML = `
    <img src="${src}" style="max-width:100%;max-height:70vh;border-radius:14px;object-fit:contain" onclick="event.stopPropagation()" />
    <div style="color:#fff;font-weight:700;margin-top:12px;text-align:center">${name||''}</div>
    <div style="display:flex;gap:10px;margin-top:16px" onclick="event.stopPropagation()">
      <button id="saveImgBtn" style="padding:12px 24px;border-radius:100px;border:none;background:linear-gradient(135deg,#22c55e,#16a34a);color:#fff;font-size:14px;font-weight:900;font-family:'Cairo';cursor:pointer">💾 حفظ الصورة</button>
      <button onclick="this.closest('div').parentElement.remove()" style="padding:12px 24px;border-radius:100px;border:1px solid rgba(255,255,255,0.2);background:rgba(255,255,255,0.1);color:#fff;font-size:14px;font-weight:700;font-family:'Cairo';cursor:pointer">إغلاق</button>
    </div>`;
  document.body.appendChild(ov);
  ov.querySelector("#saveImgBtn").onclick = async ()=>{
    try {
      const res = await fetch(src); const blob = await res.blob();
      const fn = (name||"image").replace(/[^\w\u0600-\u06FF]/g,"_")+".jpg";
      if (navigator.canShare){
        const file = new File([blob], fn, {type:blob.type});
        if (navigator.canShare({files:[file]})){ await navigator.share({files:[file]}); return; }
      }
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a"); a.href=url; a.download=fn; a.click();
      setTimeout(()=>URL.revokeObjectURL(url),1000);
    } catch { alert("اضغط مطوّل على الصورة لحفظها"); }
  };
}

function renderLog(c){
  // السجل = المطبوع (المُرحّل) فقط
  const byProd = {};
  TRANSFERS.filter(t=>t.printed).forEach(t=>{
    if (!byProd[t.barcode]) byProd[t.barcode] = { name:t.name, barcode:t.barcode, items:[] };
    byProd[t.barcode].items.push(t);
  });
  const list = Object.values(byProd).sort((a,b)=>{
    const la = Math.max(...a.items.map(x=>x.date)), lb = Math.max(...b.items.map(x=>x.date));
    return lb-la;
  });
  if (list.length === 0){ c.innerHTML = `<div class="empty">لا توزيعات بعد</div>`; return; }
  c.innerHTML = list.map(pr=>{
    const img = IMAGES?.[pr.barcode];
    const isOpen = openLog === pr.barcode;
    const totalQty = pr.items.reduce((s,t)=>s+num(t.qty),0);
    let body = "";
    if (isOpen){
      const sorted = [...pr.items].sort((a,b)=>b.date-a.date);
      body = `<div class="logbody">${sorted.map(t=>{
        const d = new Date(t.date);
        const ds = (d.getDate()+"").padStart(2,"0")+"/"+(d.getMonth()+1+"").padStart(2,"0")+"/"+d.getFullYear()+" "+(d.getHours()+"").padStart(2,"0")+":"+(d.getMinutes()+"").padStart(2,"0");
        const isRecent = (Date.now()-t.date) < RECENT_DAYS*86400000;
        return `<div class="logbr">
          <div><b style="color:#7cb3e8">🏪 ${t.to}</b> · ${fmtN(t.qty)} قطعة ${isRecent?'<span style="color:#fbbf24;font-size:10px">·نشط</span>':'<span style="color:#5b6b85;font-size:10px">·منتهي</span>'}<div class="ldt">${ds}</div></div>
          <button onclick="cancelTransferByDate(${t.date},'${(t.name||'').replace(/'/g,'')}')">🗑️</button>
        </div>`;
      }).join("")}</div>`;
    }
    return `<div class="log">
      <div class="logh" onclick="toggleLog('${pr.barcode.replace(/'/g,'')}')">
        ${img?`<img src="${img}"/>`:`<div class="noimg">📦</div>`}
        <div class="info"><div class="lnm">${pr.name}</div><div class="lqt">${pr.items.length} فرع · ${fmtN(totalQty)} قطعة</div></div>
        <button onclick="event.stopPropagation();deleteProduct('${pr.barcode.replace(/'/g,'')}','${(pr.name||'').replace(/'/g,'')}')" style="background:rgba(239,68,68,0.2);color:#fca5a5;border:none;border-radius:8px;padding:6px 10px;font-size:11px;font-weight:700;font-family:'Cairo';cursor:pointer">🗑️ حذف الكل</button>
        <span style="color:#5b6b85;margin-right:4px">${isOpen?'▲':'▼'}</span>
      </div>
      ${body}
    </div>`;
  }).join("");
}
function toggleLog(bc){ openLog = (openLog===bc)?null:bc; renderContent(); }

// ─── تبويب جاهز للطباعة ──────────────────────────────────────

  // تجميع بالمنتج

  const list = Object.values(byProd);

        <div class="info"><div class="lnm">${pr.name}</div><div class="lqt">${pr.items.length} فرع · ${fmtN(q)} قطعة</div></div>
        <button onclick="deleteProduct('${pr.barcode.replace(/'/g,'')}','${(pr.name||'').replace(/'/g,'')}')" style="background:rgba(239,68,68,0.2);color:#fca5a5;border:none;border-radius:8px;padding:6px 10px;font-size:11px;font-weight:700;font-family:'Cairo';cursor:pointer">🗑️</button>

}

// يبني محتوى بوليصة واحدة (نفس تصميم النواقص) — يُستخدم في الإفرادي والمجمّع

        <span>📅 <b>${info.lastSupply || info.ds}</b></span>

// طباعة كل المعتمد غير المطبوع — نفس تصميم النواقص بالضبط
function printAll(){
  const unprinted = TRANSFERS.filter(t=>!t.printed);
  if (unprinted.length === 0) return;
  if (!SALES_MAP) SALES_MAP = buildSalesMap();
  const d = new Date();
  const ds = (d.getDate()+"").padStart(2,"0")+"/"+(d.getMonth()+1+"").padStart(2,"0")+"/"+d.getFullYear();
  const byProd = {};
  unprinted.forEach(t=>{ if(!byProd[t.barcode]) byProd[t.barcode]=[]; byProd[t.barcode].push(t); });

  const slips = Object.entries(byProd).map(([bc, items])=>{
    const prod = PRODUCTS.find(p=>p.barcode===bc);
    const bought = prod ? totalPurchases(prod) : 0;
    const salesByBranch = SALES_MAP?.[bc] ?? {};
    const totalSold = Object.values(salesByBranch).reduce((s,q)=>s+q,0);
    const closing = Math.max(0, bought-totalSold);
    const rows = items.filter(t=>t.to && String(t.to).trim()).map((t,i)=>{
      const sold = num(t.sold ?? salesByBranch[t.to] ?? 0);
      const given = num(t.given ?? toDozen(sold));
      const remaining = num(t.remaining ?? (given - sold));
      return `<tr><td class="rn">${i+1}</td><td class="brn">${t.to}</td><td class="num">${fmtN(sold)}</td><td class="num">${fmtN(given)}</td><td class="rem">${fmtN(remaining)}</td><td class="send">${fmtN(t.qty)}</td></tr>`;
    }).join("");
    const info = { name: items[0].name, enName: prod?.nameEn ?? prod?.englishName ?? "", container: prod?.container ?? "", ds, lastSupply: prod?lastSupplyDate(prod):"", closing, bought, totalSold, needyCount: items.length };
    return buildSlipBody(bc, rows, info);
  }).join("");

  const count = Object.keys(byProd).length;
  // نعرض overlay داخل الصفحة (مو نافذة — عشان الإغلاق يشتغل أكيد)
  const ov = document.createElement("div");
  ov.id = "printOverlay";
  ov.style.cssText = "position:fixed;inset:0;background:#ddd;z-index:500;overflow:auto;-webkit-overflow-scrolling:touch";
  ov.innerHTML = `
    <style>${slipCSS()}</style>
    <div class="tb" style="position:sticky">
      <button class="bk" onclick="closePrintOverlay()">✕ إغلاق</button>
      <button class="pr" onclick="doPrintOverlay('بوليصات_${ds.replace(/\//g,'-')}')">🖨️ طباعة (${count})</button>
    </div>
    <div class="wrap" id="printSlips">${slips}</div>`;
  document.body.appendChild(ov);
  document.body.style.overflow = "hidden";
  // نرسم الباركودات
  ov.querySelectorAll('svg.bcsvg').forEach(function(el){ try{ JsBarcode(el, el.getAttribute('data-code'), {format:"CODE128",width:2,height:60,displayValue:false,margin:2}); }catch(e){} });
}

function doPrintOverlay(titleName){
  const old = document.title;
  if (titleName) document.title = titleName;
  window.print();
  setTimeout(()=>{ document.title = old; }, 1000);
}

function closePrintOverlay(){
  const ov = document.getElementById("printOverlay");
  if (ov) ov.remove();
  document.body.style.overflow = "";
  // نسأل الترحيل
  if (confirm("هل طبعت البوليصات؟ أرحّلها لسجل التوزيع؟")){
    TRANSFERS.forEach(t=>{ if(!t.printed) t.printed = true; });
    save("baro_transfers_v2", TRANSFERS).then(()=>{ showToast("رُحّلت للسجل ✓"); renderApp(); });
  }
}


function printSlip(bc){
  const n = currentNeeds.find(x=>x.p.barcode===bc);
  if (!n) return;
  if (!SALES_MAP) SALES_MAP = buildSalesMap();
  const d = new Date();
  const ds = (d.getDate()+"").padStart(2,"0")+"/"+(d.getMonth()+1+"").padStart(2,"0")+"/"+d.getFullYear();
  const active = n.branches.filter(b=> b.branch && String(b.branch).trim() && !excluded[bc+"_"+b.branch]);
  const rows = active.map((b,i)=>{
    const qv = qtyEdit[bc+"_"+b.branch] ?? FIXED_QTY;
    return `<tr><td class="rn">${i+1}</td><td class="brn">${b.branch}</td><td class="num">${fmtN(b.sold)}</td><td class="num">${fmtN(b.given)}</td><td class="rem">${fmtN(b.remaining)}</td><td class="send">${fmtN(qv)}</td></tr>`;
  }).join("");
  const info = { name:n.p.name, enName:n.p.nameEn ?? n.p.englishName ?? "", container:n.p.container ?? "", ds, lastSupply:lastSupplyDate(n.p), closing:n.closing, bought:n.bought, totalSold:n.totalSold, needyCount:active.length };
  const slips = buildSlipBody(bc, rows, info);
  const ov = document.createElement("div");
  ov.id = "printOverlay";
  ov.style.cssText = "position:fixed;inset:0;background:#ddd;z-index:500;overflow:auto;-webkit-overflow-scrolling:touch";
  ov.innerHTML = `
    <style>${slipCSS()}</style>
    <div class="tb" style="position:sticky">
      <button class="bk" onclick="closePrintSingle()">✕ إغلاق</button>
      <button class="pr" onclick="doPrintOverlay('${bc}_${ds.replace(/\//g,'-')}')">🖨️ طباعة</button>
      <button class="im" onclick="saveSlipImage('${bc}')">🖼️ حفظ صورة</button>
    </div>
    <div class="wrap">${slips}</div>`;
  document.body.appendChild(ov);
  document.body.style.overflow = "hidden";
  ov.querySelectorAll('svg.bcsvg').forEach(function(el){ try{ JsBarcode(el, el.getAttribute('data-code'), {format:"CODE128",width:2,height:60,displayValue:false,margin:2}); }catch(e){} });
}

function closePrintSingle(){
  const ov = document.getElementById("printOverlay");
  if (ov) ov.remove();
  document.body.style.overflow = "";
}

async function saveSlipImage(bc){
  showToast("جاري إنشاء الصورة…");
  try {
    if (!window.html2canvas){
      await new Promise((res,rej)=>{ const s=document.createElement("script"); s.src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"; s.onload=res; s.onerror=rej; document.head.appendChild(s); });
    }
    const slip = document.querySelector("#printOverlay .slip");
    if (!slip) return;
    const canvas = await window.html2canvas(slip, { scale:2, backgroundColor:"#fff", useCORS:true });
    canvas.toBlob(async (blob)=>{
      const dd = new Date();
      const dstr = (dd.getDate()+"").padStart(2,"0")+"-"+(dd.getMonth()+1+"").padStart(2,"0")+"-"+dd.getFullYear();
      const fn = bc+"_"+dstr+".png";
      if (navigator.canShare){
        const file = new File([blob], fn, {type:"image/png"});
        if (navigator.canShare({files:[file]})){ await navigator.share({files:[file]}); return; }
      }
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a"); a.href=url; a.download=fn; a.click();
      setTimeout(()=>URL.revokeObjectURL(url),1000);
    }, "image/png");
  } catch(e){ alert("تعذّر حفظ الصورة — استخدم الطباعة بدلاً"); }
}

// ─── البوابة ─────────────────────────────────────────────────
async function init(){
  try {
    const [prods, pers, sett, imgs, trans] = await Promise.all([
      load("baro_products_v2"), load("baro_periods_v2"), load("baro_settings_v2"), load("baro_images_v2"), load("baro_transfers_v2")
    ]);
    PRODUCTS = prods ?? []; PERIODS = pers ?? []; SETTINGS = sett ?? {}; IMAGES = imgs ?? {}; TRANSFERS = trans ?? [];
  } catch(e){
    document.getElementById("app").innerHTML = `<div class="empty">تعذّر الاتصال — حدّث الصفحة</div>`;
    return;
  }
  const pin = SETTINGS?.warehousePin ?? "1234";
  document.getElementById("app").innerHTML = `
    <div class="gate">
      <h1>🏬 مدير المستودع</h1>
      <div class="sub" style="margin-top:6px">أدخل الرقم السري</div>
      <input type="password" id="pin" inputmode="numeric" placeholder="••••" />
      <button onclick="checkPin('${pin}')">دخول</button>
    </div>`;
  document.getElementById("pin").addEventListener("keydown",e=>{ if(e.key==="Enter") checkPin(pin); });
}
function checkPin(correct){
  const v = document.getElementById("pin").value;
  if (v === String(correct)){ renderApp(); } else { showToast("رقم خاطئ"); }
}
init();
