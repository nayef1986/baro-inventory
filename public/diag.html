<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>تشخيص البارو</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap');
  *{box-sizing:border-box;margin:0;padding:0;font-family:'Cairo',sans-serif}
  body{background:#0a0e1a;color:#e2e8f0;direction:rtl;padding:14px;max-width:600px;margin:0 auto}
  h1{font-size:20px;font-weight:900;color:#fff;margin-bottom:14px}
  .box{background:#0f1626;border:1px solid #2d3a52;border-radius:12px;padding:14px;margin-bottom:10px}
  .box h2{font-size:15px;color:#60a5fa;margin-bottom:8px}
  .ok{color:#6ee7b7}.bad{color:#fca5a5;font-weight:900}.warn{color:#fcd34d}
  .row{font-size:13px;margin:4px 0;line-height:1.6}
  pre{background:#020617;border-radius:8px;padding:10px;font-size:11px;overflow-x:auto;white-space:pre-wrap;word-break:break-all;color:#94a3b8;max-height:200px;overflow-y:auto}
  button{background:#3b82f6;color:#fff;border:none;border-radius:10px;padding:12px 20px;font-size:14px;font-weight:900;cursor:pointer;font-family:Cairo;width:100%;margin-bottom:10px}
  .fix{background:#16a34a}
  .copy{background:#475569;font-size:12px;padding:8px}
</style>
</head>
<body>
<h1>🔬 تشخيص البارو</h1>
<div id="out"><div class="box">⏳ جاري الفحص…</div></div>

<script>
const SUPABASE_URL="https://tvxxprynqeufzlgleurm.supabase.co";
const SUPABASE_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InR2eHhwcnlucWV1ZnpsZ2xldXJtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkwNjk4NTAsImV4cCI6MjA5NDY0NTg1MH0.FfHtUehBX0yjZsuMiE8Z8UP7bE1Ii_RFB5FKT4EJuXk";
const TABLE="baro_store";
const KEYS={PRODUCTS:"baro_products_v2",PERIODS:"baro_periods_v2",SETTINGS:"baro_settings_v2",IMAGES:"baro_images_v2",FILL:"baro_fill_v2"};
const out=document.getElementById("out");

async function sbGet(key){
  try{
    const res=await fetch(`${SUPABASE_URL}/rest/v1/${TABLE}?key=eq.${encodeURIComponent(key)}&select=value`,{headers:{apikey:SUPABASE_KEY,Authorization:`Bearer ${SUPABASE_KEY}`}});
    if(!res.ok) return {error:`HTTP ${res.status}`};
    const rows=await res.json();
    if(!rows?.length) return {empty:true};
    return {value:JSON.parse(rows[0].value), raw:rows[0].value};
  }catch(e){ return {error:String(e.message||e)}; }
}
async function sbSet(key,value){
  const res=await fetch(`${SUPABASE_URL}/rest/v1/${TABLE}`,{method:"POST",headers:{apikey:SUPABASE_KEY,Authorization:`Bearer ${SUPABASE_KEY}`,"Content-Type":"application/json",Prefer:"resolution=merge-duplicates"},body:JSON.stringify({key,value:JSON.stringify(value),updated_at:new Date().toISOString()})});
  return res.ok;
}
const num=v=>Number(v)||0;

let report="";
async function run(){
  let h="";

  // 1. الاتصal + كل مفتاح
  for(const [name,key] of Object.entries(KEYS)){
    const r=await sbGet(key);
    h+=`<div class="box"><h2>${name} (${key})</h2>`;
    if(r.error){ h+=`<div class="row bad">❌ خطأ: ${r.error}</div>`; report+=`${name}: ERROR ${r.error}\n`; }
    else if(r.empty){ h+=`<div class="row warn">⚠️ فارغ</div>`; report+=`${name}: EMPTY\n`; }
    else {
      const v=r.value;
      const size=(r.raw.length/1024).toFixed(1);
      h+=`<div class="row ok">✅ موجود · الحجم ${size} KB</div>`;
      report+=`${name}: OK ${size}KB`;
      if(Array.isArray(v)){ h+=`<div class="row">📊 عدد العناصر: ${v.length}</div>`; report+=` items=${v.length}`; }
      else if(typeof v==="object"){ h+=`<div class="row">🔑 المفاتيح: ${Object.keys(v).join(", ")||"(لا شيء)"}</div>`; report+=` keys=${Object.keys(v).join("|")}`; }
      report+="\n";

      // فحص settings بالذات
      if(key===KEYS.SETTINGS){
        h+=`<div class="row" style="margin-top:8px;border-top:1px solid #2d3a52;padding-top:8px"><b>فحص settings:</b></div>`;
        // stockOverrides
        const so=v.stockOverrides;
        if(so){
          const objs=Object.entries(so).filter(([,x])=>x&&typeof x==="object");
          if(objs.length){ h+=`<div class="row bad">❌ stockOverrides فيه ${objs.length} كائن (يكسر النظام!)</div>`; report+=`  BAD: stockOverrides has ${objs.length} objects\n`; }
          else { h+=`<div class="row ok">✅ stockOverrides أرقام (${Object.keys(so).length})</div>`; }
        } else h+=`<div class="row">stockOverrides: لا يوجd</div>`;
        // الثقيل
        ["transferred","editLog","stockMeta"].forEach(k=>{
          if(v[k]!==undefined){ const sz=JSON.stringify(v[k]).length; h+=`<div class="row bad">❌ settings فيه ${k} (${sz} حرف) — يجب أن يكون في FILL!</div>`; report+=`  BAD: settings has ${k} (${sz}ch)\n`; }
        });
      }
    }
    h+=`</div>`;
  }

  // ملخص + زر التنظيف
  h+=`<button class="copy" onclick="copyReport()">📋 نسخ التقرير</button>`;
  h+=`<button class="fix" onclick="cleanFix()">🧹 تنظيف settings (إصلاح التعليق)</button>`;
  out.innerHTML=h;
}

window.copyReport=()=>{
  navigator.clipboard.writeText(report).then(()=>alert("تم نسخ التقرير — الصقه للمبرمج")).catch(()=>{
    prompt("انسخ هذا:", report);
  });
};

window.cleanFix=async()=>{
  if(!confirm("تنظيف settings: تحويل أي كائن لرقم + نقل transferred/editLog/stockMeta لمفتاح FILL. آمن. متابعة؟")) return;
  const r=await sbGet(KEYS.SETTINGS);
  if(r.error||r.empty){ alert("ما قدرت أقرأ settings"); return; }
  const s=r.value;
  const fr=await sbGet(KEYS.FILL);
  const fill=(fr.value)||{};
  // كائن → رقم
  if(s.stockOverrides){
    const ov={},meta={...(fill.stockMeta||{})};
    Object.entries(s.stockOverrides).forEach(([k,v])=>{
      if(v&&typeof v==="object"){ov[k]=num(v.qty);meta[k]={atPeriodCount:num(v.atPeriodCount)};}
      else ov[k]=v;
    });
    s.stockOverrides=ov; fill.stockMeta=meta;
  }
  // نقل الثقيل لـ FILL
  if(s.stockMeta!==undefined){ if(!fill.stockMeta)fill.stockMeta=s.stockMeta; delete s.stockMeta; }
  if(s.transferred!==undefined){ if(!fill.transferred)fill.transferred=s.transferred; delete s.transferred; }
  if(s.editLog!==undefined){ if(!fill.editLog)fill.editLog=s.editLog; delete s.editLog; }
  const ok1=await sbSet(KEYS.SETTINGS,s);
  const ok2=await sbSet(KEYS.FILL,fill);
  alert(ok1&&ok2 ? "✅ تم التنظيف! افتح النظام الأساسي الآن." : "⚠️ صار خطأ بالحفظ");
  run();
};

run();
</script>
</body>
</html>
