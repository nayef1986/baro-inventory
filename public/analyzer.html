<style>

<script>
"use strict";

// ══ الحالة ══
let SALES_FILES = [];   // [{name, map:{bc:qty}}]
let PURCH_FILES = [];   // [{name, map:{bc:qty}, noBarcode:[...]}]
let PRICE_FILES = [];   // [{name, prices:{bc:{sell,cost,name}}}]
let RULES = { t1:85, t2:75, t3:50 };  // شرائح الخصم
let DISC_MODE = "trend";  // trend = الحركة الشهرية | pct = نسبة البيع
let RESULT = null;      // نتيجة التجميع

// ══ حفظ في Supabase (يظهر للكل) ══
const SUPABASE_URL = "https://tvxxprynqeufzlgleurm.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InR2eHhwcnlucWV1ZnpsZ2xldXJtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkwNjk4NTAsImV4cCI6MjA5NDY0NTg1MH0.FfHtUehBX0yjZsuMiE8Z8UP7bE1Ii_RFB5FKT4EJuXk";
const TABLE = "baro_store";
const STORE_KEY = "baro_analyzer_v1";

async function saveToCloud(){
  try {
    const payload = { salesFiles: SALES_FILES, purchFiles: PURCH_FILES, priceFiles: PRICE_FILES, rules: RULES };
    await fetch(`${SUPABASE_URL}/rest/v1/${TABLE}`, {
      method:"POST",
      headers:{ apikey:SUPABASE_KEY, Authorization:`Bearer ${SUPABASE_KEY}`, "Content-Type":"application/json", Prefer:"resolution=merge-duplicates" },
      body: JSON.stringify({ key: STORE_KEY, value: JSON.stringify(payload), updated_at: new Date().toISOString() })
    });
    toast("💾 حُفظ في النظام");
  } catch(e){ toast("تعذّر الحفظ — تحقق من النت"); }
}

async function loadFromCloud(){
  try {
    const ctrl = new AbortController();
    const timer = setTimeout(()=>ctrl.abort(), 20000);
    const r = await fetch(`${SUPABASE_URL}/rest/v1/${TABLE}?key=eq.${STORE_KEY}&select=value`,
      { headers:{ apikey:SUPABASE_KEY, Authorization:`Bearer ${SUPABASE_KEY}` }, signal: ctrl.signal });
    clearTimeout(timer);
    const j = await r.json();
    let raw = j?.[0]?.value;
    if (raw == null) return;
    if (typeof raw === "string") raw = JSON.parse(raw);
    SALES_FILES = raw.salesFiles || [];
    PURCH_FILES = raw.purchFiles || [];
    PRICE_FILES = raw.priceFiles || [];
    RULES = raw.rules || RULES;
    if (SALES_FILES.length || PURCH_FILES.length || PRICE_FILES.length){ analyze(); }
  } catch(e){ /* أول مرة أو نت ضعيف */ }
}

async function clearCloud(){
  try {
    await fetch(`${SUPABASE_URL}/rest/v1/${TABLE}?key=eq.${STORE_KEY}`, {
      method:"DELETE",
      headers:{ apikey:SUPABASE_KEY, Authorization:`Bearer ${SUPABASE_KEY}` }
    });
  } catch(e){}
}
let TAB = "best";       // best | weak | all
let SEARCH = "";
let SORT = "sold_desc"; // sold_desc | sold_asc | pct_asc | pct_desc | factory
let GROUP = "none";     // none | factory | container
let NO_BC = [];         // أصناف بدون باركود

// ══ أدوات ══
const num = v => Number(v)||0;
// السعر النهائي بعد الخصم — لا ينزل تحت نص التكلفة
function finalPrice(sell, cost, discount){
  if (!(sell > 0) || !discount) return null;
  // لو سعر البيع أقل من سعر الشراء (خسران أصلاً) → ما نخصم، نخلّي السعر زي ما هو
  if (cost > 0 && sell < cost) return sell;
  let p = Math.round(sell * (1 - discount/100) * 100) / 100;
  const floor = cost > 0 ? cost / 2 : 0;  // الحد الأدنى = نص التكلفة
  if (floor > 0 && p < floor) p = Math.round(floor * 100) / 100;
  return p;
}
const fmt = v => (Number(v)||0).toLocaleString("en-US",{maximumFractionDigits:0});
const factoryCode = bc => String(bc||"").slice(0,5);
// كود الكونتينر (BAR03YW24) من اسم الفئة — لو تكرر بأسماء مختلفة يندمج
function containerCode(name){
  if (!name) return "";
  const m = String(name).match(/BAR\s*0*\d+\s*YW\s*\d+/i);
  if (m) return m[0].replace(/\s+/g,"").toUpperCase();
  return String(name).trim();
}
const $ = id => document.getElementById(id);
function toast(msg){ const t=$("toast"); t.textContent=msg; t.classList.add("show"); setTimeout(()=>t.classList.remove("show"),2200); }

// ══ استخراج المبيعات: الباركود بين [ ] ══
// ══ كشف وقراءة الملف الشهري (صف ثاني فيه أسماء شهور) ══
const MONTH_RE = /20\d{2}|يناير|فبراير|مارس|أبريل|ابريل|مايو|يونيو|يوليو|أغسطس|اغسطس|سبتمبر|أكتوبر|اكتوبر|نوفمبر|ديسمبر/;
function isMonthlyFile(rows){
  const r2 = rows[1] || [];
  const cnt = r2.filter(v => typeof v==="string" && MONTH_RE.test(v) && v.trim()!=="الإجمالي").length;
  return cnt >= 2;
}
function parseMonthly(rows){
  const monthRow = rows[1] || [];
  const months = [];
  monthRow.forEach((v,i) => {
    if (typeof v==="string" && v.trim() && v.trim()!=="الإجمالي" && MONTH_RE.test(v)) months.push({ col:i, name:v.trim() });
  });
  const map = {};      // bc -> إجمالي
  const names = {};    // bc -> اسم
  const monthly = {};  // bc -> [كمية كل شهر]
  for (let i=4; i<rows.length; i++){
    const row = rows[i];
    const key = String(row?.[0] ?? "").trim();
    if (!key || key==="الإجمالي") continue;
    const m = key.match(/\[([^\]]+)\]/);
    if (!m) continue;
    const bc = m[1].trim();
    const nm = key.replace(/\[[^\]]+\]/,"").replace(/\d+\s*$/,"").trim();
    const arr = months.map(mo => num(row[mo.col]));
    const tot = arr.reduce((s,x)=>s+x,0);
    if (tot <= 0) continue;
    map[bc] = (map[bc]||0) + tot;
    if (!names[bc] && nm) names[bc] = nm;
    if (!monthly[bc]) monthly[bc] = arr.slice();
    else monthly[bc] = monthly[bc].map((x,j)=>x+(arr[j]||0));
  }
  return { map, names, monthly, monthNames: months.map(m=>m.name) };
}

// تصنيف المنتج حسب حركته الشهرية → {code, label, disc}
function classifyMonthly(m){
  if (!m || !m.length) return { code:"none", label:"", disc:0 };
  const n = m.length;
  const nz = m.filter(x=>x>0).length;
  const total = m.reduce((s,x)=>s+x,0);
  if (nz===0) return { code:"nomove", label:"ما تحرّك — تصفية عاجلة", disc:85 };
  const peak = Math.max(...m); const peakIdx = m.indexOf(peak);
  const half = Math.floor(n/2);
  const recent3 = m.slice(-3); const sumRecent3 = recent3.reduce((s,x)=>s+x,0);
  const avgRecent = sumRecent3/3;
  const firstHalf = m.slice(0,half).reduce((s,x)=>s+x,0)/Math.max(1,half);
  const lastHalf = m.slice(half).reduce((s,x)=>s+x,0)/Math.max(1,n-half);
  if (sumRecent3===0) return { code:"stopped", label:"توقّف — راكد يحتاج تصفية", disc:85 };
  if (peakIdx < half && avgRecent < peak*0.3 && peak>=10) return { code:"wasStrong", label:"كان قوي وخفّت بضاعته — اطلب جديد، لا تخصّم", disc:0 };
  if (peak<=3) return { code:"weakAlways", label:"ضعيف من البداية — خصم وتصفية", disc:75 };
  if (lastHalf < firstHalf*0.5 && firstHalf>3) return { code:"declining", label:"يضعف شهرياً — راقبه أو خصم خفيف", disc:50 };
  if (lastHalf >= firstHalf) return { code:"stable", label:"مستقر/صاعد — سليم", disc:0 };
  return { code:"normal", label:"عادي", disc:0 };
}

function parseSales(rows){
  const map = {};
  const names = {};
  rows.forEach(row => {
    const txt = row[0];
    if (!txt) return;
    const m = String(txt).match(/\[([^\]]+)\]/);
    if (!m) return;
    const code = m[1].trim();
    const qty = num(row[1]);
    if (qty > 0){
      map[code] = (map[code]||0) + qty;
      if (!names[code]){
        const nm = String(txt).replace(/\[[^\]]+\]/,"").replace(/\d+\s*$/,"").trim();
        if (nm) names[code] = nm;
      }
    }
  });
  return { map, names };
}

// ══ استخراج المشتريات: يكتشف الصيغة تلقائياً ══
// صيغة 1: الباركود بين [ ] والكمية في عمود لاحق (زي المبيعات/تحليل المشتريات)
// صيغة 2: فاتورة بمدى B001~012 والكمية في عمود PCS
function parsePurchases(rows){
  const map = {};        // bc -> qty
  const contOf = {};     // bc -> اسم الكونتينر
  const info = {};       // bc -> {name, cost, sell}
  const noBarcode = [];

  // نكتشف الصيغة: أقواس (تحليل) أو مدى (فاتورة)
  let bracketRows = 0, sampleN = 0;
  for (const row of rows){
    if (sampleN >= 30) break;
    const c = row.find(x => x && String(x).includes("["));
    if (c) bracketRows++;
    if (row.some(x => x != null)) sampleN++;
  }
  const isBracketFormat = bracketRows >= 3;

  if (isBracketFormat){
    // صيغة هرمية: فئة/كونتينر (بلا باركود) ثم منتجات تحتها (بباركود)
    let currentCont = "";
    rows.forEach(row => {
      // الخلية النصية = أول خلية فيها نص (العمود الأول)
      const txtCell = row.find(x => x != null && String(x).trim() !== "" && isNaN(Number(x)));
      if (!txtCell) return;
      const raw = String(txtCell);
      const body = raw.trim();
      if (body.includes("الإجمالي")) return;
      const m = body.match(/\[([^\]]+)\]/);
      if (m){
        // منتج: له باركود
        const code = m[1].trim();
        const nums = row.filter(x => typeof x === "number" && x > 0);
        let qty = 0;
        for (const nv of nums){ if (Number.isInteger(nv) && nv > qty) qty = nv; }
        if (qty <= 0 && nums.length) qty = Math.round(nums[0]);
        if (qty > 0){
          map[code] = (map[code]||0) + qty;
          if (!contOf[code]) contOf[code] = currentCont ? containerCode(currentCont) : "بدون كونتينر";
          // الاسم: النص بعد قوس الباركود
          if (!info[code]){
            const nm = body.replace(/\[[^\]]+\]/,"").trim();
            info[code] = { name:nm, cost:0, sell:0 };
          }
        }
      } else {
        // فئة/كونتينر: بلا باركود → نحفظه للمنتجات اللي تحته
        currentCont = body;
      }
    });
    return { map, contOf, info, noBarcode };
  }

  // صيغة الفاتورة: [سعر البيع, ITEM NO, NAME, QTY, PRICE(شراء), T.PRICE]
  // الكونتينر من الصف الأول (العمود الثالث عادة) لو موجود
  let invCont = "";
  if (rows[0]){
    const ft = rows[0].find(x => x && String(x).trim() !== "");
    if (ft) invCont = containerCode(String(ft).trim());
  }
  rows.forEach(row => {
    const item = row[1];
    const pcs = num(row[3]);
    if (!item || pcs <= 0) return;
    const code = String(item).trim();
    if (code === "ITEM NO" || code.includes("ITEM")) return; // صف العناوين
    if (!/[A-Za-z]*\d{4,}/.test(code) || /^stock/i.test(code)) {
      noBarcode.push({ name: String(row[2]||code).trim(), qty: pcs, price: num(row[4]), cont: invCont || "" });
      return;
    }
    const sellPrice = num(row[0]);   // العمود الأول = سعر البيv
    const name = String(row[2]||"").trim();
    const costPrice = num(row[4]);   // PRICE = سعر الشراء
    const rng = code.match(/^(.+?)(\d+)~(\d+)$/);
    if (rng) {
      const prefix = rng[1], start = +rng[2], end = +rng[3], width = rng[2].length;
      const count = end - start + 1;
      if (count >= 1 && count <= 200) {
        const per = pcs / count;
        for (let i=start; i<=end; i++){
          const b = prefix + String(i).padStart(width,"0");
          map[b] = (map[b]||0) + per;
          if (!contOf[b]) contOf[b] = invCont || "بدون كونتينر";
          if (!info[b]) info[b] = { name, cost:costPrice, sell:sellPrice };
        }
        return;
      }
    }
    map[code] = (map[code]||0) + pcs;
    if (!contOf[code]) contOf[code] = invCont || "بدون كونتينر";
    if (!info[code]) info[code] = { name, cost:costPrice, sell:sellPrice };
  });
  return { map, contOf, info, noBarcode };
}

// ══ قراءة ملف إكسل ══
function readFile(file){
  return new Promise((res, rej) => {
    const reader = new FileReader();
    reader.onload = e => {
      try {
        const wb = XLSX.read(e.target.result, { type:"array" });
        const ws = wb.Sheets[wb.SheetNames[0]];
        const rows = XLSX.utils.sheet_to_json(ws, { header:1, defval:null });
        res(rows);
      } catch(err){ rej(err); }
    };
    reader.onerror = rej;
    reader.readAsArrayBuffer(file);
  });
}

// ══ رفع ملفات المبيعات ══
// ══ قراءة ملف الأسعار: الاسم، باركود، سعر بيع، تكلفة ══
function parsePrices(rows){
  const prices = {};
  // نكتشف أعمدة: نبحث في صف العناوين عن باركود/بيع/تكلفة
  let bcCol=-1, sellCol=-1, costCol=-1, nameCol=-1;
  const header = rows[0] || [];
  header.forEach((h,i) => {
    const s = String(h||"").trim();
    if (/باركود|barcode|item/i.test(s)) bcCol=i;
    else if (/بيع|sell|sale/i.test(s)) sellCol=i;
    else if (/تكلفة|شراء|cost|price/i.test(s)) costCol=i;
    else if (/اسم|name/i.test(s)) nameCol=i;
  });
  // احتياطي: لو ما لقينا، نفترض [اسم, باركود, بيع, تكلفة]
  if (bcCol<0) bcCol=1;
  if (sellCol<0) sellCol=2;
  if (costCol<0) costCol=3;
  if (nameCol<0) nameCol=0;
  for (let i=1; i<rows.length; i++){
    const row = rows[i];
    if (!row) continue;
    const bc = String(row[bcCol]||"").trim();
    if (!bc || !/\d{3,}/.test(bc)) continue;
    const sell = num(row[sellCol]);
    const cost = num(row[costCol]);
    const name = String(row[nameCol]||"").trim();
    if (!prices[bc]) prices[bc] = { sell, cost, name };
  }
  return prices;
}

async function onPriceFiles(files){
  for (const f of files){
    try {
      const rows = await readFile(f);
      const prices = parsePrices(rows);
      PRICE_FILES.push({ name: f.name, prices });
    } catch(e){ toast("تعذّر قراءة "+f.name); }
  }
  RESULT = null;
  render();
  if (PRICE_FILES.length) saveToCloud();
}

async function onSalesFiles(files){
  for (const f of files){
    try {
      const rows = await readFile(f);
      if (isMonthlyFile(rows)){
        const { map, names, monthly, monthNames } = parseMonthly(rows);
        SALES_FILES.push({ name: f.name, map, names, monthly, monthNames, isMonthly:true });
      } else {
        const { map, names } = parseSales(rows);
        SALES_FILES.push({ name: f.name, map, names });
      }
    } catch(e){ toast("تعذّر قراءة "+f.name); }
  }
  RESULT = null;
  render();
}
async function onPurchFiles(files){
  for (const f of files){

      const { map, contOf, info, noBarcode } = parsePurchases(rows);
      PURCH_FILES.push({ name: f.name, map, contOf, info, noBarcode });
    } catch(e){ toast("تعذّر قراءة "+f.name); }
  }
  RESULT = null;
  render();
}

// ══ التجميع والتحليل ══
function analyze(){
  if (SALES_FILES.length === 0){ toast("ارفع ملف مبيعات أولاً"); return; }
  // اجمع المبيعات
  const sales = {};
  SALES_FILES.forEach(f => Object.entries(f.map).forEach(([bc,q]) => sales[bc] = (sales[bc]||0) + q));
  // اجمع المشتريات + الكونتينر
  const purch = {};
  const contMap = {};   // bc -> كود الكونتينر
  const infoMap = {};   // bc -> {name, cost, sell}
  const purchCount = {}; // bc -> كم فاتورة شراء جاء فيها (للتكرار)
  NO_BC = [];
  PURCH_FILES.forEach(f => {
    Object.entries(f.map).forEach(([bc,q]) => { purch[bc] = (purch[bc]||0) + q; purchCount[bc] = (purchCount[bc]||0) + 1; });
    Object.entries(f.contOf||{}).forEach(([bc,c]) => { if (!contMap[bc]) contMap[bc] = c; });
    Object.entries(f.info||{}).forEach(([bc,d]) => { if (!infoMap[bc]) infoMap[bc] = d; });
    NO_BC.push(...f.noBarcode);
  });
  const hasPurch = Object.keys(purch).length > 0;

  // ملفات الأسعار المنفصلة (تكمّل أو تستبدل السعر)
  const priceMap = {};
  PRICE_FILES.forEach(f => Object.entries(f.prices||{}).forEach(([bc,p]) => { if(!priceMap[bc]) priceMap[bc]=p; }));

  // أسماء المبيعات
  const salesNames = {};
  SALES_FILES.forEach(f => Object.entries(f.names||{}).forEach(([bc,nm]) => { if(!salesNames[bc]) salesNames[bc]=nm; }));
  // الحركة الشهرية (من الملف الشهري)
  const monthlyMap = {};
  let monthNames = [];
  SALES_FILES.forEach(f => {
    if (f.isMonthly && f.monthly){
      if (!monthNames.length) monthNames = f.monthNames || [];
      Object.entries(f.monthly).forEach(([bc,arr]) => {
        if (!monthlyMap[bc]) monthlyMap[bc] = arr.slice();
        else monthlyMap[bc] = monthlyMap[bc].map((x,j)=>x+(arr[j]||0));
      });
    }
  });
  const hasMonthly = monthNames.length > 0;

  // ادمج
  const allBc = new Set([...Object.keys(sales), ...Object.keys(purch)]);
  const items = [...allBc].map(bc => {
    const sold = Math.round(sales[bc]||0);
    const bought = Math.round(purch[bc]||0);
    const remaining = hasPurch ? Math.max(0, bought - sold) : null;
    const soldPct = (hasPurch && bought>0) ? (sold/bought)*100 : null;
    const inf = infoMap[bc] || {};
    const pr = priceMap[bc] || {};
    // السعر: ملف الأسعار المنفصل له الأولوية، وإلا من الفاتورة
    const sellPrice = num(pr.sell) || num(inf.sell);
    const costPrice = num(pr.cost) || num(inf.cost);
    const prodName = pr.name || inf.name || "";
    return {
      bc, sold, bought, remaining, soldPct,
      factory: factoryCode(bc), cont: contMap[bc] || "بدون كونتينر",
      purchName: prodName, salesName: salesNames[bc] || "",
      monthly: monthlyMap[bc] || null,
      trend: monthlyMap[bc] ? classifyMonthly(monthlyMap[bc]) : null,
      cost: costPrice, sell: sellPrice,
      totalCost: costPrice * bought,
      dupPurch: (purchCount[bc]||0) > 1,
    };
  });

  // رتّب بالمبيعات
  items.sort((a,b) => b.sold - a.sold);

  // شرائح الخصم: نوزّع على الثلث الأضعف/الأوسط/الأقوى-ضمن-الضعيف
  // الضعيف = النصف الأدنى مبيعا
  const withSales = items.filter(i => i.sold > 0);
  const n = withSales.length;
  // 💸 الخصم: خيار المستخدم — الحركة الشهرية أو نسبة البيع
  const WEAK_THRESHOLD = 50;
  const useTrend = DISC_MODE === "trend";
  items.forEach(it => {
    // نستخدم الحركة لو مختارة ومتوفرة
    if (useTrend && it.trend){
      const code = it.trend.code;
      if (code === "nomove" || code === "stopped") it.discount = RULES.t1;
      else if (code === "weakAlways") it.discount = RULES.t2;
      else if (code === "declining") it.discount = RULES.t3;
      else it.discount = 0;
      return;
    }
    // نسبة البيع
    if (it.soldPct === null){ it.discount = 0; return; }
    const pct = it.soldPct;
    if (pct >= WEAK_THRESHOLD){ it.discount = 0; return; }
    if (pct < WEAK_THRESHOLD/3) it.discount = RULES.t1;
    else if (pct < (WEAK_THRESHOLD*2)/3) it.discount = RULES.t2;
    else it.discount = RULES.t3;
  });

  // منتجات لها مبيعات بس بدون فاتورة شراء (تطلع لحالها لو رُفعت مشتريات)
  const noPurchase = hasPurch
    ? items.filter(i => i.sold > 0 && i.bought === 0).sort((a,b) => b.sold - a.sold)
    : [];

  RESULT = { items, hasPurch, noPurchase, hasMonthly, monthNames, totalSold: items.reduce((s,i)=>s+i.sold,0),
             totalBought: items.reduce((s,i)=>s+i.bought,0), count: items.length };
  render();
  saveToCloud();
}

         <span class="cnt">${cnt} باركود</span>
         <span class="rm" onclick="removeFile('${kind}',${i})">✕</span>

}

function rankColor(i){
  if (i===0) return ["#f59e0b","#0b0f1a"];
  if (i===1) return ["#94a3b8","#0b0f1a"];
  if (i===2) return ["#b45309","#fff"];

}

    <div style="font-size:11px;color:#475569;margin-bottom:10px">${list.length} منتج${shown.length<list.length?` · يُعرض أول ${shown.length}`:''}</div>

    ${GROUP!=='none' ? renderGrouped(list, GROUP) : shown.map((it,i)=>itemCard(it,i,TAB)).join("")}

    ${RESULT.noPurchase && RESULT.noPurchase.length>0?`<div class="side" style="background:#0d1a2a;border-color:#1e3a52">
      <h3 style="color:#7aa5e0">📦 مباع بدون فاتورة شراء (${RESULT.noPurchase.length})</h3>
      <div style="font-size:11px;color:#5b7fb8;margin-bottom:10px">مبيعات بدون مشتريات مسجّلة — قد تكون بضاعة قديمة</div>
      ${RESULT.noPurchase.slice(0,50).map((it,i)=>itemCard(it,i,TAB)).join("")}
      ${RESULT.noPurchase.length>50?`<div class="it" style="color:#5b7fb8;border:none;padding-top:8px">+ ${RESULT.noPurchase.length-50} منتج آخر</div>`:''}
    </div>`:''}

    ${NO_BC.length>0?`<div class="side">
      <h3>⚠️ أصناف بدون باركود (${NO_BC.length})</h3>
      <div style="font-size:11px;color:#a8895a;margin-bottom:10px">لها معلومات كاملة عدا الباركود — أضِفه يدوياً</div>
      ${NO_BC.slice(0,50).map((x,i)=>`<div class="nobccard">
        <div style="font-size:13px;font-weight:900;color:#f0e6d0;margin-bottom:6px">${x.name||'—'}</div>
        <div class="nobcgrid">
          <div class="nobccell"><span class="ncv">${fmt(x.qty)}</span><span class="ncl">الكمية</span></div>
          ${x.price>0?`<div class="nobccell"><span class="ncv">${fmt(x.price)}</span><span class="ncl">السعر</span></div>`:''}
          ${x.cont?`<div class="nobccell"><span class="ncv" style="font-size:12px">${x.cont}</span><span class="ncl">الكونتينر</span></div>`:''}
        </div>
        <div style="display:flex;gap:6px;align-items:center;margin-top:8px">
          <input class="bcinput" id="nobc_${i}" placeholder="اكتب الباركود هنا…" style="flex:1;background:#0d1420;border:1px solid #3a2a10;color:#fff;border-radius:8px;padding:8px 10px;font-family:monospace;font-size:14px;outline:none">
        </div>
      </div>`).join("")}
      ${NO_BC.length>50?`<div class="it" style="color:#64748b;border:none;padding-top:8px">+ ${NO_BC.length-50} صنف آخر</div>`:''}
    </div>`:''}
  `;
}

// ══ أحداث ══
function removeFile(kind, i){
  if (kind==='sales') SALES_FILES.splice(i,1);
  else if (kind==='price') PRICE_FILES.splice(i,1);
  else PURCH_FILES.splice(i,1);
  RESULT = null; render();
  if (SALES_FILES.length || PURCH_FILES.length || PRICE_FILES.length) saveToCloud(); else clearCloud();
}
function setRule(k,v){ RULES[k]=Math.max(0,Math.min(95,num(v))); if(RESULT) analyze(); }
function setDiscMode(m){ DISC_MODE=m; if(RESULT) analyze(); }
function setTab(t){ TAB=t; render(); }
function setSearch(v){ SEARCH=v; render(); }
function setSort(v){ SORT=v; render(); }
function setGroup(g){ GROUP = (GROUP===g) ? "none" : g; render(); }
function toggleGroup(){ GROUP = GROUP==='none' ? 'factory' : 'none'; render(); }

// تجميع حسب المصنع أو الكونتينر
function renderGrouped(items, mode){
  const groups = {};
  items.forEach(it => {
    const key = mode==='container' ? (it.cont || "بدون كونتينر") : it.factory;
    if (!groups[key]) groups[key] = [];
    groups[key].push(it);
  });
  const sorted = Object.entries(groups).map(([key, arr]) => ({
    key, arr, total: arr.reduce((s,i)=>s+i.sold,0)
  })).sort((a,b) => b.total - a.total);
  const icon = mode==='container' ? "📦" : "🏭";
  const label = mode==='container' ? "" : "مصنع ";
  return sorted.map(g => {
    const open = OPEN_GROUPS[g.key] === true;
    const safeKey = g.key.replace(/'/g,"");
    return `
    <div class="facgroup">
      <div class="fachead">
        <span onclick="toggleGroupOpen('${safeKey}')" style="cursor:pointer;flex:1">${open?'▲':'▼'} ${icon} ${label}${g.key}</span>
        <span class="faccount">${g.arr.length} منتج · باع ${fmt(g.total)}</span>
        <button onclick="printGroup('${safeKey}','${mode}')" style="background:rgba(37,99,235,0.25);border:none;border-radius:8px;color:#7aa5e0;font-size:16px;padding:4px 9px;cursor:pointer;margin-inline-start:8px">🖨️</button>
      </div>
      ${open ? g.arr.map((it,i)=>itemCard(it,i,TAB)).join("") : ""}
    </div>`;
  }).join("");
}
let OPEN_GROUPS = {};
function toggleGroupOpen(key){ OPEN_GROUPS[key] = !OPEN_GROUPS[key]; render(); }

// طباعة كونتينر/مصنع واحد
function printGroup(key, mode){
  if (!RESULT) return;
  const items = RESULT.items.filter(it => (mode==='container' ? (it.cont||"بدون كونتينر") : it.factory) === key)
    .sort((a,b)=>b.sold-a.sold);
  const icon = mode==='container' ? "📦 كونتينر" : "🏭 مصنع";
  printList(items, `${icon} ${key}`);
}
function resetAll(){
  if (!confirm("مسح كل الملفات والبيانات من النظام؟ (يظهر للكل)")) return;
  SALES_FILES=[]; PURCH_FILES=[]; PRICE_FILES=[]; RESULT=null; NO_BC=[]; SEARCH=""; OPEN_GROUPS={};
  clearCloud();
  toast("🗑️ مُسح الكل");
  render();
}

// ══ الطباعة ══
function doPrint(){
  if (!RESULT) return;
  let list = [...RESULT.items];
  if (TAB==='weak') list = list.filter(i=>i.sold>0 && i.discount>0);
  if (SEARCH){ const s=SEARCH.toLowerCase(); list=list.filter(i=>i.bc.toLowerCase().includes(s)||i.factory.includes(s)||(i.purchName||i.salesName||'').toLowerCase().includes(s)); }
  const sortFns={sold_desc:(a,b)=>b.sold-a.sold,sold_asc:(a,b)=>a.sold-b.sold,pct_desc:(a,b)=>(b.soldPct??-1)-(a.soldPct??-1),pct_asc:(a,b)=>(a.soldPct??999)-(b.soldPct??999),factory:(a,b)=>a.factory.localeCompare(b.factory)||b.sold-a.sold};
  let eff=SORT; if(TAB==='weak'&&SORT==='sold_desc')eff='sold_asc';
  list.sort(sortFns[eff]||sortFns.sold_desc);
  const ttl = TAB==='weak' ? 'الأضعف مبيعاً + خصم التصريف' : TAB==='best' ? 'الأفضل مبيعاً' : 'كل المنتجات';
  printList(list, ttl);
}

// طباعة قائمة منتجات (يستخدمها doPrint و printGroup)
function printList(list, ttl){
  if (!list || list.length===0){ toast("لا منتجات للطباعة"); return; }
  const weak = TAB==='weak';
  const d = new Date();
  const greg = d.toLocaleDateString("ar-SA-u-ca-gregory",{year:"numeric",month:"long",day:"numeric"});
  const hijri = d.toLocaleDateString("ar-SA-u-ca-islamic",{year:"numeric",month:"long",day:"numeric"});

  const totalSold = list.reduce((s,i)=>s+i.sold,0);
  const totalBought = list.reduce((s,i)=>s+i.bought,0);
  const stats = [["المنتجات", fmt(list.length)], ["إجمالي المبيعات", fmt(totalSold)]];
  if (RESULT.hasPurch) stats.push(["إجمالي المشتريات", fmt(totalBought)]);

  const rows = list.map((it,i) => {
    const nmS = it.salesName || "—";
    const nmP = it.purchName || "—";
    const discPrice = finalPrice(it.sell, it.cost, it.discount);
    return `<tr class="${weak?'w':''}">
    <td class="n">${i+1}</td>
    <td class="bc">${it.bc}</td>
    <td class="nm">${nmS}</td>
    <td class="nm2">${nmP}</td>
    <td class="f">${it.factory}</td>
    <td class="big">${fmt(it.sold)}</td>
    ${RESULT.hasPurch?`<td class="mid">${fmt(it.bought)}</td><td class="mid">${it.remaining!==null?fmt(it.remaining):'—'}</td><td class="pct">${it.soldPct!==null?Math.round(it.soldPct)+'%':'—'}</td>`:''}
    ${it.cost>0?`<td class="mid">${fmt(it.cost)}</td>`:'<td>—</td>'}
    ${it.sell>0?`<td class="mid">${fmt(it.sell)}</td>`:'<td>—</td>'}
    ${weak?`<td class="d">${it.discount}%</td><td class="big">${discPrice!==null?fmt(discPrice):'—'}</td>`:''}
    ${RESULT.hasMonthly?`<td class="sug">${it.trend?it.trend.label:'—'}</td>`:''}
  </tr>`;}).join("");

  const statsHtml = stats.map(([l,v])=>`<div class="sc"><div class="sv">${v}</div><div class="sl">${l}</div></div>`).join("");

  const html = `<!DOCTYPE html><html dir="rtl"><head><meta charset="utf-8"><title>${ttl}</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap');
    *{font-family:'Cairo',sans-serif;box-sizing:border-box;margin:0;padding:0}
    body{background:#fff;color:#1a1a1a}
    .tb{position:fixed;top:0;left:0;right:0;background:#0f172a;padding:10px;display:flex;gap:10px;justify-content:center;z-index:99}
    .tb button{font-family:'Cairo';font-size:14px;font-weight:700;border:none;border-radius:10px;padding:10px 20px;cursor:pointer}
    .bk{background:#334155;color:#fff}.pr{background:#2563eb;color:#fff}
    .w{max-width:960px;margin:0 auto;padding:70px 16px 40px}
    h1{text-align:center;color:#0f172a;font-size:24px;margin-bottom:4px;font-weight:900}
    .date{text-align:center;color:#888;font-size:13px;margin-bottom:16px}
    .stats{display:flex;gap:10px;justify-content:center;margin-bottom:20px;flex-wrap:wrap}
    .sc{background:#f0f9ff;border:1px solid #bae6fd;border-radius:12px;padding:12px 20px;text-align:center;min-width:110px}
    .sv{font-size:24px;font-weight:900;color:#0f172a}
    .sl{font-size:12px;color:#64748b;margin-top:2px}
    table{width:100%;border-collapse:collapse;font-size:13px}
    th{background:#0f172a;color:#fff;padding:10px 6px;font-size:12px;font-weight:700}
    td{border:1px solid #e2e8f0;padding:8px 6px;text-align:center}
    td.n{background:#f1f5f9;font-weight:900;color:#888;font-size:12px}
    td.bc{font-family:monospace;font-size:14px;color:#0f172a;font-weight:900;letter-spacing:0.5px}
    td.nm{text-align:right;font-weight:700;font-size:12px;color:#334155}
    td.nm2{text-align:right;font-weight:700;font-size:11px;color:#2563eb}
    td.f{font-family:monospace;color:#64748b;font-size:12px;font-weight:700}
    td.big{font-size:18px;font-weight:900;color:#059669}
    td.mid{font-size:14px;font-weight:700;color:#334155}
    td.pct{font-size:14px;font-weight:900;color:#d97706}
    td.d{font-size:18px;font-weight:900;color:#dc2626}
    td.sug{text-align:right;font-size:11px;font-weight:700;color:#334155;max-width:180px}
    tr.w td.big{color:#dc2626}
    tr:nth-child(even) td{background:#fafbfc}
    @media print{.tb{display:none}.w{padding:16px}}
  </style></head><body>
  <div class="tb"><button class="bk" onclick="window.close();history.back()">← رجوع</button><button class="pr" onclick="window.print()">🖨️ طباعة</button></div>
  <div class="w">
    <h1>${ttl}</h1>
    <div class="date">📅 ${greg} · ${hijri}هـ · ALBAROO</div>
    <div class="stats">${statsHtml}</div>
    <table><thead><tr>
      <th>#</th><th>الباركود</th><th>اسم المبيعات</th><th>اسم المشتريات</th><th>المصنع</th><th>باع</th>
      ${RESULT.hasPurch?'<th>كمية الشراء</th><th>متبقي</th><th>نسبة</th>':''}
      <th>سعر الشراء</th><th>سعر البيع</th>
      ${weak?'<th>الخصم</th><th>بعد الخصم</th>':''}
      ${RESULT.hasMonthly?'<th>الاقتراح</th>':''}
    </tr></thead><tbody>${rows}</tbody></table>
  </div></body></html>`;
  const w = window.open("","_blank");
  if (w){ w.document.write(html); w.document.close(); }
  else toast("اسمح بالنوافذ المنبثقة للطباعة");
}
render();
loadFromCloud();
</script>
