:root{--ink:#12100E;--velvet:#1C1815;--velvet-2:#241F1A;--gold:#C9A227;--gold-dim:#8A6F47;--cream:#EFE6D6;--muted:#9A8B75;--line:#2E271F;--alert:#C86B4A}
*{font-family:'Tajawal',sans-serif;box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:var(--ink);color:var(--cream);padding-bottom:70px;line-height:1.6}
.wrap{max-width:860px;margin:0 auto;padding:16px}
.hd{padding:34px 0 22px;text-align:center;position:relative}
.hd::after{content:"";position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:52px;height:1px;background:var(--gold);opacity:.55}
.hd h1{font-size:32px;font-weight:900;letter-spacing:-.8px}
.hd .sub{font-size:13px;color:var(--muted);margin-top:8px;font-weight:300}
.btn{border:none;border-radius:13px;padding:14px;font-family:'Tajawal';font-size:15px;font-weight:700;cursor:pointer;width:100%}
.pr{background:var(--gold);color:#1A1509}
.sec2{background:transparent;color:var(--muted);border:1px solid var(--line)}
.dg{background:var(--alert);color:#fff}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.sect{margin-bottom:12px;background:var(--velvet);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.sect-hd{padding:16px 18px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.sect-hd .t{font-size:18px;font-weight:900;cursor:pointer;flex:1}
.sect-hd .c{color:var(--gold);font-size:14px;font-weight:700}
.sect-hd .x{background:none;border:none;color:var(--alert);font-size:17px;cursor:pointer;padding:4px 8px}
.sect-body{border-top:1px solid var(--line);padding:6px}
.item{display:flex;align-items:center;justify-content:space-between;padding:11px 14px;border-radius:11px;gap:10px}
.item .ar{font-size:15px;font-weight:400;flex:1}
.item .x{background:none;border:none;color:var(--alert);font-size:15px;cursor:pointer;padding:3px 7px}
.add{width:100%;background:var(--velvet-2);border:1px dashed var(--line);color:var(--muted);border-radius:11px;padding:12px;font-family:'Tajawal';font-size:14px;cursor:pointer;margin-top:4px}
.empty{text-align:center;padding:50px 20px;color:var(--muted);font-weight:300;line-height:1.9}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--velvet-2);color:var(--cream);border:1px solid var(--line);padding:14px 26px;border-radius:13px;font-size:14px;font-weight:700;opacity:0;transition:opacity .3s;z-index:999;pointer-events:none}
.toast.show{opacity:1}
.back{color:var(--gold);font-size:15px;font-weight:700;background:none;border:none;cursor:pointer;padding:10px 0;text-decoration:none;display:inline-block}
.note{background:rgba(201,162,39,.07);border:1px solid rgba(201,162,39,.22);border-radius:14px;padding:14px 16px;font-size:13px;line-height:1.75;margin-bottom:16px;font-weight:300}
</style>

let CATS = {};
let openSection = null;

const $ = id => document.getElementById(id);
function toast(m){ const t=$("toast"); t.textContent=m; t.classList.add("show"); setTimeout(()=>t.classList.remove("show"),2200); }
const esc = s => String(s??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");

async function sbGet(key){
  const r = await fetch(`${SUPABASE_URL}/rest/v1/${TABLE}?key=eq.${key}&select=value`,
    { headers:{ apikey:SUPABASE_KEY, Authorization:`Bearer ${SUPABASE_KEY}` } });
  const j = await r.json();
  const raw = j?.[0]?.value;
  if (raw == null) return null;
  return typeof raw === "string" ? JSON.parse(raw) : raw;
}
async function save(){
  const r = await fetch(`${SUPABASE_URL}/rest/v1/${TABLE}`, {
    method:"POST",
    headers:{ apikey:SUPABASE_KEY, Authorization:`Bearer ${SUPABASE_KEY}`, "Content-Type":"application/json", Prefer:"resolution=merge-duplicates" },
    body: JSON.stringify({ key: KEY, value: JSON.stringify(CATS), updated_at: new Date().toISOString() })
  });
  return r.ok;
}

function render(){
  const keys = Object.keys(CATS);
  $("app").innerHTML = `
    <div class="note">
      هذي أصنافك أنت. عدّل الأسماء، احذف اللي ما يناسبك، وأضف أصنافك الخاصة.
      البداية نسخة من تصنيف Lovisa عشان توفّر وقتك.
    </div>

    <div class="row2">
      <button class="btn pr" onclick="addSection()">أضف قسم</button>
      <button class="btn sec2" onclick="resetAll()">رجّع الأصل</button>
    </div>

    ${keys.map(k => {
      const sec = CATS[k];
      const open = openSection === k;
      return `
        <div class="sect">
          <div class="sect-hd">
            <div class="t" onclick="toggle('${k}')">${esc(sec.ar)}</div>
            <span class="c">${sec.sub.length}</span>
            <button class="x" onclick="renameSection('${k}')">✎</button>
            <button class="x" onclick="delSection('${k}')">✕</button>
          </div>
          ${open ? `<div class="sect-body">
            ${sec.sub.map((s,i) => `
              <div class="item">
                <div class="ar">${esc(s)}</div>
                <button class="x" onclick="renameItem('${k}',${i})">✎</button>
                <button class="x" onclick="delItem('${k}',${i})">✕</button>
              </div>`).join("")}
            <button class="add" onclick="addItem('${k}')">أضف صنف لـ${esc(sec.ar)}</button>
          </div>` : ""}
        </div>`;
    }).join("")}

    ${keys.length===0 ? `<div class="empty">ما فيه أقسام.<br>ابدأ بإضافة قسم، أو ارجع للأصل.</div>` : ""}
  `;
}

window.toggle = (k) => { openSection = openSection === k ? null : k; render(); };

window.addSection = async () => {
  const name = prompt("اسم القسم الجديد:");
  if (!name || !name.trim()) return;
  const key = "c_" + Date.now().toString(36);
  CATS[key] = { ar: name.trim(), sub: [] };
  const ok = await save(); toast(ok ? "أُضيف" : "فشل الحفظ"); render();
};

window.renameSection = async (k) => {
  const name = prompt("الاسم الجديد:", CATS[k].ar);
  if (!name || !name.trim()) return;
  CATS[k].ar = name.trim();
  const ok = await save(); toast(ok ? "تم" : "فشل الحفظ"); render();
};

window.delSection = async (k) => {
  if (!confirm(`حذف قسم "${CATS[k].ar}" و${CATS[k].sub.length} صنف معه؟`)) return;
  delete CATS[k];
  if (openSection === k) openSection = null;
  const ok = await save(); toast(ok ? "حُذف" : "فشل الحذف"); render();
};

window.addItem = async (k) => {
  const name = prompt(`أضف صنف لـ${CATS[k].ar}:`);
  if (!name || !name.trim()) return;
  CATS[k].sub.push(name.trim());
  const ok = await save(); toast(ok ? "أُضيف" : "فشل الحفظ"); render();
};

window.renameItem = async (k, i) => {
  const name = prompt("الاسم الجديد:", CATS[k].sub[i]);
  if (!name || !name.trim()) return;
  CATS[k].sub[i] = name.trim();
  const ok = await save(); toast(ok ? "تم" : "فشل الحفظ"); render();
};

window.delItem = async (k, i) => {
  CATS[k].sub.splice(i,1);
  const ok = await save(); toast(ok ? "حُذف" : "فشل الحذف"); render();
};

window.resetAll = async () => {
  if (!confirm("ترجع لتصنيف Lovisa الأصلي؟ كل تعديلاتك بتنمسح.")) return;
  CATS = JSON.parse(JSON.stringify(SEED));
  const ok = await save(); toast(ok ? "رجعت للأصل" : "فشل"); render();
};

async function init(){
  try {
    const saved = await sbGet(KEY);
    CATS = (saved && typeof saved === "object" && Object.keys(saved).length) ? saved : JSON.parse(JSON.stringify(SEED));
    render();
  } catch(e){
    $("app").innerHTML = `<div class="empty">تعذّر التحميل — حدّث الصفحة</div>`;
  }
}
init();
</script>
