function shrink(dataUrl, max=1000, q=0.86){
  return new Promise(res=>{
    const img = new Image();
    img.onload = () => {
      let {width:w, height:h} = img;
      if (w>max || h>max){ if(w>h){h=Math.round(h*max/w);w=max;} else {w=Math.round(w*max/h);h=max;} }
      const cv = document.createElement("canvas"); cv.width=w; cv.height=h;
      cv.getContext("2d").drawImage(img,0,0,w,h);
      res(cv.toDataURL("image/jpeg", q));
    };
    img.onerror = () => res(null);
    img.src = dataUrl;
  });
}
function dataUrlToBlob(d){
  const [meta, b64] = d.split(",");
  const mime = meta.match(/:(.*?);/)[1];
  const bin = atob(b64);
  const arr = new Uint8Array(bin.length);
  for (let i=0;i<bin.length;i++) arr[i] = bin.charCodeAt(i);
  return new Blob([arr], { type:mime });
}

window.pickImages = (k, i) => {

  inp.onchange = () => uploadImages(k, i, inp.files);
  inp.click();
};

async function uploadImages(k, i, files){
  if (!files || !files.length) return;
  toast(`جاري رفع ${files.length} صورة…`);
  let done = 0, failed = 0;
  for (const f of files){
    try {
      const dataUrl = await new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(r.result); r.onerror=rej; r.readAsDataURL(f); });
      const small = await shrink(dataUrl);
      if (!small){ failed++; continue; }
      const blob = dataUrlToBlob(small);
      const id = "cat_" + Date.now().toString(36) + Math.random().toString(36).slice(2,7);
      const fileName = `${id}.jpg`;
      const up = await fetch(`${SUPABASE_URL}/storage/v1/object/${BUCKET}/${fileName}`, {
        method:"POST",
        headers:{ apikey:SUPABASE_KEY, Authorization:`Bearer ${SUPABASE_KEY}`, "Content-Type":"image/jpeg", "x-upsert":"true" },
        body: blob,
      });
      if (!up.ok){ failed++; continue; }
      CATS[k].sub[i].imgs.push(`${SUPABASE_URL}/storage/v1/object/public/${BUCKET}/${fileName}`);
      done++;
    } catch { failed++; }
  }
  if (done){ const ok = await save(); toast(ok ? `أُضيفت ${done} صورة${failed?` · فشل ${failed}`:""}` : "فشل الحفظ"); }
  else toast("فشل رفع الصور");
  render();
}

    fetch(`${SUPABASE_URL}/storage/v1/object/${path}`, { method:"DELETE", headers:{ apikey:SUPABASE_KEY, Authorization:`Bearer ${SUPABASE_KEY}` } }).catch(()=>{});

  toast(ok ? "حُذفت" : "فشل الحذف");
  render();
};

  const ok = await save(); toast(ok ? "رجعت للأصل" : "فشل"); render();
};

// نحوّل الأصناف النصية القديمة لكائنات فيها اسم وصور (توافق مع بياناتك السابقة)
function normalize(cats){
  Object.values(cats).forEach(sec => {
    sec.sub = (sec.sub||[]).map(s =>
      typeof s === "string" ? { n: s, imgs: [] } : { n: s.n || "", imgs: s.imgs || [] }
    );
  });
  return cats;
}


// ─── تصدير PDF: للكل / لقسم / لصنف ───
window.exportPDF = async (scope, k, i) => {
  const { jsPDF } = window.jspdf;
  let groups = [];
  let fileName = "categories";

  if (scope === "item"){
    const s = CATS[k].sub[i];
    groups = [{ title: `${CATS[k].ar} - ${s.n}`, imgs: s.imgs }];
    fileName = s.n;
  } else if (scope === "section"){
    groups = CATS[k].sub.filter(s=>s.imgs.length).map(s => ({ title: `${CATS[k].ar} - ${s.n}`, imgs: s.imgs }));
    fileName = CATS[k].ar;
  } else {
    Object.values(CATS).forEach(sec => sec.sub.filter(s=>s.imgs.length).forEach(s => {
      groups.push({ title: `${sec.ar} - ${s.n}`, imgs: s.imgs });
    }));
    fileName = "كل_الأصناف";
  }

  const total = groups.reduce((n,g)=>n+g.imgs.length,0);
  if (!total){ toast("ما فيه صور للتصدير"); return; }
  toast(`جاري إنشاء PDF (${total} صورة)…`);

  const pdf = new jsPDF({ orientation:"portrait", unit:"mm", format:"a4" });
  const pw = 210, ph = 297, m = 12, gap = 8, cols = 2;
  const cw = (pw - m*2 - gap) / cols;
  const chh = cw * 4/3;   // نسبة 3:4 زي العرض
  let first = true;

  for (const g of groups){
    if (!first) pdf.addPage();
    first = false;
    pdf.setFontSize(13);
    pdf.text(g.title, pw/2, 15, { align:"center" });

    let x = m, y = 24, col = 0;
    for (const url of g.imgs){
      try {
        const dataUrl = await new Promise(res=>{
          const img = new Image();
          img.crossOrigin = "anonymous";
          img.onload = () => {
            const cv = document.createElement("canvas");
            cv.width = img.width; cv.height = img.height;
            cv.getContext("2d").drawImage(img,0,0);
            res(cv.toDataURL("image/jpeg", 0.82));
          };
          img.onerror = () => res(null);
          img.src = url;
        });
        if (!dataUrl) continue;
        if (y + chh > ph - m){ pdf.addPage(); y = m + 6; x = m; col = 0; }
        pdf.addImage(dataUrl, "JPEG", x, y, cw, chh);
        col++;
        if (col >= cols){ col = 0; x = m; y += chh + gap; }
        else x += cw + gap;
      } catch {}
    }
  }
  pdf.save(`${String(fileName).replace(/[^\u0600-\u06FFA-Za-z0-9]/g,"_")}.pdf`);
  toast("نزّل PDF");
};

async function init(){
  try {
    const saved = await sbGet(KEY);
    const base = (saved && typeof saved === "object" && Object.keys(saved).length) ? saved : JSON.parse(JSON.stringify(SEED));
    CATS = normalize(base);
    render();
  } catch(e){
    $("app").innerHTML = `<div class="empty">تعذّر التحميل — حدّث الصفحة</div>`;
  }
}
init();
</script>
