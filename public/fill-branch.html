<script>
const SUPABASE_URL = "https://tvxxprynqeufzlgleurm.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InR2eHhwcnlucWV1ZnpsZ2xldXJtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkwNjk4NTAsImV4cCI6MjA5NDY0NTg1MH0.FfHtUehBX0yjZsuMiE8Z8UP7bE1Ii_RFB5FKT4EJuXk";
const TABLE = "baro_store";
const KEYS = { PRODUCTS:"baro_products_v2", PERIODS:"baro_periods_v2", SETTINGS:"baro_settings_v2", IMAGES:"baro_images_v2" };
const MIN = 12;

async function sbGet(key){
  try{
    const res = await fetch(`${SUPABASE_URL}/rest/v1/${TABLE}?key=eq.${encodeURIComponent(key)}&select=value`,
      { headers:{ apikey:SUPABASE_KEY, Authorization:`Bearer ${SUPABASE_KEY}` }});
    if(!res.ok) return null;
    const rows = await res.json();
    if(!rows?.length) return null;
    return JSON.parse(rows[0].value);
  }catch{ return null; }
}
async function sbSet(key,value){
  try{
    const res = await fetch(`${SUPABASE_URL}/rest/v1/${TABLE}`,{
      method:"POST",
      headers:{ apikey:SUPABASE_KEY, Authorization:`Bearer ${SUPABASE_KEY}`, "Content-Type":"application/json", Prefer:"resolution=merge-duplicates" },
      body: JSON.stringify({ key, value: JSON.stringify(value), updated_at: new Date().toISOString() }),
    });
    return res.ok;
  }catch{ return false; }
}

const num = v => Number(v)||0;
const toDozen = (n,u) => Math.ceil(n/(u||MIN))*(u||MIN);
const fmtN = v => (Number(v)||0).toLocaleString("en-US",{maximumFractionDigits:0});
const getFactoryCode = bc => { const s=String(bc??"").trim(); return s.length<5?s:s.slice(0,5); };

function totalPurchases(p){ return (p.purchases??[]).reduce((s,x)=>s+num(x.qty),0); }
function soldInPeriod(bc, per, branch){
  if(!per?.sales) return 0;
  if(branch) return num(per.sales[branch]?.[bc]?.qty);
  return Object.values(per.sales).reduce((s,bd)=>s+num(bd[bc]?.qty),0);
}
function soldAllPeriods(bc, periods, branch){
  return periods.reduce((s,per)=>s+soldInPeriod(bc,per,branch),0);
}
function allBranches(periods){
  const set=new Set();
  periods.forEach(per=>Object.keys(per.sales??{}).forEach(b=>set.add(b)));
  return [...set].sort();
}
function cityOf(branch, ov={}){
  if(ov[branch]) return ov[branch];
  const parts=String(branch).split("-").map(p=>p.trim());
  if(parts.length>=3) return parts[parts.length-2];
  return "";
}
function getBranchRemaining(branch, bc, periods, overrides={}, minStock=MIN, meta={}){
  const sold=soldAllPeriods(bc,periods,branch);
  const key=branch+"|"+bc;
  const ov=overrides[key];
  if(ov===undefined||ov===null){ const g=Math.ceil(sold/minStock)*minStock; return Math.max(0,g-sold); }
  // ov رقم (متوافق مع النظام القديم). meta[key] فيه نقطة الفترة للخصم التلقائي
  const baseQty = typeof ov==="number" ? num(ov) : num(ov.qty);
  const m = meta[key];
  if(m===undefined||m===null){ return Math.max(0,baseQty); } // بدون نقطة فترة = ثابت
  const atCount = num(m.atPeriodCount);
  const newSold = periods.slice(atCount).reduce((s,per)=>s+soldInPeriod(bc,per,branch),0);
  return Math.max(0,baseQty-newSold);
}

// ─── الحالة ───
let DATA = { products:[], periods:[], settings:{}, images:{} };
let STATE = { target:null, needRem:6, surplusRem:12, priority:"stale", openSrc:{}, edit:null, editVal:"" };

async function boot(){
  try {
    const [products, periods, settings] = await Promise.all([
      sbGet(KEYS.PRODUCTS), sbGet(KEYS.PERIODS), sbGet(KEYS.SETTINGS)
    ]);
    const s = settings ?? {};
    // ترحيل: لو stockOverrides فيها صيغة كائن قديمة {qty,atPeriodCount} → حوّلها لرقم + meta
    // (يحمي النظام الأساسي الذي يتوقّع رقماً)
    if(s.stockOverrides){
      const ov={}, meta={ ...(s.stockMeta??{}) };
      let migrated=false;
      Object.entries(s.stockOverrides).forEach(([k,v])=>{
        if(v && typeof v==="object"){ ov[k]=num(v.qty); meta[k]={ atPeriodCount:num(v.atPeriodCount) }; migrated=true; }
        else ov[k]=v;
      });
      s.stockOverrides=ov; s.stockMeta=meta;
      if(migrated){ try{ await sbSet(KEYS.SETTINGS, s); }catch(e){} }
    }
    DATA = { products:products??[], periods:periods??[], settings:s, images:{} };
    render();
    sbGet(KEYS.IMAGES).then(imgs=>{ if(imgs){ DATA.images=imgs; if(STATE.target) render(); } }).catch(()=>{});
  } catch(e){
    app.innerHTML = `<div class="empty"><div class="ic">⚠️</div><div style="font-size:15px;font-weight:900;color:#fff">خطأ في التحميل</div><div style="font-size:12px;margin-top:6px;color:#94a3b8">${esc(String(e.message||e))}</div></div>`;
  }
}

// ─── حساب التعبئة ───
function fillBranch(targetBranch){
  const { products, periods, settings } = DATA;
  const cityOverrides = settings?.cityOverrides ?? {};
  const newBranches = settings?.newBranches ?? [];
  const stockMeta = settings?.stockMeta ?? {};
  const closed = settings?.closedBranches ?? [];
  const overrides = settings?.stockOverrides ?? {};
  const tCity = cityOf(targetBranch, cityOverrides);
  const { needRem, surplusRem, priority } = STATE;

  const salesByProd = {};
  periods.forEach(per=>{
    Object.entries(per.sales??{}).forEach(([br,d])=>{
      if(closed.includes(br)) return;
      Object.keys(d).forEach(bc=>{
        if(!salesByProd[bc]) salesByProd[bc]={};
        salesByProd[bc][br]=(salesByProd[bc][br]??0)+num(d[bc]?.qty??0);
      });
    });
  });

  const fromSources = {};
  const fromWarehouse = [];
  let needCount = 0;

  products.forEach(p=>{
    const bc=p.barcode;
    const brSales=salesByProd[bc]??{};
    const targetSold=brSales[targetBranch]??0;
    if(targetSold<=0) return;
    const unit=num(p.unitQty)||MIN;
    const targetGiven=toDozen(targetSold,unit);
    const targetRem=getBranchRemaining(targetBranch,bc,periods,overrides,unit,stockMeta);
    if(targetRem>=needRem) return;
    needCount++;
    let needQty=toDozen(Math.max(needRem-targetRem,targetSold),unit);

    const bought=totalPurchases(p);
    let totalGiven=0;
    Object.values(brSales).forEach(s=>{ totalGiven+=toDozen(s,unit); });
    const warehouseStock=Math.max(0,bought-totalGiven);

    const item={ barcode:bc, name:p.name, container:p.container??"", factory:getFactoryCode(bc), targetSold, targetGiven, targetRem, sellPrice:num(p.sellPrice), bought, whStock:warehouseStock };

    const allBr=Object.entries(brSales).filter(([br])=>!closed.includes(br));
    const totalProdSold=allBr.reduce((s,[,sold])=>s+sold,0);
    const avgProdSold=allBr.length>0?totalProdSold/allBr.length:0;
    const candidates=allBr
      .filter(([br])=>br!==targetBranch&&!newBranches.includes(br))
      .map(([br,sold])=>{
        const given=toDozen(sold,unit);
        const rem=getBranchRemaining(br,bc,periods,overrides,unit,stockMeta);
        return { br, sold, given, rem, city:cityOf(br,cityOverrides) };
      })
      .filter(s=>(avgProdSold>0&&s.sold<avgProdSold*0.5&&s.rem>0)||s.rem>=surplusRem)
      .sort((a,b)=>{ const ac=a.city===tCity?0:1, bc2=b.city===tCity?0:1; return ac-bc2||b.rem-a.rem; });

    const takeFromBranch=()=>{
      if(candidates.length===0) return;
      const src=candidates[0];
      const moveQty=Math.min(Math.max(src.rem,unit),needQty);
      if(moveQty>=unit/2){
        const sameCity=src.city===tCity;
        if(!fromSources[src.br]) fromSources[src.br]={ sameCity, city:src.city, items:[] };
        fromSources[src.br].items.push({ ...item, qty:moveQty, srcBranch:src.br, srcGiven:src.given, srcRem:src.rem, srcSold:src.sold, srcStale:avgProdSold>0&&src.sold<avgProdSold*0.5 });
        needQty-=moveQty;
      }
    };
    const takeFromWarehouse=()=>{
      if(warehouseStock>=unit&&needQty>=unit/2){
        const fromWh=Math.min(warehouseStock,needQty);
        fromWarehouse.push({ ...item, qty:fromWh });
        needQty-=fromWh;
      }
    };

    if(warehouseStock>=needQty){ takeFromWarehouse(); }
    else if(priority==="stale"){ takeFromBranch(); takeFromWarehouse(); }
    else { takeFromWarehouse(); if(needQty>=unit/2) takeFromBranch(); }
  });

  const sources=Object.entries(fromSources).map(([br,d])=>({ branch:br, ...d }))
    .sort((a,b)=>(a.sameCity?0:1)-(b.sameCity?0:1)||b.items.length-a.items.length);
  return { sources, fromWarehouse, needCount, tCity };
}

async function saveStock(br, barcode, val){
  const key=br+"|"+barcode;
  const n = Math.max(0, Number(val)||0);
  // عرض فوري — qty رقم (متوافق مع النظام) + meta منفصل
  const localOv={ ...(DATA.settings?.stockOverrides??{}) };
  const localMeta={ ...(DATA.settings?.stockMeta??{}) };
  if(val===""||val===null){ delete localOv[key]; delete localMeta[key]; }
  else { localOv[key]=n; localMeta[key]={ atPeriodCount:DATA.periods.length }; }
  DATA.settings={ ...DATA.settings, stockOverrides:localOv, stockMeta:localMeta };
  STATE.edit=null; STATE.editVal="";
  render();
  // حفظ آمن: نقرأ أحدث settings وندمج
  try {
    const fresh = await sbGet(KEYS.SETTINGS) || DATA.settings;
    const ov = { ...(fresh.stockOverrides??{}) };
    const meta = { ...(fresh.stockMeta??{}) };
    if(val===""||val===null){ delete ov[key]; delete meta[key]; }
    else { ov[key]=n; meta[key]={ atPeriodCount:DATA.periods.length }; }
    const merged = { ...fresh, stockOverrides:ov, stockMeta:meta };
    DATA.settings = merged;
    await sbSet(KEYS.SETTINGS, merged);
  } catch(e){
    await sbSet(KEYS.SETTINGS, DATA.settings);
  }
}

// ─── الطباعة وحفظ الصورة ───

function buildSourceHtml(srcLabel, items, isWh){
  let rows = "";
  items.forEach((m,i)=>{
    const img = DATA.images?.[m.barcode];
    const imgCell = img ? `<img src="${img}" class="pimg">` : `<div class="pnoimg">📦</div>`;
    rows += `<tr><td class="rn">${i+1}</td><td>${imgCell}</td><td class="bc">${m.barcode}</td><td class="nm">${esc(m.name)}</td><td class="fc">${m.factory}</td><td class="q">${m.qty}</td></tr>`;
  });
  const title = isWh
    ? `🏬 نقل من المستودع الرئيسي ← إلى الفرع: ${esc(STATE.target)}`
    : `🔄 نقل من الفرع: ${esc(srcLabel)} ← إلى الفرع: ${esc(STATE.target)}`;
  const d = new Date();
  const ds = `${String(d.getDate()).padStart(2,"0")}/${String(d.getMonth()+1).padStart(2,"0")}/${d.getFullYear()}`;
  return `<div class="phd"><h1>${title}</h1><div class="d">${ds} · ${DATA.settings?.brandName||"البارو"}</div></div>
    <table><thead><tr><th>#</th><th>الصورة</th><th>الباركود</th><th>المنتج</th><th>المصنع</th><th>ينقل</th></tr></thead><tbody>${rows}</tbody></table>`;
}

const PRINT_STYLE = `@import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap');
  *{font-family:'Cairo',sans-serif;box-sizing:border-box;margin:0;padding:0}
  body{padding:18px;padding-top:70px;color:#000;background:#fff}

  .rn{font-weight:900;color:#64748b}
  .bc{font-family:monospace;font-weight:900;font-size:14px}

window.printSource = (srcLabel, isWh)=>{
  const plan = fillBranch(STATE.target);
  const items = isWh ? plan.fromWarehouse : (plan.sources.find(s=>s.branch===srcLabel)?.items||[]);
  if(!items.length) return;
  const win = window.open("","_blank");
  win.document.write(`<!DOCTYPE html><html dir="rtl"><head><meta charset="utf-8"><title>تعبئة ${esc(STATE.target)}</title><style>${PRINT_STYLE}
    @media print{.noprint{display:none}}</style></head><body>
    ${buildSourceHtml(srcLabel, items, isWh)}
    <div class="noprint" style="position:fixed;top:0;left:0;right:0;display:flex;gap:10px;padding:12px;background:#1e3a5f;z-index:999">
    <button onclick="window.close()" style="flex:1;background:#475569;color:#fff;border:none;border-radius:10px;padding:13px;font-size:15px;font-weight:900;font-family:Cairo;cursor:pointer">✕ إغلاق</button>
    <button onclick="window.print()" style="flex:2;background:#16a34a;color:#fff;border:none;border-radius:10px;padding:13px;font-size:15px;font-weight:900;font-family:Cairo;cursor:pointer">🖨️ طباعة</button>
  </div>
    </body></html>`);
  win.document.close();
};

function loadHtml2Canvas(){
  return new Promise((resolve,reject)=>{
    if(window.html2canvas) return resolve(window.html2canvas);
    const s=document.createElement("script");
    s.src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js";
    s.onload=()=>resolve(window.html2canvas); s.onerror=reject;
    document.head.appendChild(s);
  });
}

window.saveSourceImage = async (srcLabel, isWh)=>{
  const plan = fillBranch(STATE.target);
  const items = isWh ? plan.fromWarehouse : (plan.sources.find(s=>s.branch===srcLabel)?.items||[]);
  if(!items.length) return;
  try{
    const h2c = await loadHtml2Canvas();
    const holder = document.createElement("div");
    holder.style.cssText = "position:fixed;left:-9999px;top:0;width:560px;background:#fff;padding:18px";
    holder.innerHTML = `<style>${PRINT_STYLE}</style>${buildSourceHtml(srcLabel, items, isWh)}`;
    document.body.appendChild(holder);
    const canvas = await h2c(holder, { scale:2, backgroundColor:"#fff" });
    document.body.removeChild(holder);
    const fn = `تعبئة-${STATE.target}-${srcLabel}.jpg`.replace(/[^\w\u0600-\u06FF.-]/g,"_");
    const blob = await new Promise(res=>canvas.toBlob(res,"image/jpeg",0.92));
    if(blob && navigator.canShare){
      const file = new File([blob], fn, { type:"image/jpeg" });
      if(navigator.canShare({ files:[file] })){ await navigator.share({ files:[file] }); return; }
    }
    const a = document.createElement("a");
    a.href = blob ? URL.createObjectURL(blob) : canvas.toDataURL("image/jpeg",0.92);
    a.download = fn; a.click();
  }catch(e){ alert("تعذّر حفظ الصورة — استخدم الطباعة"); }
};

// ─── الواجهة ───
const app = document.getElementById("app");

function esc(s){ return String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

function render(){
  if(!STATE.target){ renderPicker(); return; }

}

    return;

  let h = `<div class="hd"><h1>🎯 عبّي فرع</h1><a href="https://baro-inventory-qmpp.vercel.app">النظام ←</a></div>`;

// ─── اعتماد النقل: تم / تراجع ───
// transferred: سجل الدفعات المنفّذة { id: {to, from, items:[{barcode,qty,srcBefore,tgtBefore}], ts} }

window.confirmTransfer = async (srcBranch, isWh)=>{
  if(!confirm(`تأكيد: نقل البضاعة من ${isWh?'المستودع':srcBranch} إلى ${STATE.target}؟\nسيُحدّث المخزون فوراً.`)) return;
  const plan = fillBranch(STATE.target);
  const items = isWh ? plan.fromWarehouse : (plan.sources.find(s=>s.branch===srcBranch)?.items||[]);
  if(!items.length) return;

  // اقرأ أحدث settings
  const fresh = await sbGet(KEYS.SETTINGS) || DATA.settings;
  const ov = { ...(fresh.stockOverrides??{}) };
  const meta = { ...(fresh.stockMeta??{}) };
  const transferred = { ...(fresh.transferred??{}) };
  const periodCount = DATA.periods.length;
  const batchId = (isWh?"WH":srcBranch)+"→"+STATE.target+"|"+Date.now();
  const record = { from:isWh?"__WAREHOUSE__":srcBranch, fromLabel:isWh?"المستودع":srcBranch, to:STATE.target, ts:Date.now(), isWh, items:[] };

  items.forEach(m=>{
    const tgtKey = STATE.target+"|"+m.barcode;
    const tgtBefore = getBranchRemaining(STATE.target, m.barcode, DATA.periods, ov, num(m.unitQty)||MIN, meta);
    // المستقبِل يزيد — qty رقم + meta منفصل
    ov[tgtKey] = tgtBefore + m.qty;
    meta[tgtKey] = { atPeriodCount: periodCount };
    let srcBefore = null;
    if(!isWh){
      const srcKey = srcBranch+"|"+m.barcode;
      srcBefore = getBranchRemaining(srcBranch, m.barcode, DATA.periods, ov, num(m.unitQty)||MIN, meta);
      ov[srcKey] = Math.max(0, srcBefore - m.qty);
      meta[srcKey] = { atPeriodCount: periodCount };
    }
    record.items.push({ barcode:m.barcode, qty:m.qty, srcBefore, tgtBefore });
  });

  transferred[batchId] = record;
  const merged = { ...fresh, stockOverrides:ov, stockMeta:meta, transferred };
  DATA.settings = merged;
  render();
  await sbSet(KEYS.SETTINGS, merged);
};

window.undoTransfer = async (batchId)=>{
  if(!confirm("تراجع عن هذا النقل؟ سيرجع المخزون كما كان.")) return;
  const fresh = await sbGet(KEYS.SETTINGS) || DATA.settings;
  const ov = { ...(fresh.stockOverrides??{}) };
  const meta = { ...(fresh.stockMeta??{}) };
  const transferred = { ...(fresh.transferred??{}) };
  const rec = transferred[batchId];
  if(!rec) return;
  const periodCount = DATA.periods.length;

  rec.items.forEach(it=>{
    const tgtKey = rec.to+"|"+it.barcode;
    ov[tgtKey] = Math.max(0, it.tgtBefore);
    meta[tgtKey] = { atPeriodCount: periodCount };
    if(!rec.isWh && it.srcBefore!==null){
      const srcKey = rec.from+"|"+it.barcode;
      ov[srcKey] = Math.max(0, it.srcBefore);
      meta[srcKey] = { atPeriodCount: periodCount };
    }
  });

  delete transferred[batchId];
  const merged = { ...fresh, stockOverrides:ov, stockMeta:meta, transferred };
  DATA.settings = merged;
  render();
  await sbSet(KEYS.SETTINGS, merged);
};

// هل هذا المصدر منقول؟ يرجّ‍ع batchId أو null
function isTransferred(srcBranch, isWh){
  const transferred = DATA.settings?.transferred ?? {};
  const from = isWh ? "__WAREHOUSE__" : srcBranch;
  const found = Object.entries(transferred).find(([,r])=>r.from===from && r.to===STATE.target);
  return found ? found[0] : null;
}

function itemCard(m, isWh){
  const img = DATA.images?.[m.barcode];
  const imgHtml = img ? `<img src="${img}" alt="">` : `<div class="ph">📦</div>`;
  const sKey = (m.srcBranch||"")+"|"+m.barcode;

  // التعديل — المرسِل فقط (للفروع، مو المستودع)
  let editHtml = "";
  if(!isWh){
    if(STATE.edit===sKey){
      editHtml = `<div class="editbox"><span style="color:#fcd34d">مخزون المرسِل:</span>
        <input type="number" value="${esc(STATE.editVal)}" oninput="onEditInput(this.value)" autofocus style="border-color:#f59e0b">
        <button class="sv" style="background:#f59e0b;color:#0a0804" onclick="doSave('${esc(m.srcBranch).replace(/'/g,"\\'")}','${m.barcode}')">حفظ</button>
        <button class="cx" onclick="cancelEdit()">✕</button></div>`;
    } else {
      editHtml = `<div class="editrow"><button class="ed-amber" onclick="startEdit('${sKey.replace(/'/g,"\\'")}',${m.srcRem})">✏️ عدّل مخزون المرسِل</button></div>`;
    }
  }

  // معلومات المستقبِل
  let info = `<div style="margin-top:6px"><div style="font-size:10px;color:#6ee7b7;font-weight:700;margin-bottom:3px">📥 المستقبِل (${esc(STATE.target)})</div><div class="badges">
    <span class="badge b-amber">باع ${m.targetSold}</span>
    <span class="badge b-blue">أخذ ${m.targetGiven}</span>
    <span class="badge b-gray">باقي ${m.targetRem}</span></div></div>`;
  // معلومات المرسِل (للفروع فقط)
  if(!isWh){
    info += `<div style="margin-top:6px"><div style="font-size:10px;font-weight:700;margin-bottom:3px;color:${m.srcStale?'#fca5a5':'#6ee7b7'}">📤 المرسِل (${esc(m.srcBranch)}) · ${m.srcStale?'🔴 راكد':'🟢 قوي'}</div><div class="badges">
      <span class="badge b-amber">باع ${m.srcSold}</span>
      <span class="badge b-blue">أخذ ${m.srcGiven}</span>
      <span class="badge b-gray">باقي ${m.srcRem}</span></div></div>`;
  }

  return `<div class="item">
    ${imgHtml}
    <div style="flex:1;min-width:0">
      <div class="nm">${esc(m.name)}</div>
      <div class="bc">${m.barcode}</div>
      <div class="fc">🏭 ${m.factory}</div>
      ${info}
      ${editHtml}
      <div style="margin-top:8px;padding-top:8px;border-top:1px solid rgba(255,255,255,0.06)">
        <div style="font-size:10px;color:#c4b5fd;font-weight:700;margin-bottom:3px">🏬 المستودع الرئيسي</div>
        <div class="badges"><span class="badge b-blue">جاء ${m.bought}</span><span class="badge b-purple">باقي ${m.whStock}</span></div>
      </div>
    </div>
    <div class="qty"><div class="n">${m.qty}</div><div class="l">🔄 ينقل</div></div>
  </div>`;
}

function transferBtns(isWh, srcBranch){
  const batchId = isTransferred(srcBranch, isWh);
  if(batchId){
    return `<div style="padding:4px 10px 8px"><div style="display:flex;align-items:center;gap:8px;background:rgba(34,197,94,0.12);border:1px solid rgba(34,197,94,0.4);border-radius:10px;padding:10px">
      <span style="flex:1;color:#6ee7b7;font-size:13px;font-weight:900">✅ تم النقل وتحديث المخزون</span>
      <button onclick="undoTransfer('${batchId.replace(/'/g,"\\'")}')" style="background:#7f1d1d;color:#fca5a5;border:none;border-radius:9px;padding:9px 14px;font-size:12px;font-weight:700;cursor:pointer;font-family:Cairo">↩️ تراجع</button>
    </div></div>`;
  }
  const arg = isWh ? "true" : `'${esc(srcBranch).replace(/'/g,"\\'")}',false`;
  const fn = isWh ? `confirmTransfer('المستودع الرئيسي',true)` : `confirmTransfer('${esc(srcBranch).replace(/'/g,"\\'")}',false)`;
  return `<div style="padding:4px 10px 8px">
    <button onclick="${fn}" style="width:100%;background:#16a34a;color:#fff;border:none;border-radius:10px;padding:12px;font-size:14px;font-weight:900;cursor:pointer;font-family:Cairo">✅ تم النقل (حدّث المخزون)</button>
  </div>`;
}

function renderFill(){
  const plan = fillBranch(STATE.target);
  const tCity = plan.tCity;
  let h = `<button class="back" onclick="back()">← رجوع للفروع</button>`;
  h += `<div class="tgt"><div class="t">🎯 تعبئة: ${esc(STATE.target)}</div>
    ${tCity?`<div class="c">📍 ${esc(tCity)}</div>`:""}
    <div class="n">${plan.needCount} منتج يحتاج تعبئة</div></div>`;

  // أدوات التحكم
  h += `<div class="ctrl">
    <span class="lbl">حد النقص:</span><input type="number" value="${STATE.needRem}" onchange="setNeedRem(this.value)">
    <span class="lbl">فائض المرسِل:</span><input type="number" value="${STATE.surplusRem}" onchange="setSurplusRem(this.value)">
    <button onclick="applyControls()" style="background:#3b82f6;color:#fff;border:none;border-radius:8px;padding:7px 14px;font-weight:900;font-family:Cairo;cursor:pointer">تطبيق</button>
  </div>`;
  // الأولوية
  h += `<div class="prio"><div class="h">الأولوية في السحب:</div><div class="row">
    <button class="${STATE.priority==='stale'?'on':''}" onclick="setPriority('stale')">🔴 الراكد أولاً</button>
    <button class="${STATE.priority==='warehouse'?'on':''}" onclick="setPriority('warehouse')">🏬 المستودع أولاً</button>
  </div></div>`;

  if(plan.sources.length===0 && plan.fromWarehouse.length===0){
    h += `<div class="empty"><div class="ic">✅</div><div style="font-size:15px;font-weight:900;color:#fff">لا يوجد نقص</div><div style="font-size:13px;margin-top:6px">الفرع مكتفٍ — ما يحتاج تعبئة</div></div>`;
    app.innerHTML = h;
    return;
  }

  // أزرار الطباعة — مطابقة للأصل (مستودع + فروع، ثم الكل)
  const whCount = plan.fromWarehouse.length;
  const brCount = plan.sources.reduce((s,x)=>s+x.items.length,0);
  h += `<div class="prnt"><div class="r">
    <button onclick="${whCount?"printPlan('warehouse')":""}" style="background:${whCount?'#1e3a5f':'#334155'};opacity:${whCount?1:0.5}">🏬 اطبع المستودع (${whCount})</button>
    <button onclick="${brCount?"printPlan('branches')":""}" style="background:${brCount?'#475569':'#334155'};opacity:${brCount?1:0.5}">📦 اطبع الفروع (${brCount})</button>
  </div>
    <button onclick="printPlan('all')" style="width:100%;background:transparent;border:1px solid #475569;color:#94a3b8;font-size:12px">🖨️ اطبع الكل معاً</button>
  </div>`;

  // المستودع — قابل للطي زي الأصل
  if(plan.fromWarehouse.length){
    const whOpen = STATE.openSrc.__wh !== false;
    h += `<div class="src" style="border:1px solid #2563eb40"><div class="sh" onclick="toggleSrc('__wh')" style="background:rgba(37,99,235,0.08)">
      <div class="nm">🏬 من المستودع الرئيسي</div>
      <span class="cnt">${plan.fromWarehouse.length} منتج ${whOpen?'▲':'▼'}</span></div>`;
    if(whOpen){
      h += `<div style="display:flex;gap:8px;padding:10px 10px 4px">
        <button onclick="printSource('المستودع الرئيسي',true)" style="flex:1;padding:9px;border-radius:9px;border:1px solid #334155;background:#1e293b;color:#93c5fd;font-size:12px;font-weight:700;cursor:pointer;font-family:Cairo">🖨️ طباعة</button>
        <button onclick="saveSourceImage('المستودع الرئيسي',true)" style="flex:1;padding:9px;border-radius:9px;border:1px solid #334155;background:#1e293b;color:#6ee7b7;font-size:12px;font-weight:700;cursor:pointer;font-family:Cairo">📷 حفظ صورة</button>
      </div>`;
      h += transferBtns(true, "المستودع الرئيسي");
      plan.fromWarehouse.forEach(m=>{ h += itemCard(m, true); });
    }
    h += `</div>`;
  }
  // الفروع
  plan.sources.forEach(s=>{
    const open = STATE.openSrc[s.branch] !== false; // مفتوح افتراضياً
    h += `<div class="src" style="border:1px solid ${s.sameCity?'#16a34a':'#ea580c'}40"><div class="sh" onclick="toggleSrc('${esc(s.branch).replace(/'/g,"\\'")}')">
      <div><div class="nm">📤 المرسِل: ${esc(s.branch)}</div>
      <div class="ci" style="color:${s.sameCity?'#4ade80':'#fb923c'}">${s.sameCity?`✓ نفس المدينة (${esc(s.city||'')})`:`📍 ${esc(s.city||'مدينة أخرى')}`}</div></div>
      <span class="cnt">${s.items.length} ${open?'▲':'▼'}</span></div>`;
    if(open){
      h += `<div style="display:flex;gap:8px;padding:10px 10px 4px">
        <button onclick="printSource('${esc(s.branch).replace(/'/g,"\\'")}',false)" style="flex:1;padding:9px;border-radius:9px;border:1px solid #334155;background:#1e293b;color:#93c5fd;font-size:12px;font-weight:700;cursor:pointer;font-family:Cairo">🖨️ طباعة</button>
        <button onclick="saveSourceImage('${esc(s.branch).replace(/'/g,"\\'")}',false)" style="flex:1;padding:9px;border-radius:9px;border:1px solid #334155;background:#1e293b;color:#6ee7b7;font-size:12px;font-weight:700;cursor:pointer;font-family:Cairo">📷 حفظ صورة</button>
      </div>`;
      h += transferBtns(false, s.branch);
      s.items.forEach(m=>{ h += itemCard(m, false); });
    }
    h += `</div>`;
  });

  app.innerHTML = h;
}

// ─── الطباعة ───
window.printPlan = (mode)=>{
  const plan = fillBranch(STATE.target);
  const showWh = mode==="all"||mode==="warehouse";
  const showBr = mode==="all"||mode==="branches";
  let body = "";

  const section = (title, items, isWh)=>{
    let s = `<div class="psec"><div class="pst">${title}</div><table><thead><tr><th>الصورة</th><th>المنتج</th><th>الباركود</th><th>المصنع</th><th>ينقل</th></tr></thead><tbody>`;
    items.forEach(m=>{
      const img = DATA.images?.[m.barcode];
      s += `<tr><td>${img?`<img src="${img}">`:'📦'}</td><td>${esc(m.name)}</td><td class="mono">${m.barcode}</td><td>${m.factory}</td><td class="q">${m.qty}</td></tr>`;
    });
    s += `</tbody></table></div>`;
    return s;
  };

  if(showWh && plan.fromWarehouse.length){
    body += section(`🏬 نقل من المستودع الرئيسي ← إلى الفرع: ${esc(STATE.target)}`, plan.fromWarehouse, true);
  }
  if(showBr){
    plan.sources.forEach(s=>{
      body += section(`🔄 نقل من الفرع: ${esc(s.branch)} ← إلى الفرع: ${esc(STATE.target)}${s.sameCity?' (نفس المدينة)':''}`, s.items, false);
    });
  }

  const win = window.open("", "_blank");
  win.document.write(`<!DOCTYPE html><html dir="rtl"><head><meta charset="utf-8"><title>بوليصة تعبئة ${esc(STATE.target)}</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap');
    *{font-family:'Cairo',sans-serif;box-sizing:border-box}
    body{padding:20px;padding-top:70px;color:#000}
    .phd{text-align:center;margin-bottom:20px;border-bottom:3px solid #1e3a5f;padding-bottom:12px}
    .phd h1{font-size:24px;color:#1e3a5f}
    .phd .d{font-size:13px;color:#475569;margin-top:4px}
    .psec{margin-bottom:24px;page-break-inside:avoid}
    .pst{background:#1e3a5f;color:#fff;padding:10px 14px;border-radius:8px;font-size:15px;font-weight:900;margin-bottom:8px}
    table{width:100%;border-collapse:collapse}
    th{background:#475569;color:#fff;padding:8px;font-size:12px}
    td{border:1px solid #cbd5e1;padding:8px;font-size:13px;text-align:center}
    td img{width:46px;height:46px;object-fit:cover;border-radius:6px}
    .mono{font-family:monospace;font-weight:900;font-size:14px}
    .q{font-size:18px;font-weight:900;color:#1e3a5f}
    @media print{.noprint{display:none}}
  </style></head><body>
  <div class="phd"><h1>🎯 بوليصة تعبئة فرع: ${esc(STATE.target)}</h1><div class="d">${new Date().toLocaleDateString("ar-SA")} · ${DATA.settings?.brandName||"البارو"}</div></div>
  ${body}
  <div class="noprint" style="position:fixed;top:0;left:0;right:0;display:flex;gap:10px;padding:12px;background:#1e3a5f;z-index:999">
    <button onclick="window.close()" style="flex:1;background:#475569;color:#fff;border:none;border-radius:10px;padding:13px;font-size:15px;font-weight:900;font-family:Cairo;cursor:pointer">✕ إغلاق</button>
    <button onclick="window.print()" style="flex:2;background:#16a34a;color:#fff;border:none;border-radius:10px;padding:13px;font-size:15px;font-weight:900;font-family:Cairo;cursor:pointer">🖨️ طباعة</button>
  </div>
  </body></html>`);
  win.document.close();
};
