<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>روابط جرد الفروع — ALBAROO</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap');
  *{font-family:'Cairo',sans-serif;box-sizing:border-box;margin:0;padding:0}
  body{background:#0a0e1a;color:#e8eef7;padding:14px;max-width:620px;margin:0 auto;padding-bottom:40px}
  h1{font-size:20px;color:#fff}
  .sub{font-size:12px;color:#5b9bd5;margin-bottom:14px}
  .loading{text-align:center;padding:60px;color:#5b9bd5}
  .spin{font-size:32px;animation:s 1s linear infinite;display:inline-block}@keyframes s{to{transform:rotate(360deg)}}
  .hint{background:rgba(91,155,213,0.08);border:1px solid rgba(91,155,213,0.2);border-radius:10px;padding:11px 13px;font-size:12px;color:#7cb3e8;margin-bottom:14px;line-height:1.7}
  .search{width:100%;background:#1a2236;border:1px solid #2d3a52;color:#fff;border-radius:12px;padding:12px 15px;font-size:15px;font-family:'Cairo';margin-bottom:12px}
  .card{background:#141b2d;border:1px solid #1f2940;border-radius:12px;padding:13px;margin-bottom:9px}
  .card.closed{opacity:0.6;border-color:rgba(248,113,113,0.3)}
  .cardh{display:flex;align-items:center;justify-content:space-between;margin-bottom:9px}
  .cardh .nm{font-weight:900;font-size:15px;color:#fff}
  .cardh .cnt{font-size:11px;color:#5b6b85}
  .closedBadge{background:rgba(248,113,113,0.15);color:#f87171;font-size:10px;font-weight:900;padding:2px 8px;border-radius:100px}
  .link{background:#0f1626;border:1px solid #2d3a52;border-radius:8px;padding:8px 10px;font-family:monospace;font-size:11px;color:#94a3b8;word-break:break-all;margin-bottom:8px;line-height:1.5}
  .btns{display:flex;gap:7px}
  .btns button{flex:1;border:none;border-radius:9px;padding:9px;font-size:13px;font-weight:900;font-family:'Cairo';cursor:pointer}
  .copy{background:#2563eb;color:#fff}
  .wa{background:#16a34a;color:#fff}
  .open{background:#7c3aed;color:#fff}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#16a34a;color:#fff;padding:12px 24px;border-radius:100px;font-weight:900;z-index:99;opacity:0;transition:opacity 0.3s}
  .toast.show{opacity:1}
  .empty{text-align:center;padding:40px;color:#5b6b85}
</style>
</head>
<body>
<div id="app"><div class="loading"><span class="spin">⏳</span></div></div>
<div class="toast" id="toast"></div>

<script>
const SUPABASE_URL = "https://tvxxprynqeufzlgleurm.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InR2eHhwcnlucWV1ZnpsZ2xldXJtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkwNjk4NTAsImV4cCI6MjA5NDY0NTg1MH0.FfHtUehBX0yjZsuMiE8Z8UP7bE1Ii_RFB5FKT4EJuXk";
const TABLE = "baro_store";
// رابط صفحة جرد الفرع (نفس الدومين)
const BASE = "https://baro-inventory-qmpp.vercel.app/warehouse-branch.html";
const num = v => { const n = parseFloat(v); return isNaN(n)?0:n; };

let PERIODS = [], SETTINGS = {};
let searchTerm = "";

async function load(key){
  const r = await fetch(`${SUPABASE_URL}/rest/v1/${TABLE}?key=eq.${key}&select=value`,
    { headers:{ apikey:SUPABASE_KEY, Authorization:`Bearer ${SUPABASE_KEY}` } });
  const j = await r.json();
  const raw = j?.[0]?.value;
  if (raw == null) return null;
  if (typeof raw === "string"){ try { return JSON.parse(raw); } catch { return null; } }
  return raw;
}
function showToast(msg){ const t=document.getElementById("toast"); t.textContent=msg; t.classList.add("show"); setTimeout(()=>t.classList.remove("show"),2000); }

function branchLink(branch){ return BASE + "?branch=" + encodeURIComponent(branch); }

function copyLink(branch){
  const link = branchLink(branch);
  const done = ()=>showToast("نُسخ رابط "+branch+" ✓");
  if (navigator.clipboard?.writeText){
    navigator.clipboard.writeText(link).then(done).catch(()=>fallback(link,done));
  } else fallback(link,done);
}
function fallback(txt,done){
  const ta=document.createElement("textarea"); ta.value=txt; document.body.appendChild(ta); ta.select();
  try{ document.execCommand("copy"); done(); }catch{} ta.remove();
}
function shareWA(branch){
  const link = branchLink(branch);
  const msg = `رابط جرد فرع ${branch}:\n${link}\n\nافتح الرابط، اكتب اسمك، وحدّث الكميات الفعلية.`;
  window.open("https://wa.me/?text="+encodeURIComponent(msg), "_blank");
}
function openLink(branch){
  window.open(branchLink(branch), "_blank");
}

async function init(){
  try {
    const [pers, sett] = await Promise.all([ load("baro_periods_v2"), load("baro_settings_v2") ]);
    PERIODS = pers ?? []; SETTINGS = sett ?? {};
  } catch(e){
    document.getElementById("app").innerHTML = `<div class="empty">تعذّر الاتصال — حدّث الصفحة</div>`;
    return;
  }
  render();
}

// كل الفروع اللي لها مبيعات
function allBranches(){
  const set = new Set();
  PERIODS.forEach(per => Object.keys(per.sales??{}).forEach(b=>{ if(b && b.trim()) set.add(b); }));
  return [...set].sort();
}

function render(){
  const app = document.getElementById("app");
  const closed = SETTINGS?.closedBranches ?? [];
  let branches = allBranches();
  const q = searchTerm.trim().toLowerCase();
  if (q) branches = branches.filter(b => b.toLowerCase().includes(q));

  app.innerHTML = `
    <h1>🔗 روابط جرد الفروع</h1>
    <div class="sub">ALBAROO · رابط جاهز لكل فرع</div>
    <div class="hint">كل فرع له رابط خاص. انسخه أو أرسله واتساب لموظف الفرع. الموظف يفتحه، يكتب اسمه، ويحدّث الكميات الفعلية. النتيجة تظهر لك في المستودع → تبويب الجرد.</div>
    <input class="search" placeholder="🔍 ابحث عن فرع…" value="${searchTerm}" oninput="onSearch(this.value)" />
    <div style="font-size:12px;color:#5b6b85;margin-bottom:10px">🏪 ${branches.length} فرع</div>
    <div id="list">${
      branches.length===0
        ? `<div class="empty">${q?`لا فرع بـ "${q}"`:"لا فروع"}</div>`
        : branches.map(b=>{
            const isClosed = closed.includes(b);
            const link = branchLink(b);
            const safeB = b.replace(/'/g,"\\'");
            return `<div class="card${isClosed?' closed':''}">
              <div class="cardh">
                <div class="nm">🏪 ${b}</div>
                ${isClosed?`<span class="closedBadge">مقفل</span>`:''}
              </div>
              <div class="link">${link}</div>
              <div class="btns">
                <button class="copy" onclick="copyLink('${safeB}')">📋 نسخ</button>
                <a class="wa" href="https://wa.me/?text=${encodeURIComponent('رابط جرد فرع '+b+':\n'+link+'\n\nافتح الرابط، اكتب اسمك، وحدّث الكميات الفعلية.')}" target="_blank" rel="noopener" style="flex:1;background:#16a34a;color:#fff;border:none;border-radius:9px;padding:9px;font-size:13px;font-weight:900;font-family:'Cairo';cursor:pointer;text-decoration:none;display:flex;align-items:center;justify-content:center">💬 واتساب</a>
                <a class="open" href="${link}" target="_blank" rel="noopener" style="flex:1;background:#7c3aed;color:#fff;border:none;border-radius:9px;padding:9px;font-size:13px;font-weight:900;font-family:'Cairo';cursor:pointer;text-decoration:none;display:flex;align-items:center;justify-content:center">🔗 فتح</a>
              </div>
            </div>`;
          }).join("")
    }</div>`;
}
function onSearch(v){ searchTerm = v; render(); }

init();
</script>
</body>
</html>
