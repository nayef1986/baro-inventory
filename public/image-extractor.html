// نحوّل نص PEM لمفتاح تشفير يفهمه المتصفح
async function importGooglePrivateKey(pem){
  const clean = pem.replace(/-----BEGIN PRIVATE KEY-----/,"").replace(/-----END PRIVATE KEY-----/,"").replace(/\s+/g,"");
  const binary = Uint8Array.from(atob(clean), c => c.charCodeAt(0));
  return crypto.subtle.importKey("pkcs8", binary.buffer, { name:"RSASSA-PKCS1-v1_5", hash:"SHA-256" }, false, ["sign"]);
}
function base64url(input){
  let b64;
  if (typeof input === "string") b64 = btoa(unescape(encodeURIComponent(input)));
  else b64 = btoa(String.fromCharCode(...new Uint8Array(input)));
  return b64.replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
}
// نبني ونوقّع JWT — بديل تسجيل الدخول اليدوي، يثبت هويتنا لجوجل تلقائياً
async function buildGoogleJWT(sa){
  const now = Math.floor(Date.now()/1000);
  const header = { alg:"RS256", typ:"JWT" };
  const claims = { iss: sa.client_email, scope:"https://www.googleapis.com/auth/drive.file",
    aud:"https://oauth2.googleapis.com/token", exp: now+3600, iat: now };
  const signInput = `${base64url(JSON.stringify(header))}.${base64url(JSON.stringify(claims))}`;
  const key = await importGooglePrivateKey(sa.private_key);
  const sig = await crypto.subtle.sign({name:"RSASSA-PKCS1-v1_5"}, key, new TextEncoder().encode(signInput));
  return `${signInput}.${base64url(sig)}`;
}
// نستبدل الـJWT بتوكن دخول فعلي صالح لمدة ساعة
let _driveTokenCache = null, _driveTokenExpiry = 0;
async function getGoogleAccessToken(){
  if (_driveTokenCache && Date.now() < _driveTokenExpiry) return _driveTokenCache;
  const jwt = await buildGoogleJWT(GOOGLE_SERVICE_ACCOUNT);
  const res = await fetch("https://oauth2.googleapis.com/token", {
    method:"POST", headers:{ "Content-Type":"application/x-www-form-urlencoded" },
    body: new URLSearchParams({ grant_type:"urn:ietf:params:oauth:grant-type:jwt-bearer", assertion: jwt })
  });
  if (!res.ok) throw new Error("فشل الحصول على إذن دخول جوجل: " + (await res.text()).slice(0,150));
  const data = await res.json();
  _driveTokenCache = data.access_token;
  _driveTokenExpiry = Date.now() + (data.expires_in-60)*1000; // نجدّده قبل ما ينتهي بدقيقة
  return _driveTokenCache;
}

    method:"POST",
    headers:{ Authorization:`Bearer ${accessToken}`, "Content-Type":`multipart/related; boundary=${boundary}` },
    body
  });
  if (!res.ok) throw new Error("فشل رفع الصورة: " + (await res.text()).slice(0,150));
  return res.json(); // {id, ...}
}

// ═══ قراءة فاتورة المشتريات — نفس منطق parsePurchaseFile بالنظام الأساسي بالضبط ═══
function cleanBarcode(raw){
  if (raw instanceof Date) return "X" + raw.getTime().toString(36).toUpperCase();
  let s = String(raw ?? "").trim().replace(/了/g,"B").replace(/\s+/g,"");
  if (/^\d{4}-\d{2}-\d{2}/.test(s) || /\d{2}:\d{2}:\d{2}/.test(s)) s = "X" + s.replace(/[^0-9]/g,"").slice(0,12);
  return s.replace(/[^A-Za-z0-9\-]/g,"");
}
function toNum(raw){ const n = parseFloat(String(raw ?? "").replace(/,/g,"")); return isNaN(n) ? 0 : n; }

function parsePurchaseItems(buf){
  const wb = XLSX.read(buf, { type:"array" });
  const ws = wb.Sheets[wb.SheetNames[0]];
  const rows = XLSX.utils.sheet_to_json(ws, { header:1, defval:"" });
  let container = "";
  if (rows.length){
    const m = rows[0].join(" ").match(/BAR[A-Z0-9]+/i);
    if (m) container = m[0].toUpperCase();
  }
  const merged = {};
  for (let i=2; i<rows.length; i++){
    const row = rows[i];
    const barcodeStr = cleanBarcode(row[1]);
    const nameStr = String(row[2] ?? "").trim();
    if (!barcodeStr || barcodeStr.toLowerCase()==="item no") continue;
    if (!nameStr || nameStr.toLowerCase()==="name") continue;
    if (nameStr.toLowerCase()==="freight") continue;
    if (nameStr==="الإجمالي" || nameStr==="Total") continue;
    const qty = parseInt(row[3]);
    if (isNaN(qty) || qty<=0) continue;
    const buyPrice = toNum(row[4]);
    const sellPrice = toNum(row[0]);
    if (merged[barcodeStr]){
      merged[barcodeStr].qty += qty;
      if (buyPrice>0) merged[barcodeStr].buyPrice = buyPrice;
      if (sellPrice>0) merged[barcodeStr].sellPrice = sellPrice;
    } else {
      merged[barcodeStr] = { barcode:barcodeStr, name:nameStr, qty, buyPrice, sellPrice, container };
    }
  }
  return { items: Object.values(merged), container };
}

// نفس منطق applyPurchases بالنظام الأساسي — يدمج فوق منتجات موجودة أو يضيف جديدة
function applyPurchasesLocal(existingProducts, newItems, container){
  const result = existingProducts.map(p => ({ ...p }));
  const resultMap = {};
  result.forEach(p => { resultMap[p.barcode] = p; });
  const date = new Date().toISOString().slice(0,10);
  newItems.forEach(item => {
    if (resultMap[item.barcode]){
      const existing = resultMap[item.barcode];
      existing.purchases = existing.purchases ?? [];
      existing.purchases.push({ container, qty:item.qty, buyPrice:item.buyPrice, date });
      if (item.sellPrice>0) existing.sellPrice = item.sellPrice;
    } else {
      const newProduct = { barcode:item.barcode, name:item.name, sellPrice:item.sellPrice,
        container:item.container||container, purchases:[{ container, qty:item.qty, buyPrice:item.buyPrice, date }] };
      result.push(newProduct);
      resultMap[item.barcode] = newProduct;
    }
  });
  return result;
}

// حفظ آمن: نجيب أحدث نسخة من المنتجات مباشرة قبل الدمج (يمنع الكتابة فوق تغييرات صفحات ثانية)

// جودة عالية (Storage يتحمّل) — 800px واضحة وحادة
function shrink(dataUrl, max=800, q=0.85){
  return new Promise(res=>{
    const img=new Image();
    img.onload=()=>{
      let {width:w,height:h}=img;
      if(w>max||h>max){ if(w>h){h=Math.round(h*max/w);w=max;}else{w=Math.round(w*max/h);h=max;} }
      const c=document.createElement("canvas"); c.width=w; c.height=h;
      c.getContext("2d").drawImage(img,0,0,w,h);
      res(c.toDataURL("image/jpeg",q));
    };
    img.onerror=()=>res(null);
    img.src=dataUrl;
  });
}

// يدمج عدة صور بجانب بعض أفقياً (يمين ليسار) في صورة واحدة —
// للمنتج المكوّن من قطعتين أو أكثر بنفس الباركود
function mergeSideBySide(dataUrls, q=0.85){
  return new Promise(res=>{
    if (dataUrls.length === 1){ res(dataUrls[0]); return; }
    const imgs = [];
    let loaded = 0;
    dataUrls.forEach((url, i) => {
      const img = new Image();
      img.onload = () => {
        imgs[i] = img;
        loaded++;
        if (loaded === dataUrls.length) draw();
      };
      img.onerror = () => { loaded++; if (loaded === dataUrls.length) draw(); };
      img.src = url;
    });
    function draw(){
      const valid = imgs.filter(Boolean);
      if (valid.length === 0){ res(null); return; }
      if (valid.length === 1){ res(dataUrls[0]); return; }
      // نوحّد ارتفاع كل الصور على أطول وحدة، عشان تترصّ بشكل مرتّب
      const targetH = Math.max(...valid.map(im=>im.height));
      const widths = valid.map(im => Math.round(im.width * targetH / im.height));
      const gap = 4; // فاصل بسيط بين الصور
      const totalW = widths.reduce((s,w)=>s+w,0) + gap*(valid.length-1);
      const c = document.createElement("canvas");
      c.width = totalW; c.height = targetH;
      const ctx = c.getContext("2d");
      ctx.fillStyle = "#ffffff"; ctx.fillRect(0,0,totalW,targetH);
      let x = 0;
      valid.forEach((im,i)=>{
        ctx.drawImage(im, x, 0, widths[i], targetH);
        x += widths[i] + gap;
      });
      res(c.toDataURL("image/jpeg", q));
    }
  });
}

    const anchors = dxml.split(/<xdr:twoCellAnchor/).slice(1);

    anchors.forEach(a=>{

      const rowToM   = a.match(/<xdr:to>[\s\S]*?<xdr:row>(\d+)<\/xdr:row>/);
      const embM = a.match(/r:embed="(rId\d+)"/);
      if(rowFromM && embM){
        const rowFrom = parseInt(rowFromM[1]) + 1;
        const rowTo   = rowToM ? Math.max(rowFrom, parseInt(rowToM[1]) + 1) : rowFrom;
        imgAnchors.push({ rowFrom, rowTo, media: relMap[embM[1]] });
      }
    });
    log(`صور بمواقع: ${imgAnchors.length}`,"info");

    // 5) نربط كل صورة بكل الباركودات داخل نطاقها (صورة ممدودة على كذا صف تاخذها الكل)
    // نجمّع أول (بدل ما نستبدل عند التكرار) — عشان لو نفس الباركود له كذا صورة (منتج مركّب)
    const imagesByBarcode = {}; // باركود → [صورة1, صورة2, ...]
    for(const ia of imgAnchors){
      let bcs = [];
      for(let r=ia.rowFrom; r<=ia.rowTo; r++){ if(rowBarcode[r]) bcs.push(rowBarcode[r]); }
      // لو النطاق ما فيه باركود (صورة نقطة بلا "إلى" صحيح)، رجوع لطريقة التقريب (±2 صف)
      if(bcs.length===0){
        let bc = rowBarcode[ia.rowFrom];
        if(!bc){ for(let d=1;d<=2;d++){ if(rowBarcode[ia.rowFrom+d]){bc=rowBarcode[ia.rowFrom+d];break;} if(rowBarcode[ia.rowFrom-d]){bc=rowBarcode[ia.rowFrom-d];break;} } }
        if(bc) bcs = [bc];
      }
      if(bcs.length===0) continue;
      if(!ia.media || !zip.files[ia.media]) continue;
      const blob = await zip.files[ia.media].async("base64");
      const ext = ia.media.split(".").pop();
      const small = await shrink(`data:image/${ext};base64,${blob}`);
      if(small){
        bcs.forEach(bc=>{
          if(!imagesByBarcode[bc]) imagesByBarcode[bc] = [];
          imagesByBarcode[bc].push(small);
        });
      }
    }
    // 6) لو الباركود له أكثر من صورة (منتج مركّب من قطعتين أو أكثر)، ندمجهم جنب بعض
    matched = [];
    let mergedCount = 0;
    for(const bc in imagesByBarcode){
      const imgs = imagesByBarcode[bc];
      const finalImg = imgs.length > 1 ? await mergeSideBySide(imgs) : imgs[0];
      if (imgs.length > 1) mergedCount++;
      if (finalImg) matched.push({ barcode: bc, name:"", img: finalImg });
    }
    if (mergedCount > 0) log(`تم دمج ${mergedCount} منتج له أكثر من صورة (جنب بعض)`,"info");
    log(`تم ربط ${matched.length} صورة بباركودها (بالموقع) ✓`,"ok");
    if(matched.length===0){ log("لم يُربط شي — أرسل تشخيص جديد","err"); return; }

    // معاينة أول 30
    $("preview").innerHTML = matched.slice(0,30).map(m=>`
      <div class="row"><img src="${m.img}"/><div><div class="nm">${m.name||"—"}</div><div class="bc">${m.barcode}</div></div></div>`).join("")
      + (matched.length>30?`<div style="text-align:center;color:#888;font-size:12px">و ${matched.length-30} أكثر…</div>`:"");
    $("previewCard").style.display = "block";

  } catch(err){ log("خطأ: "+err.message,"err"); }
};

// تحويل dataURL لـ blob
function dataUrlToBlob(dataUrl){
  const [head, b64] = dataUrl.split(",");
  const mime = head.match(/:(.*?);/)[1];
  const bin = atob(b64);
  const arr = new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) arr[i]=bin.charCodeAt(i);
  return new Blob([arr], {type:mime});
}


$("saveBtn").onclick = async () => {
  if(matched.length===0) return;
  if (GOOGLE_DRIVE_FOLDER_ID === "ضع_ID_المجلد_هنا"){
    log("⚠️ لازم تحط ID المجلد أول بأعلى الكود (GOOGLE_DRIVE_FOLDER_ID)","err");
    return;
  }
  log(`جاري تسجيل الدخول لجوجل درايف…`,"info");
  let accessToken;
  try { accessToken = await getGoogleAccessToken(); }
  catch(e){ log("فشل الاتصال بجوجل: "+e.message,"err"); return; }

  log(`جاري رفع ${matched.length} صورة لجوجل درايف…`,"info");
  let done=0, failed=0;
  const urls = {}; // باركود → رابط الصورة

  for(const m of matched){
    try {
      const blob = dataUrlToBlob(m.img);
      const safeName = m.barcode.replace(/[^A-Za-z0-9]/g,"_") + ".jpg";
      const file = await driveUploadImage(accessToken, safeName, blob);
      await driveMakePublic(accessToken, file.id);
      urls[m.barcode] = driveDirectImageUrl(file.id);
      done++;
    } catch { failed++; }
    if((done+failed)%25===0) log(`تقدّم: ${done+failed}/${matched.length}`,"info");
  }
  log(`رُفع ${done} · فشل ${failed}`,"ok");

  // نحفظ الروابط في النظام (نص صغير — ما يثقّل)
  try {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/${TABLE}?key=eq.${IMAGES_KEY}&select=value`,
      { headers:{ apikey:SUPABASE_KEY, Authorization:`Bearer ${SUPABASE_KEY}` } });
    const rows = await res.json();
    let images = {};
    if(rows?.length){ try{ images = JSON.parse(rows[0].value); }catch{} }
    Object.assign(images, urls); // نضيف/نحدّث الروابط
    const save = await fetch(`${SUPABASE_URL}/rest/v1/${TABLE}`, {
      method:"POST",
      headers:{ apikey:SUPABASE_KEY, Authorization:`Bearer ${SUPABASE_KEY}`, "Content-Type":"application/json", Prefer:"resolution=merge-duplicates" },
      body: JSON.stringify({ key:IMAGES_KEY, value:JSON.stringify(images), updated_at:new Date().toISOString() })
    });
    if(save.ok) log(`✅ الصور: ${done} صورة في جوجل درايف + روابطها بالنظام`,"ok");
    else { log("رُفعت الصور بس فشل حفظ الروابط","err"); return; }
  } catch(err){ log("خطأ بحفظ الروابط: "+err.message,"err"); return; }

  // ═══ الخطوة الثانية: حفظ نفس الملف كفاتورة مشتريات ═══
  if (!lastBuf){ log("⚠️ ما قدرت ألقى الملف لقراءة المشتريات — أعد رفع الملف","err"); return; }
  log("جاري قراءة فاتورة المشتريات من نفس الملف…","info");
  try {
    const { items, container } = parsePurchaseItems(lastBuf);
    if (items.length === 0){ log("⚠️ ما لقيت أصناف صالحة للمشتريات بالملف","err"); return; }
    const totalQty = items.reduce((s,x)=>s+x.qty,0);
    log(`جاري حفظ ${items.length} صنف (${totalQty} قطعة) كفاتورة مشتريات — كونتينر: ${container||"غير محدد"}…`,"info");
    const ok = await saveAsPurchases(items, container);
    if (ok) log(`✅ المشتريات: تم حفظ ${items.length} صنف بنجاح. افتح النظام وحدّث`,"ok");
    else log("❌ فشل حفظ فاتورة المشتريات","err");
  } catch(err){ log("خطأ بقراءة/حفظ المشتريات: "+err.message,"err"); }
};
