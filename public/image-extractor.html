<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>أداة استخراج صور المنتجات — البارو</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap');
  *{font-family:'Cairo',sans-serif;box-sizing:border-box;margin:0;padding:0}
  body{background:#0a0804;color:#f0e6d0;padding:16px;max-width:480px;margin:0 auto}
  h1{font-size:20px;color:#fff;margin-bottom:4px}
  .sub{font-size:12px;color:#d4a853;margin-bottom:16px}
  .card{background:rgba(255,255,255,0.04);border:1px solid rgba(212,168,83,0.2);border-radius:16px;padding:16px;margin-bottom:14px}
  .drop{border:2px dashed #d4a853;border-radius:14px;padding:30px;text-align:center;cursor:pointer}
  .drop input{display:none}
  .btn{width:100%;padding:13px;border:none;border-radius:13px;background:linear-gradient(135deg,#d4a853,#b8935a);color:#0a0804;font-size:14px;font-weight:900;cursor:pointer;font-family:'Cairo';margin-top:10px}
  .btn:disabled{opacity:0.5}
  .btn2{background:linear-gradient(135deg,#8aab8e,#6f9173)}
  .row{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,0.04);border-radius:10px;padding:8px;margin-bottom:6px}
  .row img{width:48px;height:48px;object-fit:cover;border-radius:8px}
  .row .bc{font-family:monospace;font-size:12px;color:#d4a853}
  .row .nm{font-size:12px;color:#fff}
  .log{font-size:12px;padding:8px;border-radius:8px;margin-bottom:4px}
  .ok{background:rgba(34,197,94,0.15);color:#22c55e}
  .err{background:rgba(232,133,90,0.15);color:#e8855a}
  .info{background:rgba(96,165,250,0.15);color:#60a5fa}
  .prog{height:8px;background:rgba(255,255,255,0.1);border-radius:100px;overflow:hidden;margin:10px 0}
  .prog div{height:100%;background:#d4a853;transition:width 0.3s}
</style>
</head>
<body>
<h1>📷 أداة استخراج صور المنتجات</h1>
<div class="sub">ترفع ملف الفاتورة بالصور · تستخرج وتربط بالنظام · ALBAROO</div>

<div class="card">
  <label class="drop">
    <div style="font-size:36px">📊</div>
    <div style="font-weight:700;margin-top:8px" id="fname">اختر ملف Excel (بالصور)</div>
    <div style="font-size:11px;color:#888;margin-top:4px">نفس فاتورة المشتريات + عمود الصور</div>
    <input type="file" id="file" accept=".xlsx">
  </label>
</div>

<div id="status"></div>

<div class="card" id="previewCard" style="display:none">
  <div style="font-weight:900;color:#fff;margin-bottom:10px">معاينة الربط (تأكد قبل الحفظ)</div>
  <div id="preview"></div>
  <button class="btn btn2" id="saveBtn">💾 احفظ الكل في النظام</button>
</div>

<script>
const SUPABASE_URL = "https://tvxxprynqeufzlgleurm.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InR2eHhwcnlucWV1ZnpsZ2xldXJtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkwNjk4NTAsImV4cCI6MjA5NDY0NTg1MH0.FfHtUehBX0yjZsuMiE8Z8UP7bE1Ii_RFB5FKT4EJuXk";
const TABLE = "baro_store";
const IMAGES_KEY = "baro_images_v2";

let matched = [];

const $ = id => document.getElementById(id);
function log(msg, type="info"){ const d=document.createElement("div"); d.className="log "+type; d.textContent=msg; $("status").appendChild(d); }

// تصغير قوي (صورة واضحة بس خفيفة جداً ~6KB)
function shrink(dataUrl, max=200, q=0.5){
  return new Promise(res=>{
    const img=new Image();
    img.onload=()=>{
      let {width:w,height:h}=img;
      if(w>max||h>max){ if(w>h){h=Math.round(h*max/w);w=max;}else{w=Math.round(w*max/h);h=max;} }
      const c=document.createElement("canvas"); c.width=w; c.height=h;
      c.getContext("2d").drawImage(img,0,0,w,h);
      res(c.toDataURL("image/jpeg",q));
    };
    img.onerror=()=>res(null);
    img.src=dataUrl;
  });
}

$("file").onchange = async (e) => {
  const f = e.target.files[0];
  if(!f) return;
  $("fname").textContent = f.name;
  $("status").innerHTML = "";
  $("previewCard").style.display = "none";
  log("جاري فتح الملف…","info");

  try {
    const buf = await f.arrayBuffer();
    const zip = await JSZip.loadAsync(buf);

    // 1) نقرأ sharedStrings (النصوص) و sheet1
    const sheetXml = await zip.file(/xl\/worksheets\/sheet1\.xml/i)?.[0]?.async("string")
      ?? await (Object.keys(zip.files).find(n=>/xl\/worksheets\/sheet1\.xml/i.test(n)) ? zip.files[Object.keys(zip.files).find(n=>/xl\/worksheets\/sheet1\.xml/i.test(n))].async("string") : null);

    // 2) نطلّع الصور من xl/media بالترتيب
    const mediaNames = Object.keys(zip.files).filter(n=>/xl\/media\/image/i.test(n))
      .sort((a,b)=>{
        const na=parseInt(a.match(/image(\d+)/i)?.[1]??0);
        const nb=parseInt(b.match(/image(\d+)/i)?.[1]??0);
        return na-nb;
      });
    log(`عدد الصور في الملف: ${mediaNames.length}`,"info");

    // 3) نقرأ الباركودات من الشيت (sharedStrings)
    const ssFile = Object.keys(zip.files).find(n=>/xl\/sharedStrings\.xml/i.test(n));
    let strings = [];
    if(ssFile){
      const ss = await zip.files[ssFile].async("string");
      strings = [...ss.matchAll(/<t[^>]*>([^<]*)<\/t>/g)].map(m=>m[1]);
    }
    // نطلّع الباركودات + الاسم اللي بعده (الاسم عمود مجاور للباركود)
    const items = [];
    for(let i=0;i<strings.length;i++){
      const s = strings[i];
      if(/^\d{8}B\d{3}$/.test(s) || /^\d{12,13}$/.test(s)){
        // الاسم: النص التالي اللي مو باركود ولا رقم
        let nm = "";
        for(let j=i+1;j<Math.min(i+4,strings.length);j++){
          const t = strings[j];
          if(!/^\d{8}B\d{3}$/.test(t) && !/^\d{12,13}$/.test(t) && !/^\d+(\.\d+)?$/.test(t) && t.trim()){ nm=t.trim(); break; }
        }
        items.push({ barcode:s, name:nm });
      }
    }
    const barcodes = items.map(x=>x.barcode);
    log(`عدد الباركودات: ${barcodes.length}`,"info");

    if(mediaNames.length===0){ log("لا توجد صور في الملف","err"); return; }
    if(barcodes.length===0){ log("لا توجد باركودات — تأكد من العمود","err"); return; }

    // 4) نربط بالترتيب: صورة[i] ← باركود[i]
    const count = Math.min(mediaNames.length, barcodes.length);
    matched = [];
    for(let i=0;i<count;i++){
      const blob = await zip.files[mediaNames[i]].async("base64");
      const ext = mediaNames[i].split(".").pop();
      const dataUrl = `data:image/${ext};base64,${blob}`;
      const small = await shrink(dataUrl);
      matched.push({ barcode: items[i].barcode, name: items[i].name, img: small });
    }

    log(`تم ربط ${matched.length} صورة بباركوداتها ✓`,"ok");

    // معاينة أول 30
    $("preview").innerHTML = matched.slice(0,30).map(m=>`
      <div class="row"><img src="${m.img}"/><div><div class="nm">${m.name||"—"}</div><div class="bc">${m.barcode}</div></div></div>`).join("")
      + (matched.length>30?`<div style="text-align:center;color:#888;font-size:12px">و ${matched.length-30} أكثر…</div>`:"");
    $("previewCard").style.display = "block";

  } catch(err){ log("خطأ: "+err.message,"err"); }
};

$("saveBtn").onclick = async () => {
  if(matched.length===0) return;
  // نحسب الحجم الكلي التقريبي
  const totalBytes = matched.reduce((s,m)=>s+(m.img?.length??0)*0.75, 0);
  const mb = (totalBytes/1024/1024).toFixed(1);
  log(`الحجم الكلي: ~${mb} ميجا (${matched.length} صورة)`,"info");
  if(totalBytes > 4*1024*1024){
    log(`⚠️ الحجم كبير (${mb}م) — قد يرفضه النظام. لو فشل، قلّل عدد الصور`,"err");
  }
  log("جاري الحفظ في النظام…","info");
  try {
    // نجيب الصور الحالية
    const res = await fetch(`${SUPABASE_URL}/rest/v1/${TABLE}?key=eq.${IMAGES_KEY}&select=value`,
      { headers:{ apikey:SUPABASE_KEY, Authorization:`Bearer ${SUPABASE_KEY}` } });
    const rows = await res.json();
    let images = {};
    if(rows?.length){ try{ images = JSON.parse(rows[0].value); }catch{} }

    // نضيف الجديدة
    matched.forEach(m=>{ images[m.barcode] = m.img; });

    // نحفظ
    const save = await fetch(`${SUPABASE_URL}/rest/v1/${TABLE}`, {
      method:"POST",
      headers:{ apikey:SUPABASE_KEY, Authorization:`Bearer ${SUPABASE_KEY}`, "Content-Type":"application/json", Prefer:"resolution=merge-duplicates" },
      body: JSON.stringify({ key:IMAGES_KEY, value:JSON.stringify(images), updated_at:new Date().toISOString() })
    });
    if(save.ok) log(`✅ تم حفظ ${matched.length} صورة! افتح النظام واضغط تحديث`,"ok");
    else log("فشل الحفظ — حاول مرة ثانية","err");
  } catch(err){ log("خطأ بالحفظ: "+err.message,"err"); }
};
</script>
</body>
</html>
