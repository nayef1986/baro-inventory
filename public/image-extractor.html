<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>أداة استخراج صور المنتجات — البارو</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap');
  *{font-family:'Cairo',sans-serif;box-sizing:border-box;margin:0;padding:0}
  body{background:#0a0804;color:#f0e6d0;padding:16px;max-width:480px;margin:0 auto}
  h1{font-size:20px;color:#fff;margin-bottom:4px}
  .sub{font-size:12px;color:#d4a853;margin-bottom:16px}
  .card{background:rgba(255,255,255,0.04);border:1px solid rgba(212,168,83,0.2);border-radius:16px;padding:16px;margin-bottom:14px}
  .drop{border:2px dashed #d4a853;border-radius:14px;padding:30px;text-align:center;cursor:pointer}
  .drop input{display:none}
  .btn{width:100%;padding:13px;border:none;border-radius:13px;background:linear-gradient(135deg,#d4a853,#b8935a);color:#0a0804;font-size:14px;font-weight:900;cursor:pointer;font-family:'Cairo';margin-top:10px}
  .btn:disabled{opacity:0.5}
  .btn2{background:linear-gradient(135deg,#8aab8e,#6f9173)}
  .row{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,0.04);border-radius:10px;padding:8px;margin-bottom:6px}
  .row img{width:48px;height:48px;object-fit:cover;border-radius:8px}
  .row .bc{font-family:monospace;font-size:12px;color:#d4a853}
  .row .nm{font-size:12px;color:#fff}
  .log{font-size:12px;padding:8px;border-radius:8px;margin-bottom:4px}
  .ok{background:rgba(34,197,94,0.15);color:#22c55e}
  .err{background:rgba(232,133,90,0.15);color:#e8855a}
  .info{background:rgba(96,165,250,0.15);color:#60a5fa}
  .prog{height:8px;background:rgba(255,255,255,0.1);border-radius:100px;overflow:hidden;margin:10px 0}
  .prog div{height:100%;background:#d4a853;transition:width 0.3s}
</style>
</head>
<body>
<h1>📷 أداة استخراج صور المنتجات</h1>
<div class="sub">ترفع ملف الفاتورة بالصور · تستخرج وتربط بالنظام · ALBAROO</div>

<div class="card">
  <label class="drop">
    <div style="font-size:36px">📊</div>
    <div style="font-weight:700;margin-top:8px" id="fname">اختر ملف Excel (بالصور)</div>
    <div style="font-size:11px;color:#888;margin-top:4px">نفس فاتورة المشتريات + عمود الصور</div>
    <input type="file" id="file" accept=".xlsx">
  </label>
</div>

<div id="status"></div>

<div class="card" id="previewCard" style="display:none">
  <div style="font-weight:900;color:#fff;margin-bottom:10px">معاينة الربط (تأكد قبل الحفظ)</div>
  <div id="preview"></div>
  <button class="btn btn2" id="saveBtn">💾 احفظ الكل في النظام</button>
</div>

<script>
const SUPABASE_URL = "https://tvxxprynqeufzlgleurm.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InR2eHhwcnlucWV1ZnpsZ2xldXJtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkwNjk4NTAsImV4cCI6MjA5NDY0NTg1MH0.FfHtUehBX0yjZsuMiE8Z8UP7bE1Ii_RFB5FKT4EJuXk";
const TABLE = "baro_store";
const IMAGES_KEY = "baro_images_v2";

let matched = [];

const $ = id => document.getElementById(id);
function log(msg, type="info"){ const d=document.createElement("div"); d.className="log "+type; d.textContent=msg; $("status").appendChild(d); }

// جودة عالية (Storage يتحمّل) — 800px واضحة وحادة
function shrink(dataUrl, max=800, q=0.85){
  return new Promise(res=>{
    const img=new Image();
    img.onload=()=>{
      let {width:w,height:h}=img;
      if(w>max||h>max){ if(w>h){h=Math.round(h*max/w);w=max;}else{w=Math.round(w*max/h);h=max;} }
      const c=document.createElement("canvas"); c.width=w; c.height=h;
      c.getContext("2d").drawImage(img,0,0,w,h);
      res(c.toDataURL("image/jpeg",q));
    };
    img.onerror=()=>res(null);
    img.src=dataUrl;
  });
}

$("file").onchange = async (e) => {
  const f = e.target.files[0];
  if(!f) return;
  $("fname").textContent = f.name;
  $("status").innerHTML = "";
  $("previewCard").style.display = "none";
  log("جاري فتح الملف…","info");

  try {
    const buf = await f.arrayBuffer();
    const zip = await JSZip.loadAsync(buf);
    const names = Object.keys(zip.files);

    // 1) sharedStrings
    const ssName = names.find(n=>/xl\/sharedStrings\.xml/i.test(n));
    let shared = [];
    if(ssName){
      const ss = await zip.files[ssName].async("string");
      shared = [...ss.matchAll(/<si>([\s\S]*?)<\/si>/g)].map(m=>
        [...m[1].matchAll(/<t[^>]*>([^<]*)<\/t>/g)].map(x=>x[1]).join(""));
    }

    // 2) sheet1 — صف → باركود (نقرأ خلايا العمود C = ITEM NO)
    const sheetXml = await zip.files["xl/worksheets/sheet1.xml"].async("string");
    const rowBarcode = {};
    [...sheetXml.matchAll(/<row r="(\d+)"[^>]*>([\s\S]*?)<\/row>/g)].forEach(rm=>{
      const row = parseInt(rm[1]);
      const cells = rm[2];
      // كل خلية: <c r="C6" s="7" t="s"><v>8</v></c> — t قد يكون بأي موضع
      [...cells.matchAll(/<c\s+r="([A-Z]+)\d+"([^>]*)>\s*<v>([^<]*)<\/v>/g)].forEach(cm=>{
        const col = cm[1];
        const attrs = cm[2];
        const v = cm[3];
        const isStr = /t="s"/.test(attrs);
        let val = isStr ? (shared[parseInt(v)] ?? "") : v;
        val = String(val).trim();
        if(/^\d{8}B\d{3}$/.test(val) || /^\d{12,13}$/.test(val)){
          rowBarcode[row] = val;
        }
      });
    });
    log(`صفوف فيها باركود: ${Object.keys(rowBarcode).length}`,"info");

    // 3) rels: rId → ملف الصورة
    const relName = names.find(n=>/drawings\/_rels\/drawing1\.xml\.rels/i.test(n));
    const relMap = {};
    if(relName){
      const rels = await zip.files[relName].async("string");
      [...rels.matchAll(/Id="(rId\d+)"[^>]*Target="([^"]+)"/g)].forEach(m=>{
        relMap[m[1]] = "xl/" + m[2].replace(/^\.\.\//,"");
      });
    }

    // 4) drawing1: كل anchor → صف الصورة + rId
    const dxml = await zip.files["xl/drawings/drawing1.xml"].async("string");
    const anchors = dxml.split(/<xdr:twoCellAnchor/).slice(1);
    const imgAnchors = [];
    anchors.forEach(a=>{
      const rowM = a.match(/<xdr:from>[\s\S]*?<xdr:row>(\d+)<\/xdr:row>/);
      const embM = a.match(/r:embed="(rId\d+)"/);
      if(rowM && embM){
        imgAnchors.push({ row: parseInt(rowM[1]) + 1, media: relMap[embM[1]] });
      }
    });
    log(`صور بمواقع: ${imgAnchors.length}`,"info");

    // 5) نربط كل صورة بباركود صفها (xdr:row صفر-based، الصف الفعلي +1)
    matched = [];
    const seen = new Set();
    for(const ia of imgAnchors){
      // نلقى باركود نفس الصف، أو الصف القريب (±2)
      let bc = rowBarcode[ia.row];
      if(!bc){ for(let d=1;d<=2;d++){ if(rowBarcode[ia.row+d]){bc=rowBarcode[ia.row+d];break;} if(rowBarcode[ia.row-d]){bc=rowBarcode[ia.row-d];break;} } }
      if(!bc) continue;
      if(!ia.media || !zip.files[ia.media]) continue;
      const blob = await zip.files[ia.media].async("base64");
      const ext = ia.media.split(".").pop();
      const small = await shrink(`data:image/${ext};base64,${blob}`);
      if(small){
        // لو الباركود مكرر، آخر صورة (عادي)
        if(!seen.has(bc)) matched.push({ barcode: bc, name:"", img: small });
        else { const idx = matched.findIndex(x=>x.barcode===bc); if(idx>=0) matched[idx].img = small; }
        seen.add(bc);
      }
    }
    log(`تم ربط ${matched.length} صورة بباركودها (بالموقع) ✓`,"ok");
    if(matched.length===0){ log("لم يُربط شي — أرسل تشخيص جديد","err"); return; }

    // معاينة أول 30
    $("preview").innerHTML = matched.slice(0,30).map(m=>`
      <div class="row"><img src="${m.img}"/><div><div class="nm">${m.name||"—"}</div><div class="bc">${m.barcode}</div></div></div>`).join("")
      + (matched.length>30?`<div style="text-align:center;color:#888;font-size:12px">و ${matched.length-30} أكثر…</div>`:"");
    $("previewCard").style.display = "block";

  } catch(err){ log("خطأ: "+err.message,"err"); }
};

// تحويل dataURL لـ blob
function dataUrlToBlob(dataUrl){
  const [head, b64] = dataUrl.split(",");
  const mime = head.match(/:(.*?);/)[1];
  const bin = atob(b64);
  const arr = new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) arr[i]=bin.charCodeAt(i);
  return new Blob([arr], {type:mime});
}

const BUCKET = "product-images";

$("saveBtn").onclick = async () => {
  if(matched.length===0) return;
  log(`جاري رفع ${matched.length} صورة لـ Storage…`,"info");
  let done=0, failed=0;
  const urls = {}; // باركود → رابط الصورة

  // نرفع كل صورة لـ Storage
  for(const m of matched){
    try {
      const blob = dataUrlToBlob(m.img);
      const safeName = m.barcode.replace(/[^A-Za-z0-9]/g,"_") + ".jpg";
      const up = await fetch(`${SUPABASE_URL}/storage/v1/object/${BUCKET}/${safeName}`, {
        method:"POST",
        headers:{ apikey:SUPABASE_KEY, Authorization:`Bearer ${SUPABASE_KEY}`, "Content-Type":"image/jpeg", "x-upsert":"true" },
        body: blob,
      });
      if(up.ok || up.status===200){
        urls[m.barcode] = `${SUPABASE_URL}/storage/v1/object/public/${BUCKET}/${safeName}`;
        done++;
      } else { failed++; }
    } catch { failed++; }
    if((done+failed)%25===0) log(`تقدّم: ${done+failed}/${matched.length}`,"info");
  }
  log(`رُفع ${done} · فشل ${failed}`,"ok");

  // نحفظ الروابط في النظام (نص صغير — ما يثقّل)
  try {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/${TABLE}?key=eq.${IMAGES_KEY}&select=value`,
      { headers:{ apikey:SUPABASE_KEY, Authorization:`Bearer ${SUPABASE_KEY}` } });
    const rows = await res.json();
    let images = {};
    if(rows?.length){ try{ images = JSON.parse(rows[0].value); }catch{} }
    Object.assign(images, urls); // نضيف/نحدّث الروابط
    const save = await fetch(`${SUPABASE_URL}/rest/v1/${TABLE}`, {
      method:"POST",
      headers:{ apikey:SUPABASE_KEY, Authorization:`Bearer ${SUPABASE_KEY}`, "Content-Type":"application/json", Prefer:"resolution=merge-duplicates" },
      body: JSON.stringify({ key:IMAGES_KEY, value:JSON.stringify(images), updated_at:new Date().toISOString() })
    });
    if(save.ok) log(`✅ تم! ${done} صورة في Storage + روابطها بالنظام. افتح النظام وحدّث`,"ok");
    else log("رُفعت الصور بس فشل حفظ الروابط","err");
  } catch(err){ log("خطأ بحفظ الروابط: "+err.message,"err"); }
};
</script>
</body>
</html>
